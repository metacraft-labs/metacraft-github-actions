name: Setup Nix Environment
description: >
  Install Nix, configure nix.conf with access-tokens and netrc for private
  GitHub repos, set up Git URL rewrites for authenticated submodule cloning,
  and configure the caller-provided binary caches.

inputs:
  gh-token:
    description: GitHub token for accessing private repos
    required: true
  token-owner:
    description: >
      Whitespace-separated GitHub owner(s) whose repositories `gh-token` is
      allowed to authenticate. The Git CLI credential is installed as an
      `http.https://github.com/<owner>/.extraHeader`, so it covers those owners'
      repositories and nothing else — not nixpkgs, not `nim-lang/*`, not any
      other third party a build happens to fetch from github.com.
    required: false
    default: "metacraft-labs"
  extra-token-url-prefixes:
    description: >
      Optional whitespace/newline-separated extra `https://github.com/...` URL
      prefixes the Git CLI credential should also cover. Name the repository
      (e.g. `https://github.com/some-partner/one-repo.git`) or that owner's
      prefix (`https://github.com/some-partner/`). Matching is by slash-delimited
      path prefix, so naming one repository does not authenticate its
      neighbours.

      Two distinct uses, and the second one is easy to miss. (1) A cross-org
      PRIVATE clone authenticated by a per-repo minted secret. (2) A cross-org
      PUBLIC fetch that needs to stop being anonymous: GitHub accepts any VALID
      credential on a public repository without requiring it to be scoped to
      that repository, so this org's own App installation token authenticates
      e.g. `https://github.com/status-im/` and lifts those fetches off the
      per-IP unauthenticated budget the whole ephemeral fleet shares. Measured
      in run 34273033056; see `reprobuild-provision/provision-reprobuild-siblings.sh`.
      Use (2) is the fix for a third-party fetch that fails INTERMITTENTLY under
      fleet load, which is the shape a shared anonymous quota produces.
    required: false
    default: ""
  substituters:
    description: Additional Nix substituters
    required: false
    default: ""
  trusted-public-keys:
    description: Additional trusted public keys for Nix substituters
    required: false
    default: ""
  attic-token:
    description: Attic token used to upload newly built store paths.
    required: false
    default: ""
  attic-cache:
    description: Attic cache name to upload newly built store paths to.
    required: false
    default: ""
  attic-endpoint:
    description: Attic server endpoint.
    required: false
    default: "https://cache.metacraft-labs.com/"

runs:
  using: "composite"
  steps:
    - name: Detect pre-installed Nix
      # macOS-15-arm64 hosted runners ship images where `_nixbld1` may
      # already exist (or where a previous Nix volume is mounted). Skip the
      # installer entirely if nix is already on PATH.
      id: nix_check
      shell: bash
      run: |
        if command -v nix >/dev/null 2>&1; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Nix
      if: steps.nix_check.outputs.preinstalled != 'true'
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        determinate: false

    - name: Configure Nix authentication
      shell: bash
      env:
        # Routed through `env:` rather than interpolated into the script body:
        # `${{ }}` interpolation is textual substitution into the command file
        # the runner writes to disk and executes, so the secret ends up in that
        # file and in any `set -x` trace of it. An env var is neither.
        GH_TOKEN: ${{ inputs.gh-token }}
        EXTRA_SUBSTITUTERS: ${{ inputs.substituters }}
        EXTRA_TRUSTED_PUBLIC_KEYS: ${{ inputs.trusted-public-keys }}
      run: |
        set -euo pipefail
        echo "::add-mask::$GH_TOKEN"

        # nix.conf and netrc both carry the token. `umask 077` is not
        # cosmetic: on the self-hosted runners in this org $HOME is reused
        # between jobs, so these files are readable by whatever runs next
        # unless they are mode 600.
        umask 077
        mkdir -p "$HOME/.config/nix"

        # NOTE (scoping): unlike the Git CLI credential installed below, these
        # two mechanisms are HOST-granular and stay that way here, deliberately:
        #
        #   * `netrc` has no path granularity at all — `machine github.com` is
        #     the finest scope the format has.
        #   * `access-tokens` DOES support `github.com/<owner>=<token>` (Nix
        #     matches the entry as a slash-delimited prefix of host+path), but
        #     that landed in Nix 2025-02. This action deliberately SKIPS
        #     installing Nix when one is already present (pre-installed
        #     ephemeral images, NixOS runners), so the running Nix version is not
        #     something this action controls, and an older one would read
        #     `github.com/<owner>=` as an entry matching nothing — silently
        #     unauthenticating every private flake input in the org.
        #
        # Both send the token only to github.com, which issued it.
        #
        # THE EXPOSURE IS NARROWER THAN THIS COMMENT USED TO CLAIM, and the
        # difference is worth stating because the old wording sent a diagnosis
        # in exactly the wrong direction. It said "Nix attaches it to fetches of
        # third-party github.com repos". Nix attaches neither of these to a
        # `git+https://` fetch. That fetcher shells out to the `git` BINARY
        # (`GitRepoImpl::fetch` in `src/libfetchers/git-utils.cc`) and passes it
        # no credential at all: no `-c http.extraHeader`, no `GIT_CONFIG_*`, no
        # `NETRC`. Verified two ways -- by intercepting the `git` argv+env Nix
        # actually execs (identical on 2.25.2, 2.28.5 and 2.28.7), and by
        # grepping `libfetchers/{git,git-utils}.cc` at 2.25.2, 2.28.7 and
        # 2.35.2, where `netrc`, `accessToken`, `extraHeader` and
        # `Authorization` do not appear at all.
        #
        # So these two reach `github:`/tarball and `builtins.fetch*` traffic,
        # NOT git fetches. A third-party `git+https://` flake input is fetched
        # ANONYMOUSLY, which is a different problem with the opposite sign: it
        # rides GitHub's per-IP unauthenticated budget, shared by the whole
        # ephemeral-runner fleet, and 401s under load with `fatal: could not
        # read Username for 'https://github.com'`. Note what that message
        # proves: git had NO credential to offer. A REJECTED credential reads
        # `remote: Invalid username or token` instead. The two are worth telling
        # apart before concluding which way to move a token.
        #
        # Narrowing `access-tokens` to `github.com/<owner>=` still needs the
        # Nix version floor described above, and is still a separate change.
        cat << EOF > "$HOME/.config/nix/nix.conf"
          # Enable flakes + nix-command additively, so this holds even when the
          # DeterminateSystems installer is skipped because Nix is pre-installed
          # (e.g. the Debian vmh-linux-runner ephemeral image, whose system
          # nix.conf does not enable flakes). extra-experimental-features
          # appends rather than replaces, so NixOS runners keep pipe-operators.
          extra-experimental-features = nix-command flakes
          accept-flake-config = true
          allow-import-from-derivation = true
          fallback = true
          connect-timeout = 3
          download-attempts = 1
          narinfo-cache-negative-ttl = 0
          substituters = https://cache.nixos.org $EXTRA_SUBSTITUTERS
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= $EXTRA_TRUSTED_PUBLIC_KEYS
          netrc-file = $HOME/.config/nix/netrc
          access-tokens = github.com=$GH_TOKEN
        EOF

        # Create netrc for Nix's internal git fetcher (needed for
        # ?submodules=1 flake references that clone via git)
        printf 'machine github.com login x-access-token password %s\n' \
          "$GH_TOKEN" > "$HOME/.config/nix/netrc"

    - name: Configure Git authentication
      # Scoped to the org's own repositories and to this job. See the long
      # rationale in configure-git-auth.sh; in short, the credential this used
      # to install was a global, URL-embedded, catch-all rewrite, and each of
      # those three words was a separate problem. Contract suite:
      # setup-nix/configure-git-auth-test.sh.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        TOKEN_OWNERS: ${{ inputs.token-owner }}
        EXTRA_TOKEN_URL_PREFIXES: ${{ inputs.extra-token-url-prefixes }}
      run: bash "${{ github.action_path }}/configure-git-auth.sh"

    - name: Start Attic watch-store
      if: ${{ inputs.attic-token != '' && inputs.attic-cache != '' }}
      shell: bash
      env:
        ATTIC_TOKEN: ${{ inputs.attic-token }}
        ATTIC_CACHE: ${{ inputs.attic-cache }}
        ATTIC_ENDPOINT: ${{ inputs.attic-endpoint }}
      run: |
        set -euo pipefail
        echo "::add-mask::$ATTIC_TOKEN"

        attic=(nix shell --accept-flake-config nixpkgs#attic-client -c attic)
        "${attic[@]}" login --set-default ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

        log="${RUNNER_TEMP:-/tmp}/attic-watch-store.log"
        nohup "${attic[@]}" watch-store \
          --jobs 1 \
          "$ATTIC_CACHE" >"$log" 2>&1 &
        echo "$!" > "${RUNNER_TEMP:-/tmp}/attic-watch-store.pid"
        echo "Attic watch-store started for $ATTIC_CACHE (log: $log)"
