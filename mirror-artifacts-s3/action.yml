name: Mirror artifacts to the in-house S3 store
description: >
  Non-blocking mirror of a CI artifact directory to the Metacraft in-house S3
  artifact store (Garage on high-mem-server, over the NetBird VPN). Moves the
  bulk of artifact bytes off GitHub's org-wide, quota-limited Actions artifact
  storage. Skips cleanly — never failing — when the repo is not onboarded (no
  credential), when the store is unreachable, or when no S3 client is available
  on the runner. See metacraft-dev-guidelines
  policies/ci-workflow-standards.md § In-house artifact store.

  The caller is still responsible for `if: always()` and
  `continue-on-error: true` on the `uses:` step; this action additionally never
  exits non-zero, so a mirror hiccup can never fail CI.

inputs:
  path:
    description: Directory (or file) to mirror, relative to the workspace.
    required: true
  prefix:
    description: >
      Object-key prefix under the bucket. Defaults to
      `<basename(path)>/<run_id>`. Pass a stable, collision-free value (e.g. the
      artifact name + run id) when mirroring several paths in one job.
    required: false
    default: ""
  endpoint:
    description: S3 endpoint (pass `${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}`).
    required: false
    default: ""
  bucket:
    description: Bucket name (pass `${{ vars.MCL_S3_ARTIFACTS_BUCKET }}`).
    required: false
    default: "ci-artifacts"
  region:
    description: Region (pass `${{ vars.MCL_S3_ARTIFACTS_REGION }}`).
    required: false
    default: "garage"
  access-key-id:
    description: S3 access key id (pass `${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}`).
    required: false
    default: ""
  secret-access-key:
    description: S3 secret access key (pass `${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}`).
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Mirror ${{ inputs.path }} to S3 (non-blocking)
      shell: bash
      env:
        MCL_S3_ENDPOINT: ${{ inputs.endpoint }}
        MCL_S3_BUCKET: ${{ inputs.bucket }}
        MCL_S3_REGION: ${{ inputs.region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_EC2_METADATA_DISABLED: "true"
        MCL_S3_PATH: ${{ inputs.path }}
        MCL_S3_PREFIX: ${{ inputs.prefix }}
      run: |
        set -u
        # Onboarding guard: a repo without the credential is simply not onboarded.
        if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${MCL_S3_ENDPOINT:-}" ]]; then
          echo "In-house S3 artifact store not configured for this repo; skipping mirror."
          exit 0
        fi
        # Nothing to upload is not an error.
        if [[ ! -e "$MCL_S3_PATH" ]]; then
          echo "Path '$MCL_S3_PATH' does not exist; nothing to mirror."
          exit 0
        fi
        # Resolve an S3 client: prefer one on PATH, else borrow awscli2 from nix.
        aws_cmd=""
        if command -v aws >/dev/null 2>&1; then
          aws_cmd="aws"
        elif command -v nix >/dev/null 2>&1; then
          aws_cmd="nix shell nixpkgs#awscli2 -c aws"
        else
          echo "::warning title=S3 artifact mirror::no aws/nix on this runner; skipping mirror (GitHub artifact retained)"
          exit 0
        fi
        prefix="${MCL_S3_PREFIX:-}"
        if [[ -z "$prefix" ]]; then
          prefix="$(basename "$MCL_S3_PATH")/${GITHUB_RUN_ID:-manual}"
        fi
        dest="s3://${MCL_S3_BUCKET:-ci-artifacts}/${prefix%/}/"
        cp_flag=""
        [[ -d "$MCL_S3_PATH" ]] && cp_flag="--recursive"
        # shellcheck disable=SC2086
        if $aws_cmd --endpoint-url "$MCL_S3_ENDPOINT" --region "${MCL_S3_REGION:-garage}" \
             s3 cp $cp_flag "$MCL_S3_PATH" "$dest"; then
          echo "Mirrored '$MCL_S3_PATH' to $dest"
        else
          echo "::warning title=S3 artifact mirror::upload failed (non-blocking); GitHub artifact retained"
        fi
        exit 0
