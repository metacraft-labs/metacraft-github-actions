name: Mirror artifacts to the in-house S3 store
description: >
  Non-blocking mirror of a CI artifact directory to the Metacraft in-house S3
  artifact store (Garage on high-mem-server, over the NetBird VPN). Moves the
  bulk of artifact bytes off GitHub's org-wide, quota-limited Actions artifact
  storage. Skips cleanly — never failing — when the repo is not onboarded (no
  credential), when the store is unreachable, or when no S3 client is available
  on the runner, and stops an upload that outlives `timeout-minutes`. See
  metacraft-dev-guidelines policies/ci-workflow-standards.md § In-house artifact store.

  The caller is still responsible for `if: always()` and
  `continue-on-error: true` on the `uses:` step; this action additionally never
  exits non-zero, so a mirror hiccup can never fail CI.

inputs:
  path:
    description: Directory (or file) to mirror, relative to the workspace.
    required: true
  prefix:
    description: >
      Object-key prefix under the bucket. Defaults to
      `<basename(path)>/<run_id>`. Pass a stable, collision-free value (e.g. the
      artifact name + run id) when mirroring several paths in one job.
    required: false
    default: ""
  endpoint:
    description: S3 endpoint (pass `vars.MCL_S3_ARTIFACTS_ENDPOINT`).
    required: false
    default: ""
  bucket:
    description: Bucket name (pass `vars.MCL_S3_ARTIFACTS_BUCKET`).
    required: false
    default: "ci-artifacts"
  region:
    description: Region (pass `vars.MCL_S3_ARTIFACTS_REGION`).
    required: false
    default: "garage"
  access-key-id:
    description: S3 access key id (pass `secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID`).
    required: false
    default: ""
  secret-access-key:
    description: S3 secret access key (pass `secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY`).
    required: false
    default: ""
  timeout-minutes:
    description: >
      Wall-clock bound on the upload. When it expires the S3 client and its
      children are stopped, a warning is emitted and the step still succeeds.
      A composite step cannot take `timeout-minutes` itself, so the bound is
      enforced inside the action.
    required: false
    default: "10"

runs:
  using: "composite"
  steps:
    - name: Mirror ${{ inputs.path }} to S3 (non-blocking)
      shell: bash
      env:
        MCL_S3_ENDPOINT: ${{ inputs.endpoint }}
        MCL_S3_BUCKET: ${{ inputs.bucket }}
        MCL_S3_REGION: ${{ inputs.region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_EC2_METADATA_DISABLED: "true"
        # AWS CLI v2 defaults to WHEN_SUPPORTED, which attaches a checksum
        # algorithm to every PutObject and asks for one back. The in-house S3
        # store does not implement that negotiation and rejects the request
        # outright ("InvalidRequest: Bad request: invalid checksum algorithm"),
        # so every upload failed while the step still exited 0. WHEN_REQUIRED
        # keeps checksums for the operations the S3 API genuinely requires them
        # on, and drops them elsewhere.
        AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        MCL_S3_PATH: ${{ inputs.path }}
        MCL_S3_PREFIX: ${{ inputs.prefix }}
        MCL_S3_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        # Test-only overrides of the bound in mirror.sh. Blanked here so a
        # job-level `env:` cannot lengthen or shorten a production bound.
        MCL_S3_TIMEOUT_SECONDS: ""
        MCL_S3_KILL_GRACE_SECONDS: ""
      # The body lives in mirror.sh so the contract suite can run the shipped
      # script; see that file for why the upload is time-bounded there.
      run: bash "${GITHUB_ACTION_PATH}/mirror.sh"
