# THE PUBLISHER OF LAST RESORT, AND ONLY FOR COMMITS NOBODY ELSE CAN PUBLISH.
#
# The workspace lock for a commit is published by the LOCAL pre-push gate. That
# is the reproducibility boundary and it stays the boundary: this action does
# not create a lock, does not resolve siblings, does not consult a branch tip,
# and cannot invent a pin. It re-files a lock the pre-push gate ALREADY
# published, onto the mainline commit that landed that same content.
#
# It exists because there is exactly one class of commit the pre-push gate
# structurally cannot reach: the mainline commit GitHub creates server-side when
# a pull request is merged, squashed or rebased. No hook runs there. On
# `metacraft-labs/codetracer@dev` and `metacraft-labs/infra@live` that is EVERY
# mainline commit — measured over the last 30 first-parent commits of each, zero
# carry a lock.
#
# A SECOND, SEPARATE GAP, which this action does not close and must not hide.
# Only a MINORITY of pull request heads carry a lock either: over the last 24
# merged pull requests, 4 of codetracer's and 3 of infra's heads were locked.
# That is a gap in hook COVERAGE — a branch pushed from a workspace without the
# managed hooks installed, or with `--no-verify`, never reaches the pre-push
# gate — and no amount of server-side re-anchoring can invent the record it did
# not produce. This action fails loudly and names the remedy when the source
# lock is missing, which is how that condition stops being invisible.
#
# `clone-siblings` probes exactly those mainline commits (`pull_request` ->
# `base.sha`, `push` -> `github.sha` then `github.event.before`) with
# `--no-walk`, and its own comment states the premise it relies on: "all
# mainline commits the pre-push hook locks". This action makes that premise
# true. It is deliberately NOT a relaxation of `--no-walk` into an ancestry
# walk, which would (a) not rescue `infra` at all, whose nearest locked
# first-parent ancestor is outside 30 commits, and (b) answer a merge commit
# with pins that PREDATE the merge — precisely wrong for a PR whose whole
# content is a sibling bump.
#
# AND THE CARRY IS BOUNDED BY WHAT THE RECORD CAN STILL BE TRUE OF.
#
# A re-file is sound as far as the record's claim still holds at the commit it
# is filed under. The `push` wiring stretches that by one commit per push
# (`github.event.before` supplies the set, `github.sha` receives it), so a
# mainline commit's recorded composition was observed at an ancestor and
# carried forward link by link. For a commit that moved no sibling that is the
# whole point of the chain; for a commit that BUMPED one the carried set does
# not merely lag, it CONTRADICTS the commit it names -- and publication is
# additions-only, so that coordinate is then burned and the real composition
# can never be recorded there. This action REFUSES that case instead of
# publishing it, decided from the repo's own committed `repro.lock` -- its
# declaration of the composition -- compared tree-to-tree across the carried
# span. The remedy it names is the only honest one: OBSERVE the set from a
# real workspace (`refresh-workspace-lock`), do not carry it.
name: Publish the workspace lock for a merged mainline commit
description: >
  Re-anchor the workspace lock record published for a pull request's HEAD
  commit onto the mainline commit that landed it, and publish that record to
  the manifests repo.

  The recorded sibling set is the PR head's, verbatim: every `[[repo]]` pin is
  copied byte-for-byte and precisely one field changes — the record's own
  coordinate, the entry naming the repo itself, whose revision moves from the
  PR head SHA to the mainline SHA. That rewrite is mandatory rather than
  cosmetic: a lock record is bound to its filename (reprobuild's publisher
  accepts a staged record only when its body anchors the repo at the SHA in the
  path), so a byte copy under a new name would be a record contradicting its
  own key.

  Publication is ADDITIONS-ONLY and a published record is IMMUTABLE. A
  destination that already exists with identical bytes is an idempotent
  success; one that exists with different bytes is a hard failure and is never
  rewritten. Two merges landing seconds apart both end up published: a lost
  push race is detected by shape, the layer checkout is fast-forwarded onto the
  new tip and the work is re-applied, because lock records are commit-addressed
  and therefore disjoint additions.

  Nothing is published until the target commit has been PROVEN to be an
  ancestor of the base branch, from the repo's real history. That is what
  stands between this action and a payload's `merge_commit_sha` naming a test
  merge that never landed.

inputs:
  gh-token:
    description: >
      GitHub token with WRITE access to the manifests repo and read access to
      the repo whose lock is being published. This is the one input that makes
      this action different from every other action here: it needs a
      credential that can push.
    required: true
  repo:
    description: >
      owner/name of the repo whose mainline commit is being locked. Defaults to
      the calling repository.
    required: false
    default: ""
  source-sha:
    description: >
      The commit whose published lock supplies the sibling set — the pull
      request's HEAD commit, which the pre-push gate locked.
    required: true
  target-sha:
    description: >
      The mainline commit to publish the lock for — the commit GitHub created
      when the pull request merged (`merge_commit_sha`, whatever the merge
      strategy).
    required: true
  base-ref:
    description: >
      The mainline branch the pull request merged into (`dev`, `live`, `main`).
      `target-sha` must be an ancestor of it, and is checked against the real
      remote history before anything is published.
    required: true
  provenance:
    description: >
      Free text naming what produced the mainline commit (e.g. "pull request
      #652"). It goes into the publishing commit message and NOWHERE ELSE — the
      record schema is read in strict mode, so a provenance key inside the
      record would make the record unreadable by the tool that owns it.
    required: false
    default: ""
  manifests-repo:
    description: owner/name of the PUBLIC (base) manifest repo holding the locks.
    required: false
    default: "metacraft-labs/metacraft-manifests"
  manifests-ref:
    description: Branch of the manifests repo to publish onto.
    required: false
    default: "latest"
  private-manifests-repo:
    description: >
      owner/name of an optional access-controlled manifest layer. When set, it
      is searched and published to on the same terms as the public layer: a
      repo whose lock lives in the private layer gets its re-anchored record
      there, never demoted into the public one.
    required: false
    default: ""
  private-manifests-ref:
    description: Branch of the private manifests repo. Defaults to `manifests-ref`.
    required: false
    default: ""
  token-owner:
    description: >
      Whitespace-separated GitHub owner(s) the token is scoped to. Used to
      derive the process-scoped credential, exactly as `clone-siblings` does,
      so the token never reaches a URL or a `.git/config`.
    required: false
    default: "metacraft-labs"
  committer-name:
    description: Name recorded on the publishing commit.
    required: false
    default: "metacraft-ci"
  committer-email:
    description: Email recorded on the publishing commit.
    required: false
    default: "ci@metacraft-labs.com"

runs:
  using: composite
  steps:
    - name: Publish the workspace lock for the merged mainline commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        INPUT_REPO: ${{ inputs.repo }}
        DEFAULT_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        TARGET_SHA: ${{ inputs.target-sha }}
        BASE_REF: ${{ inputs.base-ref }}
        PROVENANCE: ${{ inputs.provenance }}
        MANIFESTS_REPO: ${{ inputs.manifests-repo }}
        INPUT_MANIFESTS_REF: ${{ inputs.manifests-ref }}
        PRIVATE_MANIFESTS_REPO: ${{ inputs.private-manifests-repo }}
        INPUT_PRIVATE_MANIFESTS_REF: ${{ inputs.private-manifests-ref }}
        JOB_TOKEN_OWNERS: ${{ inputs.token-owner }}
        COMMITTER_NAME: ${{ inputs.committer-name }}
        COMMITTER_EMAIL: ${{ inputs.committer-email }}
        GIT_AUTH_DIR: ${{ github.action_path }}/../git-auth
        ANCHOR: ${{ github.action_path }}/anchor-workspace-lock.sh
      run: bash "${GITHUB_ACTION_PATH}/publish-workspace-lock.sh"
