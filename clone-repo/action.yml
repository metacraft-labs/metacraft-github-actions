name: Clone Repository
description: >
  Authenticated git clone with optional submodule support.
  Handles private repos, private submodules, self-hosted runner stale state
  cleanup, and Nix-compatible .gitmodules SSH-to-HTTPS conversion.

  The token is never placed in a URL and never written to disk: it travels as
  an `http.https://github.com/<owner>/.extraHeader` in this step's own process
  environment, scoped to the owner of `repo` and to this step. See
  ../git-auth/scoped-git-auth.sh.

inputs:
  repo:
    description: "GitHub repository in owner/name format (e.g. metacraft-labs/codetracer)"
    required: true
  ref:
    description: "Git ref to checkout (commit SHA, branch name, or tag)"
    required: true
  path:
    description: "Local directory to clone into"
    required: true
  gh-token:
    description: "GitHub token for authenticated clone"
    required: true
  submodules:
    description: "Initialize and update submodules, including private ones (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Clone ${{inputs.repo}}
      shell: bash
      # Routed through `env:` rather than interpolated into the script body.
      # `${{ }}` is textual substitution into the command file the runner writes
      # to disk and executes, so an interpolated secret ends up in that file, in
      # any `set -x` trace of it, and in the diagnostics the runner keeps on a
      # self-hosted runner's disk. An env var is none of those. This step used
      # to interpolate the token four times.
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        CLONE_REPO: ${{ inputs.repo }}
        CLONE_REF: ${{ inputs.ref }}
        CLONE_PATH: ${{ inputs.path }}
        CLONE_SUBMODULES: ${{ inputs.submodules }}
        GIT_AUTH_DIR: ${{ github.action_path }}/../git-auth
      run: |
        set -euo pipefail
        echo "Cloning ${CLONE_REPO} at ref: ${CLONE_REF}"

        case "${CLONE_REPO}" in
          */*) ;;
          *)
            echo "::error::clone-repo: 'repo' must be in owner/name form (got '${CLONE_REPO}')" >&2
            exit 1
            ;;
        esac

        # The credential scope is DERIVED from the repository being cloned, so
        # it cannot disagree with it. This is the one place in these actions
        # where the owner needs no configuration and no cross-check: the caller
        # already told us, in `repo`, exactly whose repository this is.
        # shellcheck source=../git-auth/scoped-git-auth.sh
        . "${GIT_AUTH_DIR}/scoped-git-auth.sh"
        export TOKEN_OWNERS="${CLONE_REPO%%/*}"
        export SCOPED_GIT_AUTH_REWRITES=1
        export SCOPED_GIT_AUTH_MASK=1
        scoped_git_auth_build
        scoped_git_auth_export
        scoped_git_auth_report

        args=(--repo "${CLONE_REPO}" --dest "${CLONE_PATH}" --rev "${CLONE_REF}")
        if [ "${CLONE_SUBMODULES}" = "true" ]; then
          # `--commit-https-gitmodules` normalises ssh submodule URLs to https
          # and commits that, so a `?submodules=1` flake reference pinned to a
          # revision can resolve them: Nix resolves submodule URLs with
          # libgit2's git_submodule_resolve_url, which does not apply
          # `insteadOf`, so an scp-style URL never reaches the `git` binary Nix
          # would otherwise inherit this step's configuration through. The
          # committed content is credential-free by construction and
          # authenticated-clone.sh refuses to commit it if that stops being
          # true.
          args+=(--submodules --commit-https-gitmodules)
        fi
        bash "${GIT_AUTH_DIR}/authenticated-clone.sh" "${args[@]}"
