name: Verify RunQuota static-helper ACL setup

on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/verify-runquota-static-helper-acl.yml
      - diagnostics/runquota-static-helper-acl.py
      - diagnostics/runquota-static-helper-acl.ps1

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
      REPRO_TOOL_PROVISIONING: tarball
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 2d07c5de63a24c4869ceddda78c14bbf38b76271
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .diagnostic-tools
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@41d0680bd78ca59ad110a261a20bcaa93a38fffd
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          repro-runquota-pin: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          repro-io-mon-pin: 5e71adf033b860c0fdbe13dda4320cf4a580f632
          repro-stackable-hooks-pin: 43b1835128331fef09ecf64a614dbf46880dbe9f
          gh-token: ${{ steps.token.outputs.token }}
      - name: Check actual DACLs, guard refusal and the complete static-helper gate
        timeout-minutes: 80
        shell: pwsh
        run: repro exec -- python ./.diagnostic-tools/diagnostics/runquota-static-helper-acl.py
      - name: Retain source and real permission evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: runquota-static-helper-acl-${{ matrix.runner }}
          path: build/static-helper-acl-evidence/
          if-no-files-found: error
          retention-days: 14
