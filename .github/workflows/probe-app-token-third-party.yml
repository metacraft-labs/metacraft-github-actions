name: PROBE app token vs third-party public repo
on:
  push:
    branches: [ci/scope-nix-netrc-to-org]
permissions:
  contents: read
jobs:
  probe:
    runs-on: eph-linux-x64
    steps:
      - name: Does an App installation token authenticate a third-party PUBLIC repo?
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          echo "::add-mask::$TOK"
          BLOB="$(printf 'x-access-token:%s' "$TOK" | base64 | tr -d '\n')"
          echo "::add-mask::$BLOB"

          echo "--- A: anonymous (control, must succeed) ---"
          git ls-remote https://github.com/status-im/nim-bearssl HEAD 2>&1 | tail -3
          echo "A_rc=${PIPESTATUS[0]}"

          echo "--- B: installation token, preemptive extraHeader, THIRD-PARTY public repo ---"
          git -c "http.https://github.com/.extraHeader=Authorization: Basic $BLOB" \
              ls-remote https://github.com/status-im/nim-bearssl HEAD 2>&1 | tail -3
          echo "B_rc=${PIPESTATUS[0]}"

          echo "--- C: installation token against its OWN repo (control, must succeed) ---"
          git -c "http.https://github.com/.extraHeader=Authorization: Basic $BLOB" \
              ls-remote https://github.com/${{ github.repository }} HEAD 2>&1 | tail -3
          echo "C_rc=${PIPESTATUS[0]}"
