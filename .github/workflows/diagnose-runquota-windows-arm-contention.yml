name: Diagnose RunQuota Windows ARM test contention

on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/diagnose-runquota-windows-arm-contention.yml
      - diagnostics/runquota-windows-arm-test-contention.ps1
      - diagnostics/runquota-windows-arm-test-contention.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 48bb701c4d628ae206e9ed07fec0126b2ba9f6d3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@ad0535e1305cf59fa2f52dddb1b0cdc6787a0e21
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          repro-runquota-pin: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          repro-io-mon-pin: 5e71adf033b860c0fdbe13dda4320cf4a580f632
          gh-token: ${{ steps.token.outputs.token }}
      - name: Compare unchanged programs with parallel and serial admission
        timeout-minutes: 155
        shell: pwsh
        run: ./.diagnostic-tools/diagnostics/runquota-windows-arm-test-contention.ps1
      - name: Preserve scheduling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runquota-windows-arm-test-contention
          path: |
            build/windows-arm-test-contention/
            .repro/build/*/build-failure-report.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
