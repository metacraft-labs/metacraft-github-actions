          set -euo pipefail
          mkdir -p test-logs/repro-dlopen
          git log -1 --format='%H %s' > test-logs/repro-dlopen/source.txt
          python3 - <<'ALIAS'
          from pathlib import Path
          p = Path('repro.nim')
          s = p.read_text()
          anchor = '    discard collect("test", testExecuteActions)'
          assert s.count(anchor) == 1
          alias = '\n'.join([
              anchor,
              '    var diagnosticDlopen: seq[BuildActionDef] = @[]',
              '    for action in testExecuteActions:',
              '      if action.id == "io-mon.test_execute.test_io_mon_dlopen_caller_runpath":',
              '        diagnosticDlopen.add(action)',
              '    doAssert diagnosticDlopen.len == 1',
              '    discard collect("diagnostic-dlopen", diagnosticDlopen)',
          ])
          p.write_text(s.replace(anchor, alias))
          ALIAS
          git diff -- repro.nim > test-logs/repro-dlopen/recipe-alias.patch
          dev-exec repro build .#diagnostic-dlopen --tool-provisioning=nix \
            --write-report=test-logs/repro-dlopen/report.json \
