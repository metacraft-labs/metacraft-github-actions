  gosti-repro-process-timing:
    if: inputs.product == 'gosti' && inputs.checks == 'gosti-repro-process-timing'
    strategy:
      fail-fast: false
      matrix:
        # x64 passed at the preceding product pins. This supplemental
        # follow-up measures the remaining emulated ARM host only.
        runner: [windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Match the production ARM lane's existing x64-emulation toolchain.
      WINDOWS_DIY_ARCH_OVERRIDE: x64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/gosti
          ref: 581f22529566287c6d1b3a3815a41bade722799c
          persist-credentials: false
      - name: Mint installation token
        id: ci-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Install the same image tools as the full CI environment
        id: qemu-msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-qemu-image-util
          location: ${{ runner.temp }}/gosti-qemu
      - name: Expose QEMU
        shell: pwsh
        env:
          GOSTI_MSYS2_DIR: ${{ steps.qemu-msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:GOSTI_MSYS2_DIR 'ucrt64/bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Provision the CI bootstrap dependencies
        uses: metacraft-labs/metacraft-github-actions/reprobuild-provision@c2b603a08e9ad68096761074951395d1875bb289
        with:
          gh-token: ${{ steps.ci-token.outputs.token }}
          io-mon-ref: d3826a368e0ca8c2760bf5e3270cc3577811af47
      - name: Build the same Reprobuild bootstrap as the full suite
        uses: metacraft-labs/metacraft-github-actions/setup-reprobuild@58da84d5af27408ca598ce69caa83b133e054592
        with:
          gh-token: ${{ steps.ci-token.outputs.token }}
          from-source: true
          repro-build-pin: 1f85ace0037d0a70e966fe8eee645d766522b1ab
      - name: Compare focused Repro actions with direct execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $PWD 'test-logs'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          & git log -1 --format='%H %s' > "$evidence/gosti-source.txt"
          & git -C reprobuild log -1 --format='%H %s' > "$evidence/repro-source.txt"
          & git -C io-mon log -1 --format='%H %s' > "$evidence/monitor-source.txt"
          & git -C nim-stackable-hooks log -1 --format='%H %s' > "$evidence/hooks-source.txt"
          Get-FileHash reprobuild/build/lib/librepro_monitor_shim.dll | Format-List > "$evidence/shim.txt"
          $results = @()
          foreach ($name in @('t_linux_runner_recipe_pin')) {
            # Match full CI: a shared daemon may inherit stdout. Bash redirects
            # the foreground command to a file and returns its actual status;
            # PowerShell's native-output pipe would wait for daemon EOF.
            & bash scripts/capture-ci-command.sh "$evidence/$name-repro.log" repro build ".#test-$name" --tool-provisioning=path "--write-report=$evidence/$name-repro.json"
            $results += @{fixture=$name; mode='repro'; exitCode=$LASTEXITCODE}
            Get-Content "$evidence/$name-repro.log" -Tail 45
            $binary = "build/test-bin/$name.exe"
            if (-not (Test-Path $binary)) { throw "Focused action did not produce $binary" }
            foreach ($round in 1..3) {
              & $binary *> "$evidence/$name-native-$round.log"
              $results += @{fixture=$name; mode="native-$round"; exitCode=$LASTEXITCODE}
              Get-Content "$evidence/$name-native-$round.log" -Tail 45
            }
            $results | ConvertTo-Json | Set-Content "$evidence/results.json"
            $report = Get-Content "$evidence/$name-repro.json" -Raw | ConvertFrom-Json
            $actions = @($report.actions | Where-Object {$_.id -like 'vm_harness.test_execute.*'})
            if ($actions.Count -ne 1 -or $actions[0].id -ne "vm_harness.test_execute.$name" -or -not $actions[0].launched) {
              throw 'The focused fixture was not actually executed'
            }
            if ($actions[0].status -ne 'asSucceeded' -or $actions[0].exitCode -ne 0 -or ([regex]::Matches($actions[0].stdout, '\[OK\]')).Count -ne 11) {
              throw 'The complete eleven-case fixture program did not pass under Repro'
            }
          }
          if (@($results | Where-Object {$_.exitCode -ne 0}).Count -gt 0) {
            throw 'At least one unchanged fixture failed; inspect the source and process evidence'
          }
      - name: Preserve process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosti-repro-process-timing-${{ matrix.runner }}
          path: test-logs/
          retention-days: 14

