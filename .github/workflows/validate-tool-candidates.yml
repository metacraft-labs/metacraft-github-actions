          python3 - <<'VERIFY'
          import json
          from pathlib import Path
          report = json.loads(Path('test-logs/repro-dlopen/report.json').read_text())
          actions = [a for a in report['actions'] if a['id'].startswith('io-mon.test_execute.')]
          assert len(actions) == 1, actions
          action = actions[0]
          assert action['id'] == 'io-mon.test_execute.test_io_mon_dlopen_caller_runpath', action
          assert action['launched'] and action['status'] == 'asSucceeded' and action['exitCode'] == 0, action
          assert action['stdout'].count('[OK]') == 6, action
          VERIFY
