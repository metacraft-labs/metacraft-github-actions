name: Validate tool candidates on Linux

# Supplemental 0.1.0 validation, owner zah. The normal product and release
# gates remain mandatory. Exact candidates are recorded in metacraft-specs:
# infrastructure/gosti-io-mon-runquota-releases.md.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product whose complete suite should run
        type: choice
        default: all
        options:
          - all
          - gosti
          - io-mon
          - runquota
          - reprobuild
      checks:
        description: Complete suite or focused failure diagnostic
        type: choice
        default: complete
        options:
          - complete
          - hosted-macos
          - io-mon-macos-loader
          - gosti-arm-provider
          - io-mon-propagation
          - io-mon-private-linux-fixtures
          - io-mon-windows-just-path
          - io-mon-windows-arm-fixtures
          - io-mon-windows-system-child
          - runquota-windows-exit-status
          - runquota-windows-arm-children
          - runquota-macos-telemetry
          - io-mon-linux-predicate
          - io-mon-linux-repro
          - io-mon-linux-source-pair
          - runquota-macos-authority
          - runquota-macos-capacity
          - reprobuild-windows-exit
          - reprobuild-linux-hash-runtime
          - runquota-windows-checkout
          - runquota-windows-checkout-repair
          - m3-runner-state
          - io-mon-windows-loader
          - runquota-windows-active-builds
          - runquota-windows-repro
          - runquota-windows-focused
          - runquota-capture-readiness
          - runquota-windows-env-case
          - runquota-windows-arm-msi
          - m3-worker-foreground
          - m3-runquota-checkout-repair

permissions:
  contents: read

jobs:
  m3-runner-state:
    if: inputs.checks == 'm3-runner-state' || inputs.checks == 'm3-worker-foreground'
    name: Read-only persistent macOS worker diagnostics
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect worker state without changing services
        shell: bash
        run: /usr/bin/python3 diagnostics/m3-runner-state.py
      - name: Restore foreground scheduling on the verified idle listener
        if: inputs.checks == 'm3-worker-foreground'
        shell: bash
        run: /usr/bin/sudo -n /usr/bin/python3 diagnostics/m3-worker-foreground.py "$RUNNER_NAME"

  m3-worker-handoff:
    if: inputs.checks == 'm3-worker-foreground'
    needs: m3-runner-state
    # The benchmark label identifies the service affected by the collision.
    runs-on: [self-hosted, macos, arm64, benchmark]
    timeout-minutes: 5
    steps:
      - name: Prove the affected listener launches a worker
        shell: bash
        run: |
          test "$RUNNER_NAME" = m3-mcl-001
          echo "Worker handshake succeeded on $RUNNER_NAME"
          /usr/bin/uptime

  m3-runquota-checkout-repair:
    if: inputs.checks == 'm3-runquota-checkout-repair'
    name: Restore removable modes on the retained RunQuota compiler fixture
    runs-on: [self-hosted, macos, arm64, nix-darwin]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repair the exact scratch tree from failed job 109314731119
        shell: bash
        run: /usr/bin/sudo -n /usr/bin/python3 diagnostics/m3-runquota-checkout-repair.py

  test:
    if: inputs.checks != 'runquota-windows-arm-children' && inputs.checks != 'io-mon-windows-system-child' && inputs.checks != 'io-mon-windows-arm-fixtures' && inputs.checks != 'runquota-macos-telemetry' && inputs.checks != 'io-mon-windows-just-path' && inputs.checks != 'runquota-windows-exit-status' && inputs.checks != 'io-mon-private-linux-fixtures' && inputs.checks != 'runquota-capture-readiness' && inputs.checks != 'gosti-arm-provider' && inputs.product != 'reprobuild' && !startsWith(inputs.checks, 'runquota-windows-checkout') && !startsWith(inputs.checks, 'm3-') && inputs.checks != 'io-mon-linux-predicate' && inputs.checks != 'io-mon-linux-repro' && inputs.checks != 'io-mon-windows-loader' && inputs.checks != 'runquota-windows-active-builds' && inputs.checks != 'runquota-windows-repro' && inputs.checks != 'runquota-windows-env-case' && inputs.checks != 'runquota-windows-focused' && inputs.checks != 'runquota-windows-arm-msi'
    name: ${{ matrix.product }} — ${{ inputs.checks || 'complete' }}
    # Temporary Gosti/io-mon/RunQuota native macOS diagnostics; owner zah.
    # Follow-up: metacraft-specs/issues/2026-09-28-shared-macos-host-has-no-headroom-for-runquota-measurements.md
    runs-on: ${{ (inputs.checks == 'io-mon-macos-loader' || inputs.checks == 'hosted-macos' || inputs.checks == 'runquota-macos-capacity') && 'macos-26' || inputs.checks == 'runquota-macos-authority' && fromJSON('["self-hosted", "macos", "arm64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.product == 'all' && '["gosti", "io-mon", "runquota"]' || format('["{0}"]', inputs.product)) }}
    env:
      CANDIDATE_REVISION: ${{ matrix.product == 'gosti' && '4c2d81749a3a49cee007b30fb18e338b70fa24ae' || matrix.product == 'io-mon' && 'e93cb3efcb9756db055d9cb0991123b0d4fd14b9' || '529f40c997f068af496c79d046676bd0971de532' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/${{ matrix.product }}
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false
      - name: Record source and host
        env:
          EXPECTED_REVISION: ${{ env.CANDIDATE_REVISION }}
          PRODUCT: ${{ matrix.product }}
          CHECKS: ${{ inputs.checks || 'complete' }}
        run: |
          case "$CHECKS:$PRODUCT" in
            complete:*|hosted-macos:*|io-mon-macos-loader:io-mon|io-mon-propagation:io-mon|io-mon-linux-source-pair:io-mon|runquota-macos-authority:runquota|runquota-macos-capacity:runquota) ;;
            *) echo 'Select the matching product for a focused diagnostic'; exit 2 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git status --short
          git log -1 --format='%H %s'
          uname -a
          case "$(uname -s)" in
            Darwin) /usr/sbin/sysctl hw.logicalcpu hw.memsize; /usr/bin/csrutil status; df -h / /nix 2>/dev/null || df -h / ;;
            *) getconf _NPROCESSORS_ONLN ;;
          esac
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the complete product test suite
        if: inputs.checks == 'complete' || inputs.checks == '' || inputs.checks == 'runquota-macos-capacity' || inputs.checks == 'hosted-macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs
          nix develop --profile "$RUNNER_TEMP/tool-test-shell" --command just test 2>&1 | tee test-logs/candidate-linux-suite.log
      - name: Verify native macOS injection with independent loader evidence
        if: inputs.checks == 'io-mon-macos-loader'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs build
          cat > "$RUNNER_TEMP/loader-fixtures.sh" <<'BASH'
          set -euo pipefail
          for stem in test_io_mon_macos_r5_path_canon test_io_mon_macos_setexec test_io_mon_macos_sip_system_child; do
            nim c --threads:on --hints:off --out:"build/$stem" "tests/macos/$stem.nim"
            "build/$stem"
          done
          BASH
          nix develop --profile "$RUNNER_TEMP/tool-test-shell" --command bash "$RUNNER_TEMP/loader-fixtures.sh" 2>&1 | tee test-logs/loader-fixtures.log
      - name: Compare matching and mismatched Linux shared-memory sources
        if: inputs.checks == 'io-mon-linux-source-pair'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs build/source-pair
          current=$(nix eval --impure --raw --expr '(builtins.fetchTree { type = "github"; owner = "metacraft-labs"; repo = "nim-shm-gset"; rev = "c646982b354cb5b1fa8734f94b951a660419d75c"; narHash = "sha256-nO7XSWxBWrLgL8d9q1zhTcGMMjGokZKjYtX9byb9/Vk="; }).outPath')
          old=$(nix eval --impure --raw --expr '(builtins.fetchTree { type = "github"; owner = "metacraft-labs"; repo = "nim-shm-gset"; rev = "cf0adf2f39647f5b203b2ab694414a3c50e93951"; }).outPath')
          export PAIR_CURRENT="$current/src" PAIR_OLD="$old/src"
          cat > "$RUNNER_TEMP/io-mon-source-pair.sh" <<'BASH'
          set -euo pipefail
          for stem in test_io_mon_host_session_scope test_io_mon_evidence_scope_older_shim; do
            if [[ "$stem" == test_io_mon_host_session_scope ]]; then group=posix; else group=linux; fi
            binary="build/source-pair/$stem"
            SHM_GSET_SRC="$PAIR_CURRENT" nim c --threads:on --hints:off               --nimcache:"build/source-pair/cache-$stem" --out:"$binary" "tests/$group/$stem.nim"
            env -u LD_PRELOAD -u REPRO_MONITOR_SHIM_LIB -u REPRO_MONITOR_SESSION               SHM_GSET_SRC="$PAIR_CURRENT" timeout --foreground 300 "$binary" > "test-logs/$stem-matched.log" 2>&1
            cat "test-logs/$stem-matched.log"
            code=0
            env -u LD_PRELOAD -u REPRO_MONITOR_SHIM_LIB -u REPRO_MONITOR_SESSION               SHM_GSET_SRC="$PAIR_OLD" timeout --foreground 300 "$binary" > "test-logs/$stem-mismatched.log" 2>&1 || code=$?
            if [[ "$code" == 0 || "$code" == 124 ]]; then
              cat "test-logs/$stem-mismatched.log"
              echo "The layout mismatch control did not produce the expected assertion failure: $code"
              exit 1
            fi
            grep -F '[FAILED]' "test-logs/$stem-mismatched.log"
          done
          BASH
          nix develop --command bash "$RUNNER_TEMP/io-mon-source-pair.sh" 2>&1 | tee test-logs/source-pair.log
      - name: Diagnose Linux descendant loss
        if: inputs.checks == 'io-mon-propagation'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs
          python3 - <<'PY'
          from pathlib import Path
          test = Path('tests/linux/test_io_mon_propagation.nim')
          source = test.read_text()
          original = '    let dep = readMonitorDepFile(depfile)\n'
          assert source.count(original) == 1
          source = source.replace(original, original + '''    for record in dep.records:
                if record.kind in {mrEventLoss, mrProcessStart, mrProcessSpawn, mrProcessExec}:
                  checkpoint("process-evidence: " & $record)
          ''')
          original = '      if record.kind in {mrProcessExec, mrEventLoss}:\n'
          assert source.count(original) == 1
          source = source.replace(original, '      if record.kind in {mrProcessExec, mrEventLoss, mrFileWrite} or record.path == parentMarker:\n')
          test.write_text(source)
          PY
          git diff -- tests/linux/test_io_mon_propagation.nim | tee test-logs/diagnostic.patch
          nix develop --command nim c -r --path:tests/helpers tests/linux/test_io_mon_propagation.nim 2>&1 | tee test-logs/propagation.log
          shim=src/io_mon/shim/linux_preload.nim
          backup="$RUNNER_TEMP/linux-preload-before-control.nim"
          cp "$shim" "$backup"
          trap 'cp "$backup" "$shim"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/io_mon/shim/linux_preload.nim')
          source = path.read_text()
          start = source.index('proc baseRecord(')
          end = source.index('\nproc stampRunId', start)
          original = source[start:end]
          mutated = original
          for live, cached in [('uint64(c_getpid())', 'currentPid()'),
                               ('uint64(c_getppid())', 'currentPpid()'),
                               ('uint64(c_gettid())', 'currentThreadId()')]:
              assert mutated.count(live) == 1
              mutated = mutated.replace(live, cached)
          path.write_text(source[:start] + mutated + source[end:])
          PY
          git diff -- "$shim" > test-logs/negative-control.patch
          status=0
          nix develop --command nim c -r --path:tests/helpers tests/linux/test_io_mon_propagation.nim > test-logs/negative-control.log 2>&1 || status=$?
          cat test-logs/negative-control.log
          if [[ "$status" == 0 ]] || ! grep -Fq '[FAILED] vfork_exec_uses_child_identity_without_changing_parent_cache' test-logs/negative-control.log; then
            echo 'The inherited-identity negative control did not fail the vfork regression'
            exit 1
          fi
          echo 'Verified: live exec identities pass; inherited identities fail the vfork regression'
      - name: Diagnose the macOS static-helper authority
        if: inputs.checks == 'runquota-macos-authority'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs
          printf 'Outer BASH_ENV=%s\n' "${BASH_ENV:-}" | tee test-logs/authority.log
          nix develop --profile "$RUNNER_TEMP/runquota-authority-shell" --command /usr/bin/printenv PATH | tee -a test-logs/authority.log
          cat > "$RUNNER_TEMP/runquota-authority.sh" <<'BASH'
            set -euo pipefail
            printf "Shell PATH=%s\nBASH_ENV=%s\n" "$PATH" "${BASH_ENV:-}"
            gate=$(command -v runquota-static-helper-gate || true)
            printf "Initial gate=%s\n" "$gate"
            if [[ -n "$gate" ]]; then
              ls -l "$gate"
              "$gate" --print-authority
            fi
            bash -x scripts/static_helper_gate.sh
            rc=0
            just test || rc=$?
            printf "Final PATH=%s\n" "$PATH"
            command -v runquota-static-helper-gate || true
            if [[ -n "$gate" ]]; then ls -l "$gate" || true; fi
            exit "$rc"
          BASH
          nix develop --profile "$RUNNER_TEMP/runquota-authority-shell" --command bash "$RUNNER_TEMP/runquota-authority.sh" 2>&1 | tee -a test-logs/authority.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-linux-${{ matrix.product }}-${{ env.CANDIDATE_REVISION }}
          path: test-logs/
          retention-days: 14
          if-no-files-found: warn

  io-mon-private-linux-fixtures:
    if: inputs.product == 'io-mon' && inputs.checks == 'io-mon-private-linux-fixtures'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/io-mon
          ref: 0a0b592eb8ed11c3dcae8567b900e9bf6fa51650
          fetch-depth: 0
          path: io-mon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-stackable-hooks
          ref: 72f578249e9d8bbca8e3705c8a41ed5085c05bf9
          path: nim-stackable-hooks
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-shm-queue
          ref: 5a8e43b52fa202859658692c9f8432967f3971ea
          path: nim-shm-queue
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-shm-gset
          ref: cf0adf2f39647f5b203b2ab694414a3c50e93951
          path: nim-shm-gset
          persist-credentials: false
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify private loaders and shared-library negative control
        working-directory: io-mon
        run: nix develop --command python3 ../tooling/diagnostics/io-mon-private-linux-fixtures.py
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-mon-private-linux-fixtures
          path: io-mon/build/diagnostics/private-linux-fixtures/*.log
          retention-days: 14

  runquota-capture-readiness:
    if: inputs.product == 'runquota' && inputs.checks == 'runquota-capture-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 8add80468e0e1ba2b08f02df8b4720aab085f967
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          persist-credentials: false
      - name: Record source
        run: git log -1 --format='%H %s'
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify normal and delayed capture readiness with the old-wait control
        shell: bash
        run: |
          set -euo pipefail
          nix develop --profile "$RUNNER_TEMP/tool-test-shell" --command python3 .diagnostic-tools/diagnostics/runquota-capture-readiness.py
      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runquota-capture-readiness
          path: build/diagnostics/capture-readiness/*.log
          retention-days: 14

  gosti-arm-provider:
    if: inputs.product == 'gosti' && inputs.checks == 'gosti-arm-provider'
    # Exact-pin diagnosis for shared source-closure issue; owner zah.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/gosti
          ref: 2cf48cae378880aaee67df11b4b741ff82dabcf5
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Build the exact selected source bootstrap
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@93de03f82560d545ea345b9810123135ca875674
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: 90dc43218b00f2a1a7de94c174fb849f21b3a377
          gh-token: ${{ steps.token.outputs.token }}
      - name: Retain native compiler core dumps on this disposable runner
        shell: bash
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          mkdir -p build/arm-provider-evidence
          sudo sysctl -w "kernel.core_pattern=$PWD/build/arm-provider-evidence/core.%e.%p"
      - name: Compare monitored providers and direct native compilers
        shell: bash
        run: '"$REPROBUILD_BOOTSTRAP_PYTHON" .diagnostic-tools/diagnostics/gosti-arm-provider.py'
      - name: Preserve provider failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosti-2cf48ca-arm-provider
          path: |
            build/arm-provider-evidence/
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  runquota-windows-focused:
    if: inputs.product == 'runquota' && inputs.checks == 'runquota-windows-focused'
    # Supplemental native diagnosis; owner zah. Ordinary gates remain required.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: ac18bcf202fcd4d9a5e616591f60b48cc40a58e7
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          persist-credentials: false
      - name: Install pinned native compiler
        shell: pwsh
        env:
          RELEASE_TARGET: windows-x86_64
        run: ./.diagnostic-tools/release-tools/setup-windows.ps1
      - name: Provide the pinned shared-memory dependency
        shell: pwsh
        run: ./scripts/provide_shm_lease.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'nim-shm-lease')
      - name: Diagnose native benchmark, latency and connection cleanup
        shell: pwsh
        run: ./.diagnostic-tools/diagnostics/runquota-windows-focused.ps1
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runquota-windows-focused-ac18bcf
          path: build/windows-focused/
          retention-days: 14
          if-no-files-found: error

  runquota-windows-env-case:
    if: inputs.product == 'runquota' && inputs.checks == 'runquota-windows-env-case'
    # Native regression control while the existing Windows lane is occupied.
    # Owner zah; follow-up: RunQuota's Windows child-environment issue.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ github.sha }}
          path: .diagnostic-tools
          persist-credentials: false
      - name: Install pinned native compiler
        shell: pwsh
        env:
          RELEASE_TARGET: windows-x86_64
        run: ./.diagnostic-tools/release-tools/setup-windows.ps1
      - name: Provide the pinned shared-memory dependency
        shell: pwsh
        run: ./scripts/provide_shm_lease.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'nim-shm-lease')
      - name: Prove old failure and fixed child environment
        shell: pwsh
        run: ./.diagnostic-tools/diagnostics/runquota-windows-env-case.ps1
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runquota-windows-env-case-292e578
          path: build/windows-env-case/
          retention-days: 14
          if-no-files-found: warn

  runquota-windows-arm-msi:
    if: inputs.product == 'runquota' && inputs.checks == 'runquota-windows-arm-msi'
    # Native MSI migration control; owner zah. Original fleet run is retained.
    # Follow-up: metacraft-specs/infrastructure/gosti-io-mon-runquota-releases.md
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 68a2e491c219af4850b9e18940e633fc00ed9adb
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Fetch the previously built native release packages
        uses: actions/download-artifact@v4
        with:
          repository: metacraft-labs/runquota
          github-token: ${{ steps.token.outputs.token }}
          run-id: 36435050729
          pattern: release-windows-*
          path: dist
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: core.exportVariable('RELEASE_NODE', process.execPath)
      - name: Verify both MSI packages and actual lease execution
        shell: pwsh
        run: |
