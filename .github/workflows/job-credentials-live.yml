name: job-credentials-live

# The one check of the job credential broker that needs the real CI Token
# Provider App: everything else lives in test.yml, which deliberately holds no
# secrets. This proves, against GitHub itself, what the loopback stand-in in
# refresh-build-auth/job-credentials-test.cjs can only emulate:
#
#   * setup-nix leaves no credential in $HOME (persistent runners reuse it);
#   * the broker mints a `contents: read` installation token from the App key
#     and installs it in the job's private credential files;
#   * the real Nix, reading those files through `!include`, authenticates a
#     PRIVATE GitHub fetch with the broker's token -- not with `gh-token`,
#     which this job withdraws from Nix before the fetch.

on:
  pull_request:
    branches-ignore: [agents]
    paths:
      - refresh-build-auth/**
      - setup-nix/**
      - setup-dev-env/action.yml
      - .github/workflows/job-credentials-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  broker:
    # A fork's pull request gets no secrets; there is nothing to prove there.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_FETCH: (builtins.fetchTree { type = "github"; owner = "metacraft-labs"; repo = "metacraft-dev-guidelines"; }).rev
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mint the setup token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup Nix (this checkout's action)
        uses: ./setup-nix
        with:
          gh-token: ${{ steps.token.outputs.token }}

      - name: No credential reached HOME
        shell: bash
        env:
          SETUP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${MCL_JOB_CREDENTIALS_DIR:-}"
          if grep -rqF -- "$SETUP_TOKEN" "$HOME/.config/nix/nix.conf"; then
            echo "::error::the setup token was written into HOME nix.conf"; exit 1
          fi
          if [ -L "$HOME/.config/nix/netrc" ] || [ -s "$HOME/.config/nix/netrc" ]; then
            echo "::error::HOME netrc must be an empty regular file"; exit 1
          fi
          if printf '%s' "${NIX_CONFIG:-}" | grep -qF -- "$SETUP_TOKEN"; then
            echo "::error::the setup token is frozen into NIX_CONFIG"; exit 1
          fi

      - name: Start the job credential broker
        uses: actions/github-script@v7
        env:
          APP_ID: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          TOKEN_OWNERS: metacraft-labs
        with:
          script: |
            await require(process.env.GITHUB_WORKSPACE + '/refresh-build-auth/job-credentials.cjs').startBroker();

      - name: Nix authenticates a private input with the broker's token
        shell: bash
        env:
          SETUP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The broker replaced the setup token in the job's files.
          if grep -qF -- "$SETUP_TOKEN" "$MCL_JOB_CREDENTIALS_DIR/nix-access-tokens.conf"; then
            echo "::error::the broker did not rotate the Nix credential"; exit 1
          fi
          # metacraft-dev-guidelines is PRIVATE (devops-modules is public, so it
          # proves nothing): anonymous access answers 404, a dead token 401.
          # A fresh fetcher cache, so the answer comes from GitHub, not from disk.
          XDG_CACHE_HOME="$(mktemp -d)" nix eval --impure --raw --expr "$PRIVATE_FETCH" >/dev/null
          echo "private flake input resolved with the broker-minted token"
          kill -0 "$(cat "$MCL_JOB_CREDENTIALS_DIR/broker.pid")"
          echo "broker is running"

      - name: Negative control - without the job files Nix is anonymous
        shell: bash
        run: |
          set -euo pipefail
          touch "$MCL_JOB_CREDENTIALS_DIR/broker.stop"
          mv "$MCL_JOB_CREDENTIALS_DIR" "$MCL_JOB_CREDENTIALS_DIR.gone"
          if XDG_CACHE_HOME="$(mktemp -d)" nix eval --impure --raw --expr "$PRIVATE_FETCH" >/dev/null 2>&1; then
            echo "::error::a private input resolved with no job credential; the positive step proved nothing"; exit 1
          fi
          echo "private flake input refused without the job credential files, as expected"
