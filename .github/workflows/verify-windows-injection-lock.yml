name: Compare Windows injection lock initialization
on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/verify-windows-injection-lock.yml
      - diagnostics/windows-injection-lock-pair.py
      - diagnostics/windows_injection_stress_driver.nim
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
      REPRO_TOOL_PROVISIONING: tarball
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-stackable-hooks
          ref: 43b1835128331fef09ecf64a614dbf46880dbe9f
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .diagnostic-tools
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@41d0680bd78ca59ad110a261a20bcaa93a38fffd
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          repro-runquota-pin: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          repro-io-mon-pin: 5e71adf033b860c0fdbe13dda4320cf4a580f632
          repro-stackable-hooks-pin: d36cab880711c2f50f57079623a1ce89ba4a83dc
          gh-token: ${{ steps.token.outputs.token }}
      - name: Compare lazy and initialized permit locks with real threads
        shell: pwsh
        timeout-minutes: 75
        run: repro exec -- python ./.diagnostic-tools/diagnostics/windows-injection-lock-pair.py
      - name: Preserve raw statuses and monitored fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-injection-lock-pair-${{ matrix.runner }}
          path: build/injection-lock-pair/
          if-no-files-found: error
          retention-days: 14
