name: test

# The sibling-revision resolver is the single source of the revisions every
# consumer's CI builds against, so a regression here mispins other repos'
# builds rather than failing this one. Its contract suite therefore runs on
# every change to it.
#
# Deliberately stock `ubuntu-latest` with nothing but checkout, bash and git:
# no Nix, no dev shell, no secrets, no self-hosted runner. A guard must not
# share the failure modes of the things it guards.

on:
  push:
    # `dev`, not `main`. This repository's mainline was renamed and there is no
    # `main` branch, so this trigger matched nothing: every guard below ran on
    # pull requests and manual dispatch only, and a push straight to the
    # mainline — which is how a shared-actions repo is usually corrected in a
    # hurry — ran no check at all. That is not a hypothetical: the archive-size
    # guard and the manifest-prose guard were each added after a defect that
    # reached all 64 consuming repos, and the second of those two defects was
    # itself pushed directly to the mainline past a suite that could have
    # caught it, because this line said `main`.
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-sibling-rev:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — see the note on the job below. This job
      # runs two bash scripts and shellcheck; it performs no git operation
      # after the checkout, so there is nothing for a stored credential to
      # authenticate.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: resolve-sibling-rev.sh contract suite
        run: bash clone-siblings/resolve-sibling-rev-test.sh

      # The resolver suite covers the lock reader; this one covers the step that
      # calls it — `clone-siblings.sh`, executed against local repositories, so
      # a defect downstream of a correctly-behaving resolver (an unvalidated
      # `name=ref` override reaching `git fetch`, a workspace-membership gap
      # reported as a broken lock, a `name=ref` silently replacing a revision
      # the lock pins) is caught here rather than in a consumer's CI.
      - name: clone-siblings step contract suite
        run: bash clone-siblings/clone-siblings-step-test.sh

      # `setup-dev-env` now CHOOSES between clone-siblings and the consuming
      # repo's own `repro.lock`, so a defect in that choice is not a wrong
      # revision — it is the wrong mechanism, silently, which is the failure
      # mode the whole sibling-resolution contract exists to prevent. Same
      # stock runner: the suite stubs only the `repro` CLI (a compiled binary
      # from another repo) and runs the shipped scripts against real files.
      - name: sibling-strategy step contract suite
        run: bash setup-dev-env/sibling-strategy-step-test.sh

      # The other half of what setup-dev-env decides for every repo in the org:
      # WHICH reprobuild store a job builds into. The self-hosted Linux runners
      # mount a shared, persistent CAS into every per-job container, and until
      # this step existed nothing pointed reprobuild at it — so every job built
      # into a container-local directory that was destroyed with the container
      # and the shared store stayed empty from the day it was created.
      #
      # The half that needs guarding is not the export. The same action runs on
      # GitHub-hosted runners, on macOS and on Windows, where that mount does
      # not exist and exporting a store root would be worse than the gap. So the
      # suite covers all three shapes — present+writable, absent, present but
      # unwritable — plus the quota-exhausted store, where the directory reports
      # itself writable and a real write still fails. Each case is paired with a
      # mutant of the shipped script with that one guard removed, and the suite
      # fails if a case passes against its mutant.
      #
      # Same stock runner: bash, coreutils, and an unprivileged user namespace
      # for the quota-exhausted fixture (announced as skipped, never silently,
      # where namespaces are unavailable).
      - name: store-root step contract suite
        run: bash setup-dev-env/store-root-step-test.sh

      - name: shellcheck
        run: shellcheck -S warning clone-siblings/resolve-sibling-rev.sh clone-siblings/resolve-sibling-rev-test.sh clone-siblings/clone-siblings.sh clone-siblings/clone-siblings-step-test.sh setup-dev-env/decide-sibling-strategy.sh setup-dev-env/provision-siblings-from-lock.sh setup-dev-env/sibling-strategy-step-test.sh setup-dev-env/decide-store-root.sh setup-dev-env/store-root-step-test.sh .github/assert-no-persisted-credential.sh

  publish-workspace-lock:
    # The write half of the same mechanism. `clone-siblings` READS a per-commit
    # lock; this action is the only thing in CI that WRITES one, into a store
    # that is append-only and whose records are immutable. A defect here does
    # not fail this repo — it publishes a wrong sibling set under a mainline
    # commit, where it is immutable and every consumer builds against it.
    #
    # Same stock runner as the job above, and for the same reason: the suites
    # stand up their own bare repositories and a URL-rewriting `git` shim, so
    # they need no network, no Nix, no secrets and no self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: anchor-workspace-lock.sh contract suite
        run: bash publish-workspace-lock/anchor-workspace-lock-test.sh

      # The transform suite covers what one field move must and must not touch;
      # this one covers the publishing step around it — the `run:` body is
      # extracted from action.yml and executed against local bares, so
      # immutability, idempotency, the lost-push-race recovery and the
      # "did it actually land on mainline" proof are exercised against real git
      # rather than described in a comment.
      - name: publish-workspace-lock step contract suite
        run: bash publish-workspace-lock/publish-workspace-lock-step-test.sh

      - name: shellcheck
        run: shellcheck -S warning publish-workspace-lock/anchor-workspace-lock.sh publish-workspace-lock/anchor-workspace-lock-test.sh publish-workspace-lock/publish-workspace-lock-step-test.sh

  setup-nix-git-auth:
    # `setup-nix` runs in almost every job in this org, so a mistake in how it
    # scopes the CI token does not fail this repo — it either leaks a live
    # credential onto fetches that should never see it, or unauthenticates
    # every private clone in the org. Same reasoning as the suite above: stock
    # runner, no Nix, no secrets, nothing this action itself provides.
    runs-on: ubuntu-latest
    steps:
      # `actions/checkout` defaults to `persist-credentials: true`, which writes
      #
      #     http.https://github.com/.extraheader = AUTHORIZATION: basic <token>
      #
      # into this checkout's LOCAL .git/config — the same catch-all shape
      # `setup-nix` no longer installs, at per-checkout scope. It is what made
      # this suite's first CI run fail while passing locally: `git config
      # --get-urlmatch` answered from the checkout's own credential. The suite
      # defends itself by querying git from a non-repository directory; turning
      # the header off removes the contaminant at its source as well, so the
      # guard is not sharing a runner-only failure mode with the thing it
      # guards.
      #
      # Safe here because neither job in this workflow runs a git operation
      # after the checkout: both run bash scripts and shellcheck, `permissions`
      # is `contents: read`, and nothing pushes, tags, fetches or updates a
      # submodule. The step below asserts the header is actually gone, so this
      # cannot silently regress if a future checkout release changes defaults.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: configure-git-auth.sh contract suite
        run: bash setup-nix/configure-git-auth-test.sh

      - name: shellcheck
        run: shellcheck -S warning setup-nix/configure-git-auth.sh setup-nix/configure-git-auth-test.sh

  clone-git-auth:
    # `clone-siblings` and `clone-repo` clone into nearly every job in this org,
    # and until this suite existed the only thing standing between a CI App
    # token and the `.git/config` of every sibling clone was that nobody had
    # looked. Same reasoning as the two suites above — stock runner, no Nix, no
    # secrets — with one addition: this suite stands up its OWN git server on
    # 127.0.0.1 and clones through it, so it needs no network access either.
    # Everything it asserts about a credential, it observes on the wire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: authenticated-clone contract suite
        run: bash git-auth/authenticated-clone-test.sh

      # The Windows MAX_PATH half of the same script. Separate suite because it
      # needs a different observation apparatus (a `git` shim plus trace2
      # `def_param` events) and a different fixture shape (two levels of
      # submodule nesting, no server), and because it must be readable on its
      # own by whoever next wonders why `core.longpaths` is set from a clone
      # script. It runs on this stock Linux runner deliberately: the mechanism
      # under test is environment propagation into submodule git processes,
      # which is identical on every platform, and a Windows-only suite would be
      # a suite this repo's CI cannot run.
      - name: long-path contract suite
        run: bash git-auth/longpaths-test.sh

      - name: shellcheck
        run: shellcheck -S warning git-auth/scoped-git-auth.sh git-auth/authenticated-clone.sh git-auth/authenticated-clone-test.sh git-auth/longpaths-test.sh

  action-template-limits:
    # Every suite above EXTRACTS a composite action's `run:` body and executes
    # it, which works no matter how long that body is. GitHub's template parser
    # has the one opinion none of them can hold: past a length limit it refuses
    # the action outright, with
    #
    #   Exceeded max expression length 21000
    #
    # That is not a failing step in a consumer's job — the job never starts, and
    # the diagnostic names a file in THIS repo from inside somebody else's run.
    # Because every consumer pins `@main`, it takes the mainline CI of every
    # repo in the org down at once, which is what happened on 2026-08-26 when
    # `clone-siblings` grew 1,419 characters of comment.
    #
    # The archive-size guard below is the same CLASS of problem, which is why it
    # shares this job: a property of what this repo publishes that fails inside
    # SOMEBODY ELSE'S `Set up job`, before their first step, and that no suite
    # above can see because they all extract a step body and run it locally.
    # The runner downloads a `uses:` target's WHOLE repository against a fixed
    # 100-second timeout, so a nested `uses:` into a large repo takes every
    # consumer down; `metacraft-labs/reprobuild@dev` at 546 MB did exactly that
    # to the Windows lane. See .github/assert-action-archive-size.sh.
    #
    # Same stock runner as the suites above. The template-limit check reads YAML
    # with bash and needs no network; the archive-size check does need network,
    # because codeload advertises no Content-Length and ignores Range, so a size
    # can only be measured by downloading (bounded to the budget, ~32 MiB worst
    # case). Neither needs Nix or secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: "composite run: bodies stay inside the template limit"
        run: bash .github/assert-composite-run-size.sh

      - name: referenced action archives stay downloadable in 100s
        env:
          # Only to authenticate the codeload fetches; the guard reads sizes and
          # nothing else. Anonymous access is rate-limited per IP and the whole
          # runner fleet shares one, which would turn a pass into an
          # unmeasurable-archive failure.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/assert-action-archive-size.sh

      - name: archive-size guard contract suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/assert-action-archive-size-test.sh

      # Third property of the same class: one manifest, every consumer, before
      # any step they could have used to notice. An action's `description:` is
      # evaluated, not quoted, and against a context with no `github` — so a
      # comment written as an expression is a parse error in all 64 consuming
      # repos. Needs no network.
      - name: manifest prose carries no evaluated expressions
        run: bash .github/assert-no-expression-in-manifest-prose.sh

      - name: manifest-prose guard contract suite
        run: bash .github/assert-no-expression-in-manifest-prose-test.sh

      # Fourth property of the same class, and the one this workflow is itself
      # the cautionary tale for. The `branches:` line above said `main` while
      # this repository's mainline was `dev`, so every guard in this file ran
      # on pull requests only and a push straight to the mainline — how a
      # shared-actions repo is usually corrected in a hurry — ran nothing. The
      # failure is silent by construction: an empty check list on a mainline
      # commit looks exactly like a clean one. A sweep afterwards found the
      # same defect in 33 workflows across 22 repositories.
      #
      # Needs no network here: the mainline is stated rather than detected, so
      # the guard cannot be quietly satisfied by a runner that cannot reach
      # origin.
      - name: workflow branch filters name the mainline
        run: bash .github/assert-workflow-triggers-mainline.sh dev

      - name: mainline-trigger guard contract suite
        run: bash .github/assert-workflow-triggers-mainline-test.sh

      - name: shellcheck
        run: shellcheck -S warning .github/assert-composite-run-size.sh .github/assert-action-archive-size.sh .github/assert-action-archive-size-test.sh .github/assert-no-expression-in-manifest-prose.sh .github/assert-no-expression-in-manifest-prose-test.sh .github/assert-workflow-triggers-mainline.sh .github/assert-workflow-triggers-mainline-test.sh
