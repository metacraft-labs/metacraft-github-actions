name: test

# The sibling-revision resolver is the single source of the revisions every
# consumer's CI builds against, so a regression here mispins other repos'
# builds rather than failing this one. Its contract suite therefore runs on
# every change to it.
#
# Deliberately stock `ubuntu-latest` with nothing but checkout, bash and git:
# no Nix, no dev shell, no secrets, no self-hosted runner. A guard must not
# share the failure modes of the things it guards.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-sibling-rev:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — see the note on the job below. This job
      # runs two bash scripts and shellcheck; it performs no git operation
      # after the checkout, so there is nothing for a stored credential to
      # authenticate.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: resolve-sibling-rev.sh contract suite
        run: bash clone-siblings/resolve-sibling-rev-test.sh

      # The resolver suite covers the lock reader; this one covers the composite
      # step that calls it — the `run:` body is extracted from action.yml and
      # executed against local repositories, so a defect downstream of a
      # correctly-behaving resolver (an unvalidated `name=ref` override reaching
      # `git fetch`, a workspace-membership gap reported as a broken lock) is
      # caught here rather than in a consumer's CI.
      - name: clone-siblings step contract suite
        run: bash clone-siblings/clone-siblings-step-test.sh

      - name: shellcheck
        run: shellcheck -S warning clone-siblings/resolve-sibling-rev.sh clone-siblings/resolve-sibling-rev-test.sh clone-siblings/clone-siblings-step-test.sh .github/assert-no-persisted-credential.sh

  setup-nix-git-auth:
    # `setup-nix` runs in almost every job in this org, so a mistake in how it
    # scopes the CI token does not fail this repo — it either leaks a live
    # credential onto fetches that should never see it, or unauthenticates
    # every private clone in the org. Same reasoning as the suite above: stock
    # runner, no Nix, no secrets, nothing this action itself provides.
    runs-on: ubuntu-latest
    steps:
      # `actions/checkout` defaults to `persist-credentials: true`, which writes
      #
      #     http.https://github.com/.extraheader = AUTHORIZATION: basic <token>
      #
      # into this checkout's LOCAL .git/config — the same catch-all shape
      # `setup-nix` no longer installs, at per-checkout scope. It is what made
      # this suite's first CI run fail while passing locally: `git config
      # --get-urlmatch` answered from the checkout's own credential. The suite
      # defends itself by querying git from a non-repository directory; turning
      # the header off removes the contaminant at its source as well, so the
      # guard is not sharing a runner-only failure mode with the thing it
      # guards.
      #
      # Safe here because neither job in this workflow runs a git operation
      # after the checkout: both run bash scripts and shellcheck, `permissions`
      # is `contents: read`, and nothing pushes, tags, fetches or updates a
      # submodule. The step below asserts the header is actually gone, so this
      # cannot silently regress if a future checkout release changes defaults.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: configure-git-auth.sh contract suite
        run: bash setup-nix/configure-git-auth-test.sh

      - name: shellcheck
        run: shellcheck -S warning setup-nix/configure-git-auth.sh setup-nix/configure-git-auth-test.sh

  clone-git-auth:
    # `clone-siblings` and `clone-repo` clone into nearly every job in this org,
    # and until this suite existed the only thing standing between a CI App
    # token and the `.git/config` of every sibling clone was that nobody had
    # looked. Same reasoning as the two suites above — stock runner, no Nix, no
    # secrets — with one addition: this suite stands up its OWN git server on
    # 127.0.0.1 and clones through it, so it needs no network access either.
    # Everything it asserts about a credential, it observes on the wire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: authenticated-clone contract suite
        run: bash git-auth/authenticated-clone-test.sh

      # The Windows MAX_PATH half of the same script. Separate suite because it
      # needs a different observation apparatus (a `git` shim plus trace2
      # `def_param` events) and a different fixture shape (two levels of
      # submodule nesting, no server), and because it must be readable on its
      # own by whoever next wonders why `core.longpaths` is set from a clone
      # script. It runs on this stock Linux runner deliberately: the mechanism
      # under test is environment propagation into submodule git processes,
      # which is identical on every platform, and a Windows-only suite would be
      # a suite this repo's CI cannot run.
      - name: long-path contract suite
        run: bash git-auth/longpaths-test.sh

      - name: shellcheck
        run: shellcheck -S warning git-auth/scoped-git-auth.sh git-auth/authenticated-clone.sh git-auth/authenticated-clone-test.sh git-auth/longpaths-test.sh
