name: test

# The sibling-revision resolver is the single source of the revisions every
# consumer's CI builds against, so a regression here mispins other repos'
# builds rather than failing this one. Its contract suite therefore runs on
# every change to it.
#
# Deliberately stock `ubuntu-latest` with checkout, Bash, Git and Node:
# no Nix, no dev shell, no secrets, no self-hosted runner. A guard must not
# share the failure modes of the things it guards.

on:
  push:
    # `dev`, not `main`. This repository's mainline was renamed and there is no
    # `main` branch, so this trigger matched nothing: every guard below ran on
    # pull requests and manual dispatch only, and a push straight to the
    # mainline — which is how a shared-actions repo is usually corrected in a
    # hurry — ran no check at all. That is not a hypothetical: the archive-size
    # guard and the manifest-prose guard were each added after a defect that
    # reached all 64 consuming repos, and the second of those two defects was
    # itself pushed directly to the mainline past a suite that could have
    # caught it, because this line said `main`.
    branches: [dev]
  pull_request:
    branches-ignore: [agents]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild-wrapper-cwd:
    # Qualify the generated wrappers against the pinned CLI
    # (pins/reprobuild.json) on both native platforms. This is an owning
    # contract test, not a consumer pilot.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: windows-diy dev-exec wrappers through real PowerShell
        # No Reprobuild involved: the windows-diy flavor's own wrappers, from
        # the action's real step, run real commands through pwsh (and cmd.exe
        # on Windows), including a stale wrapper later on PATH.
        shell: bash
        run: python setup-dev-env/test-windows-diy-dev-exec.py -v
      - name: reprobuild dev-exec PowerShell wrappers keep colon arguments intact
        # `dev-exec nim c --path:src -d:release` must reach the command as
        # written: PowerShell's binder and `pwsh -File` both split such tokens.
        shell: bash
        run: python setup-dev-env/test-reprobuild-ps1-arguments.py -v
      - name: setup-dev-env exports no variable that changes program lookup
        # `$GITHUB_ENV` reaches every later step and every child of `repro
        # exec`; an exported PATHEXT made cmd.exe run npm's `.ps1` shims.
        shell: bash
        run: python setup-dev-env/test-github-env-exports.py -v
      - name: windows-diy hands later steps env.ps1's PATH order, shims last
        # The runner prepends each $GITHUB_PATH line ahead of the earlier
        # ones; the step writes env.ps1's entries last first, and keeps the
        # bash-only shims directory behind the real tools.
        shell: bash
        run: python setup-dev-env/test-windows-diy-path-order.py -v
      - name: The Windows source build leaves the provider-compile Nim to the engine
        # env.ps1's stock nim.exe, exported as REPRO_NIM_COMPILER, rejects the
        # --compilerArgsFile option the engine's provider compile passes.
        shell: bash
        run: python setup-reprobuild/test-windows-source-build-nim.py -v
      - name: A source build exports its build environment only when asked
        # export-build-env false keeps RunQuota, the toolchain and env.ps1's
        # variables out of later steps that build with toolchains of their own.
        shell: bash
        run: python setup-reprobuild/test-export-build-env.py -v
      - name: Mint a read token for the pinned Reprobuild's sources
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Install the pinned Reprobuild
        # This checkout's setup-reprobuild with no override: the CLI is the
        # fleet's pin, built from source when the pin is a commit. Any failure
        # is a failure; the contract never runs against another CLI.
        id: repro
        uses: ./setup-reprobuild
        with:
          gh-token: ${{ steps.token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - name: Locate the pinned CLI
        id: sdk
        shell: bash
        env:
          ORIGIN: ${{ steps.repro.outputs.origin }}
        run: |
          set -euo pipefail
          test "$ORIGIN" = pin
          cli="$(command -v repro)"
          test -f "$cli" || cli="$cli.exe"
          test -f "$cli"
          if [ "$RUNNER_OS" = Windows ]; then cli="$(cygpath -w "$cli")"; fi
          printf 'cli=%s\n' "$cli" >> "$GITHUB_OUTPUT"
          # The engine picks the provider-compile Nim itself. A stock Nim
          # handed over in REPRO_NIM_COMPILER cannot take an over-limit
          # Windows compile (--compilerArgsFile); the steps below then compile
          # with the engine's choice.
          if [ -n "${REPRO_NIM_COMPILER:-}" ]; then
            echo "::error::setup-reprobuild exported REPRO_NIM_COMPILER=${REPRO_NIM_COMPILER}"
            exit 1
          fi
      - name: Real generated wrapper cwd, argv and status controls
        shell: bash
        env:
          REPRO_CONTRACT_CLI: ${{ steps.sdk.outputs.cli }}
        run: |
          python setup-dev-env/test-repro-wrapper-cwd.py \
            --repro "$REPRO_CONTRACT_CLI" \
            --report "$RUNNER_TEMP/dev-exec-cwd-result.json"
      - name: Real private Cargo acquisition through activated Repro
        shell: bash
        env:
          REPRO_CONTRACT_CLI: ${{ steps.sdk.outputs.cli }}
        run: python git-auth/test-cargo-acquisition.py --repro "$REPRO_CONTRACT_CLI"
      # The git-auth action's real `repro develop` materialization, and the
      # negative control that the job's numbered Git configuration alone does
      # not reach Repro's clone. The suite drives the steps with bash and
      # POSIX file modes, so it runs on the Linux leg only.
      - name: Real private Repro materialization through the git-auth action
        env:
          REPRO_CONTRACT_CLI: ${{ steps.sdk.outputs.cli }}
        if: runner.os == 'Linux'
        shell: bash
        run: python git-auth/test-private-global-config.py --repro "$REPRO_CONTRACT_CLI"
      - name: Prepare selected environments through real credential expiry
        env:
          REPRO_CONTRACT_CLI: ${{ steps.sdk.outputs.cli }}
        if: runner.os == 'Linux'
        shell: bash
        run: python prepare-repro-envs/test-real.py --repro "$REPRO_CONTRACT_CLI" --report-directory "$RUNNER_TEMP/prepare-repro-envs"

      - name: Retain native contract receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-exec-cwd-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dev-exec-cwd-result.json
            ${{ runner.temp }}/dev-exec-cwd-result.streams/**
            ${{ runner.temp }}/native-status-result.json
            ${{ runner.temp }}/native-status-result.streams/**
            ${{ runner.temp }}/prepare-repro-envs/**
          if-no-files-found: error

  windows-endpoint-receipt:
    # A real private kernel pipe and the current process suffice; no SDK,
    # fleet runner, toolchain, credentials or host daemon is provisioned.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Native Windows endpoint receipt controls
        shell: pwsh
        run: ./setup-dev-env/test-runquota-peer.ps1

  refresh-build-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind declared Nix-auth Node runtime
        # The tests receive the same explicit runtime binding as the production
        # refresh action; no ambient Node discovery.
        uses: actions/github-script@v7
        with:
          script: |
            require('node:fs').appendFileSync(process.env.GITHUB_ENV,
              'GHA_NIX_AUTH_NODE=' + process.execPath + '\n');
      - name: Real Git and Nix credential-refresh contract
        run: python3 refresh-build-auth/test.py
      - name: Real Git and Nix credential-refresh contract (job credential files)
        # The same contract with RUNNER_TEMP set, i.e. through the job's
        # private credential directory and an `!include` in NIX_CONFIG --
        # the mode every real runner takes.
        run: RUNNER_TEMP="$(mktemp -d)" python3 refresh-build-auth/test.py
      - name: setup-dev-env enables the Nix features an unconfigured Nix lacks
        # Here, not with the other setup-dev-env step suites: it runs the real
        # Nix (made unconfigured by the suite) and this job's bound Node, which
        # it needs to run the Nix authentication step after the script and
        # check that the setting survives it. A mutant that does not append
        # the setting must leave the new CLI disabled.
        run: bash setup-dev-env/enable-nix-features-step-test.sh
      - name: Job credential files and broker contract
        # Real Nix parser, setup-nix's actual step body, real RSA/JWT, and a
        # loopback stand-in for GitHub's App endpoints (justified in the file).
        run: '"$GHA_NIX_AUTH_NODE" --test refresh-build-auth/job-credentials-test.cjs'
      - name: Real runner masking boundary with noncredential sentinels
        env:
          GH_TOKEN: fresh-masking-fixture-not-a-credential
          NIX_CONFIG: "access-tokens = github.com=old-masking-fixture-not-a-credential gitlab.com=inherited-masking-fixture-not-a-credential"
        run: |
          printf '%s\n' 'inherited-masking-fixture-not-a-credential'
          "$GHA_NIX_AUTH_NODE" refresh-build-auth/nix-auth.cjs
      - name: Observe registered sentinel redaction
        run: |
          printf '%s\n' 'inherited-masking-fixture-not-a-credential' 'fresh-masking-fixture-not-a-credential'

  codetracer-mac-lock-tool:
    # The Linux-testable half of the codetracer-mac-lock workflow: pin and
    # revision refusals, the shallow fetch, the sibling revision check against
    # a fake GitHub API, the post-solve checks and the confirmed/produced
    # classification, and the solve orchestration with a recording engine.
    # The solve itself runs only on the arm64 macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: codetracer-mac-lock tool contract
        run: python3 -I tools/test-codetracer-mac-lock.py -v

  release-gates:
    # Like the other policy guards below, this uses only Node and real local
    # files. Keep it independent of the fleet whose release routing it checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            require('child_process').execFileSync(process.execPath,
              ['--test', 'release-tools/release.test.cjs'], {stdio: 'inherit'});

  release-package-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm libarchive-tools
      - uses: actions/github-script@v7
        with:
          script: |
            require('child_process').execFileSync(process.execPath,
              ['--test', 'release-tools/configuration-packages.test.cjs'], {stdio: 'inherit'});

  bash32-parse:
    # macOS runners execute these scripts with /bin/bash 3.2, whose parser
    # rejects bodies Bash 5 accepts. A suite that only ever ran Bash 5 let a
    # parse break in setup-reprobuild/install-release.sh through to every macOS
    # consumer, failing before the script ran a line. So build the same Bash
    # 3.2 from GNU source here, on a stock runner, and parse every script with
    # it. The tarball is checked against a pinned sha256 before it is built.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build bash 3.2.57 from GNU source
        # Modern gcc rejects this K&R-era source under its default standard.
        # The flags go in CC, not CFLAGS: the builtins helper (mkbuiltins) is
        # compiled without CFLAGS. The tarball's patched parse.y is newer than
        # its shipped y.tab.c, so make regenerates the parser and needs bison.
        run: |
          command -v bison >/dev/null || { sudo apt-get update && sudo apt-get install -y bison; }
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location --retry 3 \
            --output bash-3.2.57.tar.gz https://ftp.gnu.org/gnu/bash/bash-3.2.57.tar.gz
          echo "3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4  bash-3.2.57.tar.gz" | sha256sum -c -
          tar -xzf bash-3.2.57.tar.gz
          cd bash-3.2.57
          ./configure --without-bash-malloc CC="gcc -std=gnu89 -w" >/dev/null
          make -j4 >/dev/null
          ./bash -c 'echo "built ${BASH_VERSION}"'

      - name: Every shell script parses under Bash 3.2
        run: BASH32="${RUNNER_TEMP}/bash-3.2.57/bash" python3 setup-reprobuild/test-install-release.py Bash32Parse

  resolve-sibling-rev:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — see the note on the job below. This job
      # runs two bash scripts and shellcheck; it performs no git operation
      # after the checkout, so there is nothing for a stored credential to
      # authenticate. Full history: test-install-release.py reads the
      # setup-reprobuild commit setup-dev-env names, which a shallow clone lacks.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: RunQuota bootstrap revision with real Git repositories
        run: python3 reprobuild-provision/test-runquota-ref.py

      - name: Source build provisions the siblings its reprobuild locks (no python3 or /usr/bin on PATH)
        run: python3 reprobuild-provision/test-reprobuild-lock-revisions.py

      - name: Multi-owner sibling-owner clones from its first owner
        run: python3 reprobuild-provision/test-multi-owner.py

      # Real local HTTP and archive operations test SDK selection, not the SDK
      # runtime itself; release smoke tests own the native bundle qualification.
      - name: Requested release selection and installer contract
        run: python3 setup-reprobuild/test-install-release.py

      # A caller-built package of the pin replaces the source build only when
      # it is that pinned flake's own package output on this system.
      - name: Caller-built Reprobuild package admission contract
        run: python3 setup-reprobuild/test-prebuilt-package.py

      # The selected commit's package comes from the binary cache when a cache
      # holds it: asked without building, admitted like a caller's package,
      # and a miss leaves the source route as it was.
      - name: Binary-cache substitution of the selected Reprobuild package
        run: python3 setup-reprobuild/test-cache-substitution.py

      # On Windows the selected commit's bundle comes from its pin prerelease
      # when one is published: verified like a release, a miss leaves the
      # source route as it was, and a wrong prerelease fails the step.
      - name: Windows pin prerelease installation of the selected commit
        run: python3 setup-reprobuild/test-pin-release.py

      # A source-built engine refuses its compiled-in sibling trees, so the
      # build step must hand later steps the pinned trees the dev shell names.
      - name: Source build forwards the sibling-first source variables
        run: python3 setup-reprobuild/test-source-build-env.py

      # With export-build-env false, a source build's environment goes to the
      # build-env-dir files instead of the job's environment.
      - name: Source build exports its build environment only when asked
        run: python3 setup-reprobuild/test-export-build-env.py

      - name: Required development-environment execution contract
        run: python3 setup-dev-env/test-repro-exec.py

      # git-access none and export-build-env false keep this action's Git
      # credential and a source build's environment out of later steps.
      - name: Opting out of the job-scoped Git credential and build environment
        run: python3 setup-dev-env/test-job-env-opt-outs.py

      - name: Windows hook source stays pinned as mainline advances
        run: python3 reprobuild-provision/test-windows-hooks-pin.py

      - name: status-im/nim-bearssl clone carries the declared credential scope
        run: python3 reprobuild-provision/test-bearssl-auth.py

      - name: Windows path provisions test-certificates-tools for the engine build
        run: python3 reprobuild-provision/test-test-certificates-tools.py

      - name: codetracer submodule failure reports git's real error
        run: python3 reprobuild-provision/test-submodule-failure.py

      - name: resolve-sibling-rev.sh contract suite
        run: bash clone-siblings/resolve-sibling-rev-test.sh

      - name: evict-stale-git-credentials removes only credential-bearing keys
        run: bash evict-stale-git-credentials/evict-test.sh

      # The resolver suite covers the lock reader; this one covers the step that
      # calls it — `clone-siblings.sh`, executed against local repositories, so
      # a defect downstream of a correctly-behaving resolver (an unvalidated
      # `name=ref` override reaching `git fetch`, a workspace-membership gap
      # reported as a broken lock, a `name=ref` silently replacing a revision
      # the lock pins) is caught here rather than in a consumer's CI.
      - name: clone-siblings step contract suite
        run: bash clone-siblings/clone-siblings-step-test.sh

      # `setup-dev-env` now CHOOSES between clone-siblings and the consuming
      # repo's own `repro.lock`, so a defect in that choice is not a wrong
      # revision — it is the wrong mechanism, silently, which is the failure
      # mode the whole sibling-resolution contract exists to prevent. Same
      # stock runner: the suite stubs only the `repro` CLI (a compiled binary
      # from another repo) and runs the shipped scripts against real files.
      - name: sibling-strategy step contract suite
        run: bash setup-dev-env/sibling-strategy-step-test.sh

      # The other half of what setup-dev-env decides for every repo in the org:
      # WHICH reprobuild store a job builds into. The self-hosted Linux runners
      # mount a shared, persistent CAS into every per-job container, and until
      # this step existed nothing pointed reprobuild at it — so every job built
      # into a container-local directory that was destroyed with the container
      # and the shared store stayed empty from the day it was created.
      #
      # The half that needs guarding is not the export. The same action runs on
      # GitHub-hosted runners, on macOS and on Windows, where that mount does
      # not exist and exporting a store root would be worse than the gap. So the
      # suite covers all three shapes — present+writable, absent, present but
      # unwritable — plus the quota-exhausted store, where the directory reports
      # itself writable and a real write still fails. Each case is paired with a
      # mutant of the shipped script with that one guard removed, and the suite
      # fails if a case passes against its mutant.
      #
      # Same stock runner: bash, coreutils, and an unprivileged user namespace
      # for the quota-exhausted fixture (announced as skipped, never silently,
      # where namespaces are unavailable).
      - name: store-root step contract suite
        run: bash setup-dev-env/store-root-step-test.sh

      # Steps after setup-dev-env must draw on the host's RunQuota daemon, never
      # a private one, and exporting a socket nothing answers on would break the
      # per-user fallback. Cases cover answering, absent, stale and unverifiable
      # sockets, a caller's own value and the input; the stale case is paired
      # with a mutant that must fail it. A real-daemon case runs where the
      # runquota binaries are on PATH and is reported as skipped where not.
      - name: export-runquota-endpoint step contract suite
        run: bash setup-dev-env/export-runquota-endpoint-step-test.sh

      # On NixOS runners `repro` must provision declared tools with Nix: the
      # generic-Linux tarballs other modes fall back to cannot run there.
      # Cases cover the marker file, os-release, other distributions, a
      # caller's own value and a missing `nix`; the caller and os-release
      # guards are each paired with a mutant that must fail its case. A last
      # case checks the step runs before the action's first `repro` command.
      - name: tool-provisioning step contract suite
        run: bash setup-dev-env/tool-provisioning-step-test.sh

      # Under the reprobuild flavor a prebuilt repro on a host without Nix left
      # the consumer's flake dev shell unable to start. setup-dev-env installs
      # Nix with setup-nix when none is on PATH on Linux or macOS, and never
      # over a host's own Nix, on NixOS, or on Windows. The PATH, NixOS and
      # Windows guards are each paired with a mutant that must install where
      # the script does not; the wiring cases check the step order and inputs.
      - name: nix-install step contract suite
        run: bash setup-dev-env/nix-install-step-test.sh

      # `repro` unpacks provisioned tools with the host tar, which needs gzip /
      # xz / bzip2 on PATH as child processes; setup-dev-env now provides them
      # or fails naming them. Each guard is paired with a mutant that must make
      # its case fail. Stubs only: no network, no real nix.
      - name: ensure-host-decompressors step contract suite
        run: bash setup-dev-env/ensure-host-decompressors-step-test.sh

      # `mirror-artifacts-s3` is advertised as non-blocking, and a step that
      # never ends blocks the job as surely as one that fails: stalled uploads
      # held recorder jobs open for hours. The suite runs the shipped script
      # against stub `aws` / `nix` clients that succeed, fail, hang, and ignore
      # SIGTERM, and requires the step to end within its bound with nothing of
      # the client's process tree left running. Each guard is paired with a
      # mutant that must make its case fail. Stubs only: no network, no store.
      - name: mirror-artifacts-s3 step contract suite
        run: bash mirror-artifacts-s3/mirror-step-test.sh

      - name: shellcheck
        run: shellcheck -S warning clone-siblings/resolve-sibling-rev.sh clone-siblings/resolve-sibling-rev-test.sh clone-siblings/clone-siblings.sh clone-siblings/clone-siblings-step-test.sh setup-dev-env/decide-sibling-strategy.sh setup-dev-env/provision-siblings-from-lock.sh setup-dev-env/reconcile-locked-sibling.sh setup-dev-env/sibling-strategy-step-test.sh setup-dev-env/decide-store-root.sh setup-dev-env/store-root-step-test.sh setup-dev-env/export-runquota-endpoint.sh setup-dev-env/export-runquota-endpoint-step-test.sh setup-dev-env/decide-tool-provisioning.sh setup-dev-env/tool-provisioning-step-test.sh setup-dev-env/decide-nix-install.sh setup-dev-env/nix-install-step-test.sh setup-dev-env/ensure-host-decompressors.sh setup-dev-env/ensure-host-decompressors-step-test.sh setup-dev-env/enable-nix-features.sh setup-dev-env/enable-nix-features-step-test.sh setup-dev-env/record-git-access.sh setup-dev-env/check-git-config-untouched.sh mirror-artifacts-s3/mirror.sh mirror-artifacts-s3/mirror-step-test.sh .github/assert-no-persisted-credential.sh

  publish-workspace-lock:
    # The write half of the same mechanism. `clone-siblings` READS a per-commit
    # lock; this action is the only thing in CI that WRITES one, into a store
    # that is append-only and whose records are immutable. A defect here does
    # not fail this repo — it publishes a wrong sibling set under a mainline
    # commit, where it is immutable and every consumer builds against it.
    #
    # Same stock runner as the job above, and for the same reason: the suites
    # stand up their own bare repositories and a URL-rewriting `git` shim, so
    # they need no network, no Nix, no secrets and no self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: anchor-workspace-lock.sh contract suite
        run: bash publish-workspace-lock/anchor-workspace-lock-test.sh

      # The transform suite covers what one field move must and must not touch;
      # this one covers the publishing step around it — the `run:` body is
      # extracted from action.yml and executed against local bares, so
      # immutability, idempotency, the lost-push-race recovery and the
      # "did it actually land on mainline" proof are exercised against real git
      # rather than described in a comment.
      - name: publish-workspace-lock step contract suite
        run: bash publish-workspace-lock/publish-workspace-lock-step-test.sh

      - name: shellcheck
        run: shellcheck -S warning publish-workspace-lock/anchor-workspace-lock.sh publish-workspace-lock/publish-workspace-lock.sh publish-workspace-lock/anchor-workspace-lock-test.sh publish-workspace-lock/publish-workspace-lock-step-test.sh

      # The REFRESH half of the same lifecycle. `publish-workspace-lock` above
      # carries a record verbatim and structurally cannot move a sibling pin;
      # `refresh-workspace-lock` moves one, and the only safe way to move one is
      # to generate a new record from a workspace that exists and propose it as
      # a pull request. Everything that can go wrong there goes wrong silently
      # -- a dirty checkout published as if this run had made it, a dry run that
      # left the tree modified, a typo in `dry-run` read as permission -- so the
      # suite is mostly refusals. Pure bash over real files with a `repro` shim;
      # no network, no Nix.
      - name: refresh-workspace-lock contract suite
        run: bash refresh-workspace-lock/refresh-workspace-lock-test.sh

      - name: shellcheck (refresh-workspace-lock)
        run: shellcheck -S warning refresh-workspace-lock/refresh-workspace-lock.sh refresh-workspace-lock/refresh-workspace-lock-test.sh

  setup-nix-git-auth:
    # `setup-nix` runs in almost every job in this org, so a mistake in how it
    # scopes the CI token does not fail this repo — it either leaks a live
    # credential onto fetches that should never see it, or unauthenticates
    # every private clone in the org. Same reasoning as the suite above: stock
    # runner, no Nix, no secrets, nothing this action itself provides.
    runs-on: ubuntu-latest
    steps:
      # `actions/checkout` defaults to `persist-credentials: true`, which writes
      #
      #     http.https://github.com/.extraheader = AUTHORIZATION: basic <token>
      #
      # into this checkout's LOCAL .git/config — the same catch-all shape
      # `setup-nix` no longer installs, at per-checkout scope. It is what made
      # this suite's first CI run fail while passing locally: `git config
      # --get-urlmatch` answered from the checkout's own credential. The suite
      # defends itself by querying git from a non-repository directory; turning
      # the header off removes the contaminant at its source as well, so the
      # guard is not sharing a runner-only failure mode with the thing it
      # guards.
      #
      # Safe here because neither job in this workflow runs a git operation
      # after the checkout: both run bash scripts and shellcheck, `permissions`
      # is `contents: read`, and nothing pushes, tags, fetches or updates a
      # submodule. The step below asserts the header is actually gone, so this
      # cannot silently regress if a future checkout release changes defaults.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: configure-git-auth.sh contract suite
        run: bash setup-nix/configure-git-auth-test.sh

      # The other credential this action installs, and the one that was
      # MISSING. `setup-nix` puts the caller's private Attic cache into
      # `substituters` and then wrote a netrc naming only github.com, so nix
      # had no credential for the cache it had just been told to use: 401 on
      # `nix-cache-info`, the substituter disabled, and everything not on
      # cache.nixos.org built from source — invisible on a warm bare-metal
      # runner, total on an ephemeral one.
      #
      # The suite asserts on the WIRE, not on the file: it runs the real curl
      # (the client nix hands netrc to) against a local origin that journals
      # the credential each request arrived with. A `machine` name carrying a
      # port or a path is well-formed netrc that matches nothing, which looks
      # exactly like the bug being fixed, and only the wire tells them apart.
      # Same stock runner; needs curl and python3, both of which this image has
      # and the git-auth suites already use.
      - name: nix netrc contract suite
        run: bash setup-nix/nix-netrc-test.sh

      # The binary-cache preflight, shared byte-for-byte with devops-modules
      # `.github/setup-nix`. Real script, real curl, real netrc, a loopback
      # origin playing the 200/401/403/404/portal/flaky cache shapes, and a
      # PATH as bare as the macOS self-hosted runners'.
      - name: binary-cache preflight contract suite
        run: bash setup-nix/tests/probe-substituters-test.sh

      # Install Nix exactly as setup-nix/action.yml's `Install Nix` step does
      # (same action version, determinate: false), so the suite below and the
      # end-to-end step run against the config the installer really writes.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      # The installer action writes a Determinate-only setting that upstream
      # Nix warns about on every invocation. Real nix, no mocks.
      - name: installer-setting strip contract suite
        run: bash setup-nix/tests/strip-unknown-installer-settings-test.sh

      # End to end: the installer wrote its settings into /etc/nix/nix.conf;
      # after the real script runs, a plain nix call must print nothing.
      - name: installer-written config is silent after the strip
        run: |
          bash setup-nix/strip-unknown-installer-settings.sh
          rc=0
          err="$(nix --extra-experimental-features nix-command eval --expr 1 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -ne 0 ] || [ -n "$err" ]; then
            echo "nix eval exited $rc; stderr: $err" >&2
            exit 1
          fi

      - name: shellcheck
        run: shellcheck -S warning setup-nix/strip-unknown-installer-settings.sh setup-nix/tests/strip-unknown-installer-settings-test.sh setup-nix/configure-git-auth.sh setup-nix/configure-git-auth-test.sh setup-nix/write-nix-netrc.sh setup-nix/nix-netrc-test.sh setup-nix/probe-substituters.sh setup-nix/tests/probe-substituters-test.sh

  setup-nix-alignment:
    # This setup-nix and devops-modules `.github/setup-nix` provision Nix for
    # most jobs in the org and must write the same nix.conf transfer settings
    # and run the same binary-cache preflight. When one was tuned and the other
    # was not, half the org kept the failure the tuning fixed. The comparison
    # script lives in devops-modules, which runs the same check against this
    # repository's `dev` daily; here it runs against devops-modules' `dev` on
    # every change, so drift introduced on this side fails before it lands.
    # Same stock runner, git and python3 only, no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout devops-modules (mainline)
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/devops-modules
          ref: dev
          path: .alignment/devops-modules
          persist-credentials: false

      - name: Compare the two setup-nix actions
        run: |
          git -C .alignment/devops-modules log -1 --format='devops-modules dev at %H'
          python3 .alignment/devops-modules/scripts/check-setup-nix-alignment.py \
            --devops-root .alignment/devops-modules \
            --mga-root .

  clone-git-auth:
    # `clone-siblings` and `clone-repo` clone into nearly every job in this org,
    # and until this suite existed the only thing standing between a CI App
    # token and the `.git/config` of every sibling clone was that nobody had
    # looked. Same reasoning as the two suites above — stock runner, no Nix, no
    # secrets — with one addition: this suite stands up its OWN git server on
    # 127.0.0.1 and clones through it, so it needs no network access either.
    # Everything it asserts about a credential, it observes on the wire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: authenticated-clone contract suite
        run: bash git-auth/authenticated-clone-test.sh

      # The job-scoped credential setup-nix and refresh-build-auth install: a
      # Git credential helper reading the job's token file. Real git against
      # the local server: 401 then retry, owner scoping, a rotation reaching a
      # Git process started before it, store/erase, broker ownership.
      - name: job credential helper contract suite
        run: bash git-auth/job-credential-helper-test.sh

      - name: private global Git credential contract suite
        run: python3 git-auth/test-private-global-config.py

      - name: private Cargo Git credential contract suite
        run: python3 git-auth/test-cargo-acquisition.py

      - name: locked sibling reconciliation real Git controls
        run: python3 setup-dev-env/test-locked-sibling-reconciliation.py

      # The Windows MAX_PATH half of the same script. Separate suite because it
      # needs a different observation apparatus (a `git` shim plus trace2
      # `def_param` events) and a different fixture shape (two levels of
      # submodule nesting, no server), and because it must be readable on its
      # own by whoever next wonders why `core.longpaths` is set from a clone
      # script. It runs on this stock Linux runner deliberately: the mechanism
      # under test is environment propagation into submodule git processes,
      # which is identical on every platform, and a Windows-only suite would be
      # a suite this repo's CI cannot run.
      - name: long-path contract suite
        run: bash git-auth/longpaths-test.sh

      - name: shellcheck
        run: shellcheck -S warning git-auth/scoped-git-auth.sh git-auth/git-credential-job-token.sh git-auth/job-credential-helper-test.sh git-auth/authenticated-clone.sh git-auth/authenticated-clone-test.sh git-auth/longpaths-test.sh reprobuild-provision/provision-reprobuild-siblings.sh reprobuild-provision/flake-lock-revisions.sh

  action-template-limits:
    # Every suite above EXTRACTS a composite action's `run:` body and executes
    # it, which works no matter how long that body is. GitHub's template parser
    # has the one opinion none of them can hold: past a length limit it refuses
    # the action outright, with
    #
    #   Exceeded max expression length 21000
    #
    # That is not a failing step in a consumer's job — the job never starts, and
    # the diagnostic names a file in THIS repo from inside somebody else's run.
    # Because every consumer pins `@dev`, it takes the mainline CI of every
    # repo in the org down at once, which is what happened on 2026-08-26 when
    # `clone-siblings` grew 1,419 characters of comment.
    #
    # The archive-size guard below is the same CLASS of problem, which is why it
    # shares this job: a property of what this repo publishes that fails inside
    # SOMEBODY ELSE'S `Set up job`, before their first step, and that no suite
    # above can see because they all extract a step body and run it locally.
    # The runner downloads a `uses:` target's WHOLE repository against a fixed
    # 100-second timeout, so a nested `uses:` into a large repo takes every
    # consumer down; `metacraft-labs/reprobuild@dev` at 546 MB did exactly that
    # to the Windows lane. See .github/assert-action-archive-size.sh.
    #
    # Same stock runner as the suites above. The template-limit check reads YAML
    # with bash and needs no network; the archive-size check does need network,
    # because codeload advertises no Content-Length and ignores Range, so a size
    # can only be measured by downloading (bounded to the budget, ~32 MiB worst
    # case). Neither needs Nix or secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: no credential persisted into the checkout
        run: bash .github/assert-no-persisted-credential.sh

      - name: "composite run: bodies stay inside the template limit"
        run: bash .github/assert-composite-run-size.sh

      # Fifth property of the same class, and the one that cost the most to
      # find. A credential positioned in a clone URL is sent only after a 401,
      # so it authenticates PRIVATE repos and silently does nothing for PUBLIC
      # ones — which are then fetched on GitHub's per-IP anonymous budget that
      # this org's whole ephemeral fleet shares, and fail under load with
      # "temporarily limiting some unauthenticated downloads" and exit 128.
      # `reprobuild-provision` carried that shape into all 51 repos using the
      # reprobuild flavor. Needs no network: it reads the manifests.
      - name: no action manifest embeds a credential in a URL
        run: bash .github/assert-no-url-embedded-credential.sh

      - name: referenced action archives stay downloadable in 100s
        env:
          # Only to authenticate the codeload fetches; the guard reads sizes and
          # nothing else. Anonymous access is rate-limited per IP and the whole
          # runner fleet shares one, which would turn a pass into an
          # unmeasurable-archive failure.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/assert-action-archive-size.sh

      - name: archive-size guard contract suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/assert-action-archive-size-test.sh

      # Third property of the same class: one manifest, every consumer, before
      # any step they could have used to notice. An action's `description:` is
      # evaluated, not quoted, and against a context with no `github` — so a
      # comment written as an expression is a parse error in all 64 consuming
      # repos. Needs no network.
      - name: manifest prose carries no evaluated expressions
        run: bash .github/assert-no-expression-in-manifest-prose.sh

      - name: manifest-prose guard contract suite
        run: bash .github/assert-no-expression-in-manifest-prose-test.sh

      # Fourth property of the same class, and the one this workflow is itself
      # the cautionary tale for. The `branches:` line above said `main` while
      # this repository's mainline was `dev`, so every guard in this file ran
      # on pull requests only and a push straight to the mainline — how a
      # shared-actions repo is usually corrected in a hurry — ran nothing. The
      # failure is silent by construction: an empty check list on a mainline
      # commit looks exactly like a clean one. A sweep afterwards found the
      # same defect in 33 workflows across 22 repositories.
      #
      # Needs no network here: the mainline is stated rather than detected, so
      # the guard cannot be quietly satisfied by a runner that cannot reach
      # origin.
      - name: workflow branch filters name the mainline
        run: bash .github/assert-workflow-triggers-mainline.sh dev

      - name: mainline-trigger guard contract suite
        run: bash .github/assert-workflow-triggers-mainline-test.sh

      - name: workflow discovery contract suite
        run: bash .github/assert-workflow-triggers-discovery-test.sh

      - name: actual workflow action runtime and input contracts
        run: node --test .github/assert-workflow-triggers-action-test.cjs

      - name: shellcheck
        run: shellcheck -S warning .github/assert-composite-run-size.sh .github/assert-no-url-embedded-credential.sh .github/assert-action-archive-size.sh .github/assert-action-archive-size-test.sh .github/assert-no-expression-in-manifest-prose.sh .github/assert-no-expression-in-manifest-prose-test.sh .github/assert-workflow-triggers-mainline.sh .github/assert-workflow-triggers-mainline-test.sh .github/assert-workflow-triggers-discovery-test.sh

  portable-hooks:
    # Independent native POSIX hook qualification; existing guard jobs unchanged.
    # Native Windows formatter provisioning remains an explicit owning issue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Complete canonical portable hooks and owning lint
        env:
          PREK_NO_FAST_PATH: "1"
        run: nix-shell shell.nix --run 'prek run --all-files && bash tools/lint.sh'
