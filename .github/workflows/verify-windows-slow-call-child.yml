name: Verify architecture-matched Windows slow-call child
on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/verify-windows-slow-call-child.yml
      - diagnostics/windows-slow-call-child.ps1
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/reprobuild
          ref: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          path: .toolchain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/nim-stackable-hooks
          ref: 6342a215f89559ae01a703a37b24d0a7743a4c52
          path: nim-stackable-hooks
          fetch-depth: 2
          persist-credentials: false
      - name: Compare the real slow-call fixture children
        shell: pwsh
        timeout-minutes: 25
        run: ./diagnostics/windows-slow-call-child.ps1
      - name: Preserve compilation and runtime outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-slow-call-child-${{ matrix.runner }}
          path: build/windows-slow-call-child/
          retention-days: 14
          if-no-files-found: error
