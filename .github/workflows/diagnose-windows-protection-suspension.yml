name: Diagnose Windows protection during suspension

on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/diagnose-windows-protection-suspension.yml
      - diagnostics/windows-protection-suspension.c
      - diagnostics/windows-protection-suspension.ps1

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/reprobuild
          ref: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          path: .toolchain
          persist-credentials: false
      - name: Compare real protection calls with active and suspended workers
        shell: pwsh
        run: ./diagnostics/windows-protection-suspension.ps1
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-protection-suspension-${{ matrix.runner }}
          path: build/windows-protection-suspension/
          retention-days: 14
          if-no-files-found: error
