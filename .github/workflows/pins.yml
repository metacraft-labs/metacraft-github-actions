name: pins

# Validates the tooling pins under pins/ (see pins/README.md) and gates every
# change to them. A pin move is a deploy for every consumer that follows it:
# every repository's CI installs the reprobuild pin through setup-reprobuild /
# setup-dev-env, and infra, devops-modules and ~/dotfiles import the same
# files. So a bad pin must fail here, before it merges, and not in a consumer.
#
# THE REQUIRED CHECK IS `pins-gate`. It is the only job a branch protection
# rule (infra's governance, requiredStatusChecks for this repository) should
# name. The workflow therefore runs on EVERY pull request and push, with no
# workflow-level `paths:` filter: a required check that never reports blocks
# every pull request that does not touch pins/. The `changes` job decides
# which parts of the gate a change needs, the expensive jobs run only then,
# and `pins-gate` accepts a skipped job only when `changes` said it was not
# needed.
#
# What runs, and when:
#   local               always: schema of every pin, the checker's and the
#                       resolver's contract tests (stock runner, no secrets)
#   remote              a pin changed: each rev exists in its repository,
#                       the fetched tree matches narHash, every named package
#                       exists, and rev qualifies as its `kind`; plus a
#                       negative control proving a nonexistent commit fails
#   reprobuild-package  the reprobuild pin or its readers changed: section 0
#                       (`nix build` of the pinned package, Linux and macOS)
#                       and section 0b (the binary reads the real workspace
#                       manifests and answers the managed-hook contract) of
#                       metacraft-pm how-to-distribute-new-reprobuild-versions-internally.md;
#                       it also pushes the built package to the Attic cache
#                       (not a gate)
#   setup-reprobuild    the same changes: the action installs the pin with no
#                       repro-build-pin on Linux, macOS and Windows, and an
#                       explicit override installs the override; on Windows
#                       the pinned engine also monitors a real compiler and
#                       the program it built
#   resolver-windows    the same changes: the Windows pin reader
#                       (ConvertFrom-Json) and setup-dev-env's
#                       installed-Reprobuild report, on a real Windows runner
#   windows-pin-release a push to agents or dev, the schedule, or a dispatch
#                       on one of them, when the prerelease `pin-<rev>` for
#                       the pinned Reprobuild commit is missing or incomplete:
#                       build that commit from source on a self-hosted Windows
#                       runner, package it with reprobuild's release packaging
#                       script, verify it, and publish it here as a
#                       prerelease that setup-reprobuild installs on Windows
#                       (not a gate; three jobs: plan, build, publish)
#   codetracer-mac-lock the CodeTracer pin, its lock workflow or its tool
#                       changed (never on the schedule; on a dispatch only
#                       when asked; see `changes`): solve and check
#                       CodeTracer's aarch64-darwin lock at the pinned
#                       revision on a hosted arm64 Mac
#                       (.github/workflows/codetracer-mac-lock.yml)
#
# The remote, package, install and CodeTracer lock jobs mint a CI token
# provider app token, so they fail rather than pass on a fork's pull request,
# which receives no secrets: a pin change must come from a branch of this
# repository.

on:
  push:
    branches: [agents, dev]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      codetracer-mac-lock:
        description: Also solve CodeTracer's aarch64-darwin lock on a hosted arm64 Mac (codetracer-mac-lock.yml can be dispatched on its own too).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which parts of the gate this change needs: `git diff BASE..HEAD`, where
    # BASE is the pull request's base commit or the push's `before`. For the
    # pins and Reprobuild parts, a missing or all-zero BASE, a diff that
    # fails, a schedule and a dispatch all count as changing everything.
    #
    # The CodeTracer part runs a hosted arm64 Mac for half an hour, so it has
    # its own, narrower rule (pins/README.md, "When the CodeTracer lock job
    # runs"): it runs when the CodeTracer files differ in the change under
    # test, never on the schedule, on a dispatch only when its input asks,
    # and on a push not when the merged branch already proved the same files
    # on its pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the pull request runs that prove a merge push's CodeTracer
      # files (below).
      actions: read
    outputs:
      pins: ${{ steps.diff.outputs.pins }}
      reprobuild: ${{ steps.diff.outputs.reprobuild }}
      codetracer: ${{ steps.diff.outputs.codetracer }}
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Which parts of the gate this change needs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_CODETRACER: ${{ inputs.codetracer-mac-lock }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          files="$RUNNER_TEMP/changed-files"
          all=false
          case "$EVENT" in
            pull_request | push)
              if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
                all=true
              elif ! git diff --name-only "$BASE..HEAD" > "$files"; then
                echo "::warning::git diff $BASE..HEAD failed; treating every part as changed"
                all=true
              fi
              ;;
            *) all=true ;;
          esac
          [ -f "$files" ] || : > "$files"
          echo "all=$all; changed files:"
          cat "$files"
          matches() {
            "$all" || grep -Eq "$1" "$files"
          }
          workflow='^\.github/workflows/pins\.yml$'
          ct_files='pins/codetracer.json .github/workflows/codetracer-mac-lock.yml tools/codetracer-mac-lock.py'
          ct_pattern='^pins/codetracer\.json$|^\.github/workflows/codetracer-mac-lock\.yml$|^tools/codetracer-mac-lock\.py$'

          # A push of a merge commit whose second parent (the merged branch)
          # carries exactly the CodeTracer files HEAD does, where a
          # pull_request run of this workflow on that parent passed with the
          # lock job's `result` and `pins-gate` successful: those files were
          # solved on a Mac already. Anything short of that, including an API
          # error, is no proof. Only for push: a pull request's HEAD is a test
          # merge whose second parent is the pull request itself.
          proven_on_pull_request() {
            local parent f runs jobs id
            parent="$(git rev-parse -q --verify 'HEAD^2')" || return 1
            for f in $ct_files; do
              [ "$(git rev-parse -q --verify "HEAD:$f")" = "$(git rev-parse -q --verify "$parent:$f")" ] || {
                echo "HEAD's $f differs from the merged branch's ($parent)"; return 1; }
            done
            runs="$RUNNER_TEMP/proof-runs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pins.yml/runs?event=pull_request&status=success&head_sha=$parent&per_page=20" > "$runs" || {
              echo "::warning::could not list the pull request runs of $parent"; return 1; }
            for id in $(python3 -I -c 'import json, sys; [print(r["id"]) for r in json.load(open(sys.argv[1]))["workflow_runs"]]' "$runs"); do
              jobs="$RUNNER_TEMP/proof-jobs-$id.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" > "$jobs" || continue
              if python3 -I -c '
          import json, sys
          done = {j["name"]: j["conclusion"] for j in json.load(open(sys.argv[1]))["jobs"]}
          sys.exit(0 if done.get("codetracer-mac-lock / result") == "success" and done.get("pins-gate") == "success" else 1)
          ' "$jobs"; then
                echo "proven by pull request run $id on $parent"; return 0
              fi
            done
            echo "no successful pull request run with the lock job on $parent"; return 1
          }

          pins=false reprobuild=false codetracer=false
          if matches "^pins/|^flake\.nix$|^tools/check-pins\.py$|^tools/update-pin\.sh$|$workflow"; then pins=true; fi
          if matches "^pins/reprobuild\.json$|^pins/pin\.schema\.json$|^pins/default\.nix$|^flake\.nix$|^setup-reprobuild/|^setup-dev-env/action\.yml$|^setup-dev-env/report-installed-repro\.sh$|^setup-dev-env/test-repro-commit-output\.py$|^tools/check-reprobuild-fits-workspace\.sh$|^tools/test-check-reprobuild-fits-workspace\.py$|^tools/workspace-manifest-branches\.py$|^tools/test-workspace-manifest-branches\.py$|$workflow"; then reprobuild=true; fi
          case "$EVENT" in
            pull_request)
              if matches "$ct_pattern"; then codetracer=true; fi
              ;;
            push)
              if matches "$ct_pattern"; then
                if proven_on_pull_request; then codetracer=false; else codetracer=true; fi
              fi
              ;;
            workflow_dispatch)
              if [ "$DISPATCH_CODETRACER" = true ]; then codetracer=true; fi
              ;;
            *) ;; # schedule: never
          esac
          printf 'pins=%s\nreprobuild=%s\ncodetracer=%s\n' "$pins" "$reprobuild" "$codetracer" | tee -a "$GITHUB_OUTPUT"
      - id: owners
        # The owners the pins name: the remote job mints one token for each.
        run: echo "owners=$(python3 -I tools/check-pins.py --list-owners)" | tee -a "$GITHUB_OUTPUT"

  local:
    # Stock runner, Python standard library only: no Nix, no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tests of the checker
        run: python3 -I tools/test-check-pins.py
      - name: Tests of section 0b's repro-workspace branch selection
        run: python3 -I tools/test-workspace-manifest-branches.py
      - name: Every pin satisfies the schema
        run: python3 -I tools/check-pins.py
      - name: The setup actions' pin resolver and installed-CLI check
        # pwsh is on every hosted runner; REQUIRE_PWSH makes the Windows
        # reader's cases run here too instead of skipping.
        run: REQUIRE_PWSH=1 python3 -I setup-reprobuild/test-resolve-reprobuild-pin.py

  resolver-windows:
    needs: changes
    if: ${{ needs.changes.outputs.reprobuild == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The pin resolver through Git Bash and the native PowerShell reader
        shell: bash
        run: REQUIRE_PWSH=1 python setup-reprobuild/test-resolve-reprobuild-pin.py
      - name: setup-dev-env's installed-Reprobuild report through Git Bash
        # report-installed-repro.sh runs under Git Bash on Windows jobs, and
        # resolves a release override's tag with Git for Windows.
        shell: bash
        run: python setup-dev-env/test-repro-commit-output.py -v

  remote:
    # One leg per owner the pins name, each with a CI token provider app
    # token for that owner; a new pin's owner needs no workflow change.
    needs: [changes, local]
    if: ${{ needs.changes.outputs.pins == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.changes.outputs.owners) }}
    name: remote (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: The owner's pinned repositories
        id: repos
        env:
          OWNER: ${{ matrix.owner }}
        # An assignment, not `echo "repos=$(...)"`: `bash -e` ignores a failing
        # substitution inside an argument, and an empty `repositories:` input
        # mints a token for every repository of the owner's installation.
        run: |
          repos="$(python3 -I tools/check-pins.py --list-repos --owner "$OWNER")"
          echo "repos=$repos" | tee -a "$GITHUB_OUTPUT"

      # Least privilege (pins/README.md, "Tokens"): contents:read only, on the
      # owner's pinned repositories only. Everything this leg does with the
      # token reads contents: the commits, compare, git/ref, and releases
      # API calls of check-pins.py, and Nix's tarball fetches through
      # setup-nix. The App also carries write permissions; requesting one
      # `permission-*` input drops every permission not requested. The flake
      # inputs outside these repositories are public.
      - name: Mint a read token for the owner
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ steps.repos.outputs.repos }}
          permission-contents: read

      - name: Setup Nix (this checkout's action)
        uses: ./setup-nix
        with:
          gh-token: ${{ steps.token.outputs.token }}
          token-owner: ${{ matrix.owner }}

      - name: The revisions exist, hash as pinned, name real packages and qualify as their kind
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python3 -I tools/check-pins.py --remote --owner "$OWNER"

      - name: "Negative control: a pin naming a nonexistent commit fails"
        if: ${{ matrix.owner == 'metacraft-labs' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -uo pipefail
          control="$(mktemp -d)"
          cp pins/pin.schema.json "$control/"
          python3 -I - pins/reprobuild.json "$control/reprobuild.json" <<'PY'
          import json, sys
          pin = json.load(open(sys.argv[1]))
          pin['rev'] = '0' * 39 + '1'
          json.dump(pin, open(sys.argv[2], 'w'))
          PY
          # The step shell is `bash -e`: capture the expected failure.
          status=0
          python3 -I tools/check-pins.py --remote --pins-dir "$control" > "$control/out" 2>&1 || status=$?
          cat "$control/out"
          [ "$status" -eq 1 ] && grep -q 'was not found in metacraft-labs/reprobuild' "$control/out"

  reprobuild-package:
    # Sections 0 and 0b of the distribution guide, on each OS we distribute
    # to. macOS runs on the hosted arm64 image; the darwin postFixup
    # (install_name_tool, lipo, signing) is invisible from Linux.
    needs: [changes, local]
    if: ${{ needs.changes.outputs.reprobuild == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mint a read token for metacraft-labs
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          nix-github-token: ${{ steps.token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: "Section 0: the pinned package builds"
        id: build
        run: |
          set -euo pipefail
          # Through the flake output `pins`, the way Nix consumers read it; it
          # must agree with the JSON file the setup actions read.
          ref="$(nix eval --raw --no-write-lock-file .#pins.reprobuild.flakeRef)"
          rev="$(nix eval --raw --no-write-lock-file .#pins.reprobuild.rev)"
          test "$rev" = "$(python3 -I -c 'import json; print(json.load(open("pins/reprobuild.json"))["rev"])')"
          case "$ref" in "github:metacraft-labs/reprobuild/$rev?narHash="*) ;; *) echo "unexpected flakeRef $ref"; exit 1 ;; esac
          echo "building $ref#default"
          out="$(nix build --no-link --print-out-paths "$ref#default")"
          echo "$out"
          "$out/bin/repro" --version
          version="$(nix eval --raw --no-write-lock-file .#pins.reprobuild.version)"
          test "$("$out/bin/repro" --version)" = "repro $version"
          echo "repro=$out/bin/repro" >> "$GITHUB_OUTPUT"
          echo "package=$out" >> "$GITHUB_OUTPUT"

      # Build once, reuse from the cache. setup-reprobuild substitutes the
      # pinned commit's package from the organisation's Attic cache before it
      # compiles the engine, and this job has just built exactly that package
      # (`#default` and `#reprobuild` are the same output; the setup action
      # asks for `#reprobuild`). So the job that builds the pin pushes it, and
      # every consumer job after it downloads it. Reprobuild's own release
      # pipeline pushes only revisions that go through a release run, and only
      # for x86_64-linux; an `agents-commit` pin may have no such run at all.
      #
      # Not a gate: the cache entry is a convenience, and a cache-service
      # failure must not block a pin whose package built and passed 0b. It is
      # not silent either: missing credentials and a failed push are
      # annotated, and the job summary says how to repeat the push. A re-run
      # of this job rebuilds the package; `attic push` sends only what the
      # cache does not hold yet.
      - name: Push the pinned package to the organisation cache
        continue-on-error: true
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "${ATTIC_TOKEN}" || -z "${ATTIC_CACHE}" || -z "${ATTIC_ENDPOINT}" ]]; then
            echo "::warning::secrets.ATTIC_TOKEN, vars.ATTIC_CACHE and vars.ATTIC_ENDPOINT are not all set for this repository, so the pinned package $PACKAGE was not pushed to the organisation cache; every consumer job builds the engine from source until it is"
            echo "The pinned Reprobuild package \`$PACKAGE\` was **not** pushed to the organisation cache: this repository has no Attic credentials." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::add-mask::$ATTIC_TOKEN"
          attic="$(nix build --no-link --print-out-paths --accept-flake-config nixpkgs#attic-client)/bin/attic"
          "$attic" login --set-default pins "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          if ! "$attic" push "$ATTIC_CACHE" "$PACKAGE"; then
            echo "::warning::pushing $PACKAGE to the Attic cache $ATTIC_CACHE failed; re-run this job to push it again"
            echo "Pushing the pinned Reprobuild package \`$PACKAGE\` to \`$ATTIC_CACHE\` **failed**. Re-run this job to push it again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Pushed $PACKAGE to $ATTIC_CACHE"
          echo "Pushed the pinned Reprobuild package \`$PACKAGE\` to \`$ATTIC_CACHE\`." >> "$GITHUB_STEP_SUMMARY"

      # Section 0b reads the manifests on every repro-workspace branch people
      # use. The workspace root is migrating from `dev`/`agents` to a single
      # mainline `latest`, so the set is whichever of `latest`, `dev` and
      # `agents` exists; `agents` is already gone, and when `dev` goes too the
      # check keeps running on `latest` alone. `latest` missing, or none of
      # them existing, fails the job instead of checking less or nothing.
      # tools/workspace-manifest-branches.py holds the rule and its reasons.
      - name: Which repro-workspace branches carry manifests
        id: branches
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The token reaches git through process-scoped configuration, never
          # through a URL or argv; the base64 form is masked like the token.
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          heads="$(mktemp)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/metacraft-labs/repro-workspace.extraHeader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git ls-remote --heads https://github.com/metacraft-labs/repro-workspace > "$heads"
          python3 -I tools/workspace-manifest-branches.py --heads "$heads" | tee -a "$GITHUB_OUTPUT"

      - name: Check out the workspace manifests (latest)
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/repro-workspace
          ref: latest
          path: .workspaces/latest
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Check out the workspace manifests (dev)
        if: ${{ steps.branches.outputs.dev == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/repro-workspace
          ref: dev
          path: .workspaces/dev
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Check out the workspace manifests (agents)
        if: ${{ steps.branches.outputs.agents == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/repro-workspace
          ref: agents
          path: .workspaces/agents
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: "Section 0b: the binary fits the workspace, with its negative controls"
        env:
          REPRO: ${{ steps.build.outputs.repro }}
          BRANCHES: ${{ steps.branches.outputs.branches }}
        run: |
          set -euo pipefail
          case " $BRANCHES " in *" latest "*) ;; *) echo "no latest in '$BRANCHES'"; exit 1 ;; esac
          for branch in $BRANCHES; do
            echo "::group::repro-workspace $branch at $(git -C ".workspaces/$branch" rev-parse HEAD)"
            python3 -I tools/test-check-reprobuild-fits-workspace.py \
              --repro "$REPRO" --workspace ".workspaces/$branch" -v
            echo "::endgroup::"
          done

  setup-reprobuild:
    # stp1_setup_reprobuild_installs_the_pinned_commit: the action, from this
    # checkout, installs the pin when the caller names nothing, and installs
    # the override when the caller names one.
    needs: [changes, local]
    if: ${{ needs.changes.outputs.reprobuild == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, case: pin }
          - { os: macos-15, case: pin }
          - { os: windows-2025, case: pin }
          - { os: ubuntu-24.04, case: release-override, repro-version: v0.2.31 }
          - { os: macos-15, case: release-override, repro-version: v0.2.31 }
          - { os: windows-2025, case: release-override, repro-version: v0.2.31 }
          # v0.2.31's commit on reprobuild agents, built from source.
          - {
              os: ubuntu-24.04,
              case: build-override,
              repro-build-pin: 7618e3cb21ce17f5c86fbd290f501d60d52e9be1,
            }
    name: setup-reprobuild (${{ matrix.case }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mint a read token for metacraft-labs
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Install repro (no repro-build-pin for the pin case)
        id: repro
        uses: ./setup-reprobuild
        with:
          gh-token: ${{ steps.token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          repro-version: ${{ matrix.repro-version || '' }}
          repro-build-pin: ${{ matrix.repro-build-pin || '' }}

      - name: The installed repro is the selected one
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          ORIGIN: ${{ steps.repro.outputs.origin }}
          VERSION: ${{ steps.repro.outputs.version }}
          COMMIT: ${{ steps.repro.outputs.commit }}
          INSTALL_SOURCE: ${{ steps.repro.outputs.install-source }}
        run: |
          set -euo pipefail
          echo "case=$CASE origin=$ORIGIN version=$VERSION commit=$COMMIT install-source=$INSTALL_SOURCE"
          repro --version
          # Windows images have `python`, not `python3`.
          python="$(command -v python3 || command -v python)"
          pin_version="$("$python" -I -c 'import json; print(json.load(open("pins/reprobuild.json"))["version"])' | tr -d '\r')"
          pin_rev="$("$python" -I -c 'import json; print(json.load(open("pins/reprobuild.json"))["rev"])' | tr -d '\r')"
          case "$CASE" in
            pin)
              test "$ORIGIN" = pin
              test "$VERSION" = "$pin_version"
              test "$COMMIT" = "$pin_rev"
              # On Linux the pinned commit's package comes from the binary
              # cache when a cache this job trusts holds it, and on Windows
              # from the commit's pin prerelease when one is published
              # (windows-pin-release); otherwise, and always on macOS, it is
              # built from source.
              case "$RUNNER_OS:$INSTALL_SOURCE" in
                Linux:cache | Windows:pin-release | *:source) ;;
                *) echo "unexpected install-source $INSTALL_SOURCE on $RUNNER_OS"; exit 1 ;;
              esac
              ;;
            release-override)
              test "$ORIGIN" = override
              test "$VERSION" = 0.2.31
              test "$INSTALL_SOURCE" = release
              ;;
            build-override)
              test "$ORIGIN" = override
              test "$VERSION" = 0.2.31
              test "$COMMIT" = 7618e3cb21ce17f5c86fbd290f501d60d52e9be1
              case "$INSTALL_SOURCE" in source | cache) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          test "$(repro --version | tr -d '\r')" = "repro $VERSION"

      # The pinned engine's Windows monitor runs real processes: a C compiler
      # and the program it built, each under `repro internal io monitor`, with
      # the child's exit code passed through, its real file I/O done, and a
      # trace written for both. Formerly validate-windows-hook-bootstrap.yml,
      # which ran it for one hand-picked engine and hook revision; here it
      # runs for whatever the pin names, by whichever route installed it.
      # The compiler is the source build's REPRO_BOOTSTRAP_CC when that route
      # exported one, else the runner image's MinGW gcc.
      - name: The pinned engine monitors a real compiler and its program (Windows)
        if: ${{ matrix.case == 'pin' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:RUNNER_TEMP 'monitor-smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $cc = $env:REPRO_BOOTSTRAP_CC
          if (-not $cc) { $cc = (Get-Command gcc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $cc -or -not (Test-Path -LiteralPath $cc)) {
            throw 'No C compiler: neither REPRO_BOOTSTRAP_CC nor gcc.exe on PATH'
          }
          Write-Host "compiler: $cc"
          @'
          /* A real compiler, process and file boundary; nothing is stubbed. */
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            char input[64];
            if (argc != 3) return 2;
            FILE *in = fopen(argv[1], "rb");
            if (!in || !fgets(input, sizeof(input), in)) return 3;
            fclose(in);
            if (strcmp(input, "monitor-probe\n") != 0) return 4;
            FILE *out = fopen(argv[2], "wb");
            if (!out) return 5;
            if (fputs("observed input\n", out) < 0 || fclose(out)) return 6;
            return 7;
          }
          '@ | Set-Content "$dir/probe.c"
          [IO.File]::WriteAllText("$dir/input.txt", "monitor-probe`n")
          & repro internal io monitor --depfile "$dir/compile.iomon" -- $cc "$dir/probe.c" -o "$dir/probe.exe"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$dir/probe.exe")) {
            throw "The monitored compiler failed (exit $LASTEXITCODE)"
          }
          # 7 is the probe's success code: a monitor that reports its own
          # status instead of the child's fails here.
          & repro internal io monitor --depfile "$dir/execute.iomon" -- "$dir/probe.exe" "$dir/input.txt" "$dir/output.txt"
          if ($LASTEXITCODE -ne 7) { throw "The monitored program's exit code was not preserved (got $LASTEXITCODE, not 7)" }
          if ([IO.File]::ReadAllText("$dir/output.txt") -cne "observed input`n") {
            throw 'The monitored program did not read and write its real files'
          }
          foreach ($trace in @('compile.iomon', 'execute.iomon')) {
            if (-not (Test-Path "$dir/$trace") -or (Get-Item "$dir/$trace").Length -eq 0) {
              throw "The monitor wrote no trace: $trace"
            }
          }
          Write-Host 'The pinned engine monitors a real compiler and its program.'

  # ── The Windows pin prerelease ────────────────────────────────────────────
  #
  # Build once, reuse: the Windows counterpart of the Attic push above. On
  # Windows setup-reprobuild has no Nix to substitute from, so before this
  # every Windows job compiled the pinned commit from source: 16-19 minutes
  # on win-ci-bare-001, and past the six-hour job limit on the GARM and VM
  # runners (move and js recorder runs, 2026-11-24/25). These three jobs build
  # the pinned commit ONCE, as a release-style bundle, and publish it as the
  # prerelease `pin-<rev>` of this repository; setup-reprobuild installs it on
  # Windows (install-pin-release.sh) and builds from source only on a miss.
  #
  # Why this repository and not reprobuild: the publish job's own
  # GITHUB_TOKEN can create a release here, install-release.sh already takes
  # the repository as a parameter, and nothing in reprobuild's release
  # listing changes. A pin prerelease is not a Reprobuild release: it is a
  # source build of one pinned commit, so it is a prerelease (never
  # "Latest"), its tag and title name the commit, and its notes say so.
  #
  # Why not on pull requests: the prerelease is shared state every Windows
  # job installs, so it is published only from the branches the pin is
  # declared on (agents, dev) after the change landed there, never from an
  # unmerged change. A pull request that moves the pin is still gated by
  # `setup-reprobuild (pin, windows-2025)`, which builds it from source.
  #
  # Not a gate: none of these jobs is in pins-gate's `needs`. A failed build
  # or publish leaves consumers on the source route, which is announced.
  windows-pin-release-plan:
    needs: local
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/agents' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      rev: ${{ steps.plan.outputs.rev }}
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      asset: ${{ steps.plan.outputs.asset }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Is the pin prerelease missing or incomplete
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r rev version kind < <(python3 -I -c 'import json; p = json.load(open("pins/reprobuild.json")); print(p["rev"], p["version"], p["kind"])')
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pins/reprobuild.json rev '$rev' is not a full SHA"; exit 1; }
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::pins/reprobuild.json version '$version' is implausible"; exit 1; }
          tag="pin-$rev"
          asset="reprobuild-$version-windows-x86_64.zip"
          needed=false
          if [ "$kind" = release ]; then
            # A release pin is installed from the release itself.
            echo "the pin is the release v$version; no pin prerelease is needed"
          elif names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2> "$RUNNER_TEMP/view.err")"; then
            if grep -qxF "$asset" <<< "$names" && grep -qxF SHA256SUMS <<< "$names"; then
              echo "$tag already carries $asset and SHA256SUMS"
            else
              echo "$tag exists without $asset and SHA256SUMS (has: $(tr '\n' ' ' <<< "$names")); completing it"
              needed=true
            fi
          elif grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
            echo "$tag does not exist yet"
            needed=true
          else
            cat "$RUNNER_TEMP/view.err"
            echo "::error::could not ask whether $tag exists"
            exit 1
          fi
          printf 'needed=%s\nrev=%s\nversion=%s\nkind=%s\ntag=%s\nasset=%s\n' \
            "$needed" "$rev" "$version" "$kind" "$tag" "$asset" | tee -a "$GITHUB_OUTPUT"

  windows-pin-release-build:
    # Publishes nothing and holds no write permission: the bundle leaves this
    # self-hosted runner only as a workflow artifact, which the publish job
    # re-verifies before it uploads anything.
    needs: windows-pin-release-plan
    if: ${{ needs.windows-pin-release-plan.outputs.needed == 'true' }}
    # The label set reprobuild's own Windows release leg runs on
    # (.github/release-platforms.json) and this repository's other
    # self-hosted Windows jobs use.
    runs-on: [self-hosted, windows, x64, dev-env-ready]
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      REV: ${{ needs.windows-pin-release-plan.outputs.rev }}
      VERSION: ${{ needs.windows-pin-release-plan.outputs.version }}
      ASSET: ${{ needs.windows-pin-release-plan.outputs.asset }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # contents:read on the owner's repositories: the reprobuild source and
      # the siblings its Windows build reads, some of them private.
      - name: Mint a read token for metacraft-labs
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          permission-contents: read

      # The consumers' own Windows source build, from this checkout: the
      # pinned commit cloned to .reprobuild-src, its siblings provisioned at
      # the revisions it locks, env.ps1's toolchains, `just build` in release
      # mode. The prerelease is missing (the plan said so), so the action
      # takes its source route; the next step refuses anything else.
      - name: Build the pinned commit from source
        id: repro
        uses: ./setup-reprobuild
        with:
          gh-token: ${{ steps.token.outputs.token }}

      - name: The build is the pinned commit, from source
        shell: bash
        env:
          INSTALL_SOURCE: ${{ steps.repro.outputs.install-source }}
          COMMIT: ${{ steps.repro.outputs.commit }}
          INSTALLED_VERSION: ${{ steps.repro.outputs.version }}
        run: |
          set -euo pipefail
          echo "install-source=$INSTALL_SOURCE commit=$COMMIT version=$INSTALLED_VERSION"
          test "$INSTALL_SOURCE" = source
          test "$COMMIT" = "$REV"
          test "$INSTALLED_VERSION" = "$VERSION"

      # stage_release_catalog.sh (called by the packaging script) ships the
      # reprobuild-packages catalog at the revision the commit's repro.lock
      # pins, from a checkout beside it. The consumers' source build does not
      # read the catalog, so reprobuild-provision does not clone it.
      - name: Clone the reprobuild-packages catalog the pinned commit locks
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/.reprobuild-src/repro.lock"
          rev="$(tr -d '\r' < "$lock" | grep -o '{ name = "reprobuild-packages",[^}]*}' |
            sed -n 's/.*[{ ,]revision = "\([0-9a-f]\{40\}\)".*/\1/p')"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$lock pins no single reprobuild-packages revision (read '$rev')"; exit 1; }
          . ./git-auth/scoped-git-auth.sh
          export TOKEN_OWNERS=metacraft-labs SCOPED_GIT_AUTH_MASK=1
          scoped_git_auth_build
          scoped_git_auth_export
          bash ./git-auth/authenticated-clone.sh --repo metacraft-labs/reprobuild-packages \
            --dest "$GITHUB_WORKSPACE/reprobuild-packages" --rev "$rev" --shallow

      # Reprobuild's own packaging script, the one its Windows release leg and
      # its bundle gate run, from the pinned commit's tree: nothing about the
      # archive layout is restated here.
      - name: Package the bundle (reprobuild scripts/release/package_windows_release.ps1)
        id: package
        shell: pwsh
        working-directory: .reprobuild-src
        run: |
          . .\env.ps1
          $out = @(./scripts/release/package_windows_release.ps1 -Zip -Platform windows -Arch x86_64)
          $pkgName = Split-Path -Leaf $out[0]
          $zip = Split-Path -Leaf $out[1]
          if ($zip -ne $env:ASSET) {
            throw "the packaging script produced $zip, not $env:ASSET (does reprobuild.nimble at $env:REV declare $env:VERSION?)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "pkg-name=$pkgName"

      # The release leg's checks of the packaged archive, run on this one:
      # verify_release.sh (the runtime-DLL manifest and a PATH-scrubbed run),
      # then the source closure and a real `repro exec` from the archive's
      # own sources.
      - name: Verify the bundle (reprobuild's release checks)
        shell: bash
        working-directory: .reprobuild-src
        timeout-minutes: 60
        env:
          PKG_NAME: ${{ steps.package.outputs.pkg-name }}
        run: |
          set -euo pipefail
          bash scripts/verify_release.sh "$ASSET"
          bash scripts/release/check_release_source_closure.sh "$PKG_NAME"
          gcc_exe="$(command -v gcc.exe || command -v gcc || true)"
          [ -n "$gcc_exe" ] || { echo "::error::no gcc on PATH for the smoke test (env.ps1 should have provisioned it)"; exit 1; }
          REPRO_BOOTSTRAP_CC="$(cygpath -w "$gcc_exe")"
          export REPRO_BOOTSTRAP_CC
          bash scripts/release/smoke_release_dev_exec.sh "$PKG_NAME"

      # The manifest install-release.sh verifies against: GNU sha256sum's
      # text form, `<digest>  <name>`, the digest read in binary mode, as
      # reprobuild's release legs write it.
      - name: Write SHA256SUMS
        shell: bash
        working-directory: .reprobuild-src
        run: |
          set -euo pipefail
          digest="$(sha256sum -b < "$ASSET")"
          digest="${digest%% *}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 digest for $ASSET: $digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pin-release"
          mv "$ASSET" "$RUNNER_TEMP/pin-release/"
          printf '%s  %s\n' "$digest" "$ASSET" > "$RUNNER_TEMP/pin-release/SHA256SUMS"
          cat "$RUNNER_TEMP/pin-release/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: reprobuild-pin-release-windows-x86_64
          path: ${{ runner.temp }}/pin-release/
          if-no-files-found: error
          retention-days: 7

  windows-pin-release-publish:
    needs: [windows-pin-release-plan, windows-pin-release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job in this workflow that writes, and it writes one release.
    permissions:
      contents: write
    # Two runs that both found the prerelease missing publish one after the
    # other; the second finds it complete and stops.
    concurrency:
      group: pins-windows-pin-release-${{ needs.windows-pin-release-plan.outputs.tag }}
      cancel-in-progress: false
    env:
      REV: ${{ needs.windows-pin-release-plan.outputs.rev }}
      VERSION: ${{ needs.windows-pin-release-plan.outputs.version }}
      KIND: ${{ needs.windows-pin-release-plan.outputs.kind }}
      TAG: ${{ needs.windows-pin-release-plan.outputs.tag }}
      ASSET: ${{ needs.windows-pin-release-plan.outputs.asset }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reprobuild-pin-release-windows-x86_64
          path: dist

      # The artifact round trip is verified, not assumed: exactly the two
      # files, and the archive matches the digest the build job wrote.
      - name: Re-verify the downloaded bundle
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          test "$(find . -type f -printf '%P\n' | sort)" = "$(printf '%s\n' "$ASSET" SHA256SUMS | sort)"
          test "$(wc -l < SHA256SUMS)" -eq 1
          grep -qE "^[0-9a-f]{64}  ${ASSET//./\\.}\$" SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish the pin prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          # Not every event payload is documented to carry the repository
          # object (schedule); never pass an empty target.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2> view.err)"; then
            if grep -qxF "$ASSET" <<< "$names" && grep -qxF SHA256SUMS <<< "$names"; then
              echo "$TAG is already complete; nothing to publish"
              exit 0
            fi
            echo "completing $TAG"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "dist/$ASSET" dist/SHA256SUMS
          elif grep -q 'release not found' view.err; then
            # The tag is created at the default branch's tip: a tag on a
            # commit whose workflow files differ from it may need the
            # `workflows` permission, which GITHUB_TOKEN never holds. The tag's
            # commit in THIS repository carries no meaning; the Reprobuild
            # commit is in the tag's name.
            notes="$(printf '%s\n' \
              "**Pin-scoped build, not a Reprobuild release.** A source build of metacraft-labs/reprobuild commit \`$REV\` (version $VERSION, pinned as \`$KIND\` in \`pins/reprobuild.json\`), packaged for Windows x86_64 with that commit's \`scripts/release/package_windows_release.ps1\` and checked with its release checks." \
              "" \
              "\`setup-reprobuild\` installs it on Windows when the job selects this commit, verifying \`$ASSET\` against \`SHA256SUMS\`, instead of compiling the commit from source. Built by $RUN_URL from ${GITHUB_REPOSITORY}@${GITHUB_SHA}." \
              "" \
              "Reprobuild's releases are published at https://github.com/metacraft-labs/reprobuild/releases.")"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$DEFAULT_BRANCH" \
              --title "Reprobuild pin $REV (Windows x86_64 build of a pinned commit, not a release)" \
              --notes "$notes" \
              "dist/$ASSET" dist/SHA256SUMS
          else
            cat view.err
            echo "::error::could not ask whether $TAG exists"
            exit 1
          fi
          echo "Published the Windows pin prerelease \`$TAG\` (\`$ASSET\`)." >> "$GITHUB_STEP_SUMMARY"

  codetracer-mac-lock:
    # The reusable workflow solves and checks CodeTracer's aarch64-darwin lock
    # at pins/codetracer.json's revision on a hosted arm64 macOS runner. It
    # runs only when `changes` says so: the CodeTracer files differ in the
    # pull request or in a push no pull request run proved, or a dispatch
    # asks for it; never on the schedule. Hosted macOS minutes are scarce,
    # and no other pin moves this lock. It waits for
    # `local`, so a pin the schema refuses never reaches a Mac. Called with no
    # inputs it solves the pinned revision and expects the solve to succeed;
    # its `outcome` output (`confirmed` or `produced` on success) is what
    # `pins-gate` reads. It mints its own contents:read tokens from the same
    # CI token provider app secrets as the jobs above.
    needs: [changes, local]
    if: ${{ needs.changes.outputs.codetracer == 'true' }}
    uses: ./.github/workflows/codetracer-mac-lock.yml
    secrets: inherit

  pins-gate:
    # THE REQUIRED CHECK. Always reports. A needed job must have succeeded; a
    # job that was not needed must have been skipped (or succeeded). Every job
    # in `needs` is judged, so a job added there and not to REQUIRED fails.
    name: pins-gate
    needs:
      [
        changes,
        local,
        resolver-windows,
        remote,
        reprobuild-package,
        setup-reprobuild,
        codetracer-mac-lock,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          changes = needs.get('changes', {}).get('outputs', {})
          flag = lambda name: changes.get(name) == 'true'
          # Job id -> whether this change needs it.
          REQUIRED = {
              'changes': True,
              'local': True,
              'resolver-windows': flag('reprobuild'),
              'remote': flag('pins'),
              'reprobuild-package': flag('reprobuild'),
              'setup-reprobuild': flag('reprobuild'),
              'codetracer-mac-lock': flag('codetracer'),
          }
          failed = False
          for job, state in sorted(needs.items()):
              result = state.get('result', 'missing')
              if job not in REQUIRED:
                  print(f'FAIL {job}: in needs but not in REQUIRED'); failed = True; continue
              ok = result == 'success' or (not REQUIRED[job] and result == 'skipped')
              print(f"{'ok  ' if ok else 'FAIL'} {job}: {result} (needed: {REQUIRED[job]})")
              failed = failed or not ok
          for job in ('changes', 'local'):
              if job not in needs:
                  print(f'FAIL {job}: missing from needs'); failed = True
          # A CodeTracer change needs the lock job, and the job must also say
          # that it solved: `confirmed` (the solve equals the committed lock)
          # or `produced` (it differs; the lock is the artifact). Any other
          # outcome fails even beside a `success` result: skipped,
          # unsolvable, solved-unexpectedly, failed-checks, invalid-pin,
          # unverified, failed, or none at all.
          if flag('codetracer'):
              if 'codetracer-mac-lock' not in needs:
                  print('FAIL codetracer-mac-lock: the CodeTracer files changed, but the job is not in needs')
                  failed = True
              else:
                  outcome = needs['codetracer-mac-lock'].get('outputs', {}).get('outcome', '')
                  solved = outcome in ('confirmed', 'produced')
                  print(f"{'ok  ' if solved else 'FAIL'} codetracer-mac-lock outcome: {outcome or '(none)'}")
                  failed = failed or not solved
          sys.exit(1 if failed else 0)
          PY
