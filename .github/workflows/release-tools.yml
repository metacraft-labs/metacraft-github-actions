name: Release tools

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: Exact metacraft-github-actions commit used by the caller
        required: true
        type: string
      nix-shell:
        description: Product flake development shell for release builds
        required: false
        default: default
        type: string

permissions:
  contents: read

concurrency:
  group: tool-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      expected: ${{ steps.plan.outputs.expected }}
      has-msi: ${{ steps.plan.outputs.has-msi }}
      unsigned-release: ${{ steps.plan.outputs.unsigned-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate CI token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ inputs.tooling-ref }}
          path: .release-tools
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - id: plan
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.release-tools/release-tools/release.cjs').githubPlan({github, context, core});

  build:
    needs: plan
    name: Build and verify (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: release-source
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE_TARGET: ${{ matrix.id }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-source
          persist-credentials: false
      - name: Generate CI token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ inputs.tooling-ref }}
          path: .release-tools
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Set tool paths
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('RELEASE_NODE', process.execPath);
            core.exportVariable('RELEASE_TOOLS', require('path').resolve('.release-tools/release-tools'));
      - name: Set up Nix
        if: runner.os != 'Windows'
        uses: ./.release-tools/setup-nix
        with:
          gh-token: ${{ steps.token.outputs.token }}
      - name: Set up Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../.release-tools/release-tools/setup-windows.ps1
      - name: Authenticate pinned Windows source dependencies
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SCOPED_GIT_AUTH_REWRITES: '1'
        run: |
          source "$RELEASE_TOOLS/../git-auth/scoped-git-auth.sh"
          scoped_git_auth_build
          scoped_git_auth_emit >> "$GITHUB_ENV"
      - name: Build, package and test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_NIX_SHELL: ${{ inputs.nix-shell }}
        run: nix develop ".#$RELEASE_NIX_SHELL" --command bash scripts/release/build.sh "$RELEASE_TARGET"
      - name: Build, package and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/build.ps1 -Target $env:RELEASE_TARGET
      - name: Verify Linux installation and portability
        if: runner.os == 'Linux'
        shell: bash
        run: bash "$RELEASE_TOOLS/verify-linux.sh"
      - name: Check exact target asset set
        shell: bash
        run: '"$RELEASE_NODE" "$RELEASE_TOOLS/release.cjs" seal dist "$RELEASE_TARGET"'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: release-source/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.id }}
          path: release-source/test-logs/
          if-no-files-found: warn
          retention-days: 14

  verify-msi:
    needs: [plan, build]
    if: needs.plan.outputs.has-msi == 'true'
    # The ephemeral ARM64 guest has working Windows Installer access. The
    # shared x64 service runners cannot execute ICE custom actions. Native
    # executable checks remain in each architecture's build job above.
    runs-on: [self-hosted, windows, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate CI token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ inputs.tooling-ref }}
          path: .release-tools
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-windows-*
          path: dist
          merge-multiple: true
      - name: Verify transferred Windows assets
        uses: actions/github-script@v7
        with:
          script: |
            const r = require('./.release-tools/release-tools/release.cjs');
            const expected = r.plan().matrix.filter(t => t.id.startsWith('windows-')).flatMap(t => t.assets);
            r.verifyDirectory('dist', expected);
            core.exportVariable('RELEASE_NODE', process.execPath);
      - name: Validate MSI databases and extracted payloads
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/release/verify-windows.ps1 -Dist dist -Version $env:RELEASE_VERSION
      - name: Installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-validation-logs
          path: test-logs/
          if-no-files-found: warn

  assemble:
    needs: [plan, build, verify-msi]
    if: >-
      always() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      (needs.verify-msi.result == 'success' ||
       (needs.plan.outputs.has-msi == 'false' && needs.verify-msi.result == 'skipped'))
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate CI token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ inputs.tooling-ref }}
          path: .release-tools
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all assets after transfer
        uses: actions/github-script@v7
        with:
          script: |
            const release = require('./.release-tools/release-tools/release.cjs');
            release.assemble('dist', release.plan().expected);
      - uses: sigstore/cosign-installer@v3
        if: needs.plan.outputs.unsigned-release != 'true'
      - name: Sign and verify the checksum manifest
        if: needs.plan.outputs.unsigned-release != 'true'
        shell: bash
        env:
          RELEASE_TOOLING_REF: ${{ inputs.tooling-ref }}
        run: bash .release-tools/release-tools/sign-manifest.sh sign
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate CI token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/metacraft-github-actions
          ref: ${{ inputs.tooling-ref }}
          path: .release-tools
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Verify binary signing policy
        if: needs.plan.outputs.unsigned-release != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = require('./.release-tools/release-tools/release.cjs').plan();
            for (const target of p.matrix.filter(t => !t.id.startsWith('linux-'))) {
              const evidence = JSON.parse(fs.readFileSync(`dist/${p.product}-${p.version}-${target.id}.json`));
              if (!evidence.binarySigningVerified) {
                throw new Error(`${target.id}: OS signing is unverified; publication needs configured signing or an approved exception recorded in the release policy`);
              }
            }
      - uses: sigstore/cosign-installer@v3
        if: needs.plan.outputs.unsigned-release != 'true'
      - name: Verify the transferred checksum signature
        if: needs.plan.outputs.unsigned-release != 'true'
        shell: bash
        env:
          RELEASE_TOOLING_REF: ${{ inputs.tooling-ref }}
        run: bash .release-tools/release-tools/sign-manifest.sh verify
      - name: Verify draft bytes and publish
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.release-tools/release-tools/release.cjs').publish({github, context, core});
      - name: Request publication into the shared package repositories
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'metacraft-labs', repo: 'metacraft-desktop-packages', event_type: 'publish-release',
              client_payload: {repository: `${context.repo.owner}/${context.repo.repo}`, tag: context.ref.slice(10)},
            });
            core.notice('Verify the matching shared package publisher run and both live indices before promoting stable.');
