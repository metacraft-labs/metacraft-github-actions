name: Observe recurring RunQuota Windows test timeouts

on:
  workflow_dispatch:
  push:
    branches: [fix/macos-worker-diagnostics]
    paths:
      - .github/workflows/diagnose-runquota-windows-runtime.yml
      - diagnostics/windows-process-phase.c
      - diagnostics/runquota-windows-runtime-phases.py
      - diagnostics/runquota-windows-runtime-phases.ps1

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-11-arm
    timeout-minutes: 110
    env:
      WINDOWS_DIY_ARCH_OVERRIDE: x64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          ref: 33add18739814c3886da1f69f8a4e18ab1e36faa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .diagnostic-tools
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@41d0680bd78ca59ad110a261a20bcaa93a38fffd
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          repro-runquota-pin: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          repro-io-mon-pin: 5e71adf033b860c0fdbe13dda4320cf4a580f632
          repro-stackable-hooks-pin: def2464b2d282c7c1a982689a25953e1d4501f93
          gh-token: ${{ steps.token.outputs.token }}
      - name: Observe fixed native and monitored test binaries
        timeout-minutes: 80
        shell: pwsh
        run: ./.diagnostic-tools/diagnostics/runquota-windows-runtime-phases.ps1
      - name: Preserve every test result and read-only observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runquota-windows-runtime-phases
          path: build/windows-runtime-phases/
          retention-days: 14
          if-no-files-found: error
