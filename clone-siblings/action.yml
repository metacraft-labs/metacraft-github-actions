# NO SECOND SIBLING-CLONING ACTION.
#
# There is exactly one mechanism for "what revision of sibling repo X does this
# commit pin?", and it is this action (reprobuild-specs/
# CI-Dev-Env-Actions-And-Workspace-Alignment.md §"Sibling-revision resolution").
# A per-project convenience action that clones siblings ITSELF is how that
# guarantee gets lost: it starts as a wrapper, acquires a hard-coded `ref:` for
# a repo the lock does not happen to cover, and from then on that project's CI
# builds a branch tip while every document says it builds a pinned revision.
#
# `codetracer/.github/actions/setup-db-backend-siblings` is the shape a
# per-project action should have: inputs, a `siblings:` list, and nothing else —
# all resolution delegated here.
# `codetracer/.github/actions/setup-isonim-siblings` is the shape it should not:
# nine `clone-repo` calls at a hard-coded `ref: dev`. Migrating it needs no new
# action; it needs those nine names in a `siblings:` list, and five of them
# declared in `codetracer`'s project manifest so the lock can pin them (today
# only nim-everywhere / nim-acp / nim-agent-harbor / nim-agents are members —
# isonim, isonim-tui, isonim-gpui, nim-pty and nim-termctl belong to the
# `isonim` project). This action now says exactly that when asked to resolve
# them, for all five at once; see the PASS 1 error in clone-siblings.sh.
#
# The first attempt at that migration is why `name=ref` is no longer silent. It
# pinned all nine to `=dev`, which would have cleared the error — and un-pinned
# the four the lock was pinning correctly, turning them into branch tips while
# CI went on passing. An entry that replaces a revision the lock DOES pin is now
# reported on every run, warned about, and refusable with `on-lock-override`.
#
# WHICH COMMIT'S LOCK, AND WHY MAINLINE DOES NOT LOCK ITSELF
#
# The step below probes the pushed commit (falling back to its parent for
# GitHub merge commits) or the pull request's base — both MAINLINE commits —
# and `--no-walk` requires the probed commit ITSELF to carry a lock.
#
# That is not a property mainline has on its own. The pre-push gate locks
# commits leaving a WORKSPACE; a PR-based repo's mainline commits are created
# server-side by GitHub when a pull request lands, where no hook runs. On
# `codetracer@dev` and `infra@live` not one first-parent commit in the last
# thirty carried a lock, and every job that reached that line died there.
#
# `publish-workspace-lock` (this repo) is what makes the premise true for a
# merged pull request whose HEAD was locked: it re-anchors that record onto the
# mainline commit. The alternative — relaxing `--no-walk` into an ancestry walk
# — was rejected twice over: it cannot rescue `infra`, which has no locked
# ancestor within reach, and it would answer a merge commit with pins that
# PREDATE the merge, which is exactly wrong for a pull request whose content is
# a sibling bump.
#
# It does NOT make the premise true for a pull request whose head was never
# locked, and that is still the majority: over the last 24 merged pull
# requests, 4 of codetracer's heads and 3 of infra's carried a record. That is
# a hook-COVERAGE gap upstream of both this action and that one — a branch
# pushed from a checkout without the managed hooks never reaches the pre-push
# gate — and it is reported by name there rather than papered over here.
#
# This prose lives HERE, and not in the `run:` body where it was first written,
# because a composite action's `run:` body is a template string GitHub refuses
# to parse past a length limit, and 1,419 characters of exactly this comment
# took the whole org's CI down on 2026-08-26. `.github/assert-composite-run-
# size.sh` is the guard that now measures it. A YAML comment out here costs the
# template nothing.
#
# THE BODY ITSELF is now ./clone-siblings.sh, which is the remedy that guard's
# header prescribes: it had 76 characters of headroom left, and a script file
# has no template limit at all. It is also shellchecked and executed directly by
# ./clone-siblings-step-test.sh. The step below must stay a one-line call to it;
# that suite fails if an inline `run: |` body reappears here.
name: Clone cross-repo siblings
description: >
  Clone the cross-repo sibling repositories a repo's CI needs, each at the
  revision pinned by the per-commit workspace lock for the commit under test.
  Both lock layouts are read, so projects on either workspace tool are served:
  reprobuild's locks/<project>/<repo>/<sha>.toml
  ("reprobuild.workspace.lock.v1") and repo-workspaces'
  locks/<project>/<repo>/<sha>.xml (a `repo manifest -r` snapshot). The set of
  siblings comes from the `siblings` input or, when empty, the calling repo's
  `.github/sibling-repos` file (one repo name per line). Each sibling is cloned
  adjacent to the host checkout (../<name>). A commit with no lock fails loudly;
  there is no silent fallback to a branch tip. A sibling the lock does not NAME
  fails just as loudly, but as what it is — a workspace-membership gap, i.e. a
  repo the project manifest does not declare — reported for every such sibling
  at once and before anything is cloned, not as a broken lock.

  An entry that REPLACES a revision the lock does pin (`name=ref` where the lock
  has an answer for `name`) is the other direction of the same loss, and it is
  no longer silent: every run prints a resolution table, an unacknowledged
  override raises a `::warning::` and a job-summary entry, and
  `on-lock-override: error` turns it into a failure. The lock is read for EVERY
  entry, including the explicit ones, so a list in which every entry carries a
  ref — the shape that used to skip the lock lookup entirely — is checked too.

  MANIFEST LAYERS. The locks are read from one or more manifest repos, layered
  by visibility per reprobuild-specs/Workspace-And-Develop-Mode.md §"Workspace
  Composition and Manifest Layers": `manifests-repo` is the public base layer
  and `private-manifests-repo` (optional) is an access-controlled org/team
  layer on top of it, which is REQUIRED once private repos participate in the
  workspace. Repos declared in both are deduplicated with the private layer
  taking precedence; a repo only the private layer declares resolves from it.
  Leaving `private-manifests-repo` empty is the single-layer behaviour every
  consumer has today.

  This is the single approved sibling-revision mechanism (it bundles
  resolve-sibling-rev.sh, which reads the workspace lock; its contract suite is
  resolve-sibling-rev-test.sh). See
  codetracer-specs/Testing/Cross-Repo-CI-Integration.md.

inputs:
  gh-token:
    description: >
      GitHub token (CI App token) used to clone private siblings and the private
      metacraft-manifests repo that holds the locks. Required for private repos.
    required: false
    default: ""
  siblings:
    description: >
      Optional whitespace/newline-separated list of sibling repo names to clone.
      Each entry is `name` (revision resolved from the workspace lock) or
      `name=ref` (clone `ref` directly — used for workflow_dispatch /
      repository_dispatch overrides; a trailing `=` falls back to the lock).
      When empty, `.github/sibling-repos` is read.

      PREFER THE BARE `name`. It means "whatever revision the workspace lock
      pins for the commit under test", which is the only spelling that stays
      reproducible with nothing to maintain: every future commit's lock carries
      the pin automatically. `name=ref` is for a repo the lock genuinely cannot
      answer for, and for a human-supplied dispatch override.

      An entry may also be spelled `name!=ref`. That is `name=ref` plus an
      acknowledgement that the ref REPLACES a revision the lock pins; see
      `on-lock-override`. The `!` is meaningful only immediately before the `=`.

      An override `ref` is shape-checked before anything is cloned: it must be
      `[0-9A-Za-z._/-]` only and must not begin with `-`, `.` or `/`. That is
      not style enforcement — the value is substituted into `git fetch <remote>
      <rev>`, git parses options after the remote, and `--upload-pack=<cmd>`
      runs `<cmd>` on the runner. An override that is not a 40-hex commit SHA
      is additionally reported as a `::warning::`: it pins nothing and resolves
      to wherever the ref points when the job runs.

      An entry may also be spelled `owner/name` (with or without `=ref`) to
      clone from a GitHub owner other than `sibling-owner`. The repo NAME is
      what the workspace lock is keyed by and what the clone is placed at
      (`../<name>`); the owner only selects the remote. Declaring the owner
      here is what makes it possible to compose a workspace out of repos from
      more than one org — reprobuild's manifest model already allows a
      `projectRemote` of `blocksense-network` — without the CI token having to
      be scoped to all of github.com.
    required: false
    default: ""
  sibling-owner:
    description: >
      The GitHub owner a bare sibling entry (`name`, not `owner/name`) is
      cloned from. Defaults to `metacraft-labs`, which is what this action used
      to hard-code.

      Accepts a whitespace-separated list, of which the FIRST entry is used;
      the rest are ignored here. That is not a courtesy — it is what lets
      `setup-dev-env` pass its single `token-owner` value to this input and to
      `token-owner` below, so the two physically cannot disagree. Direct
      callers that set them separately are covered by the check described under
      `token-owner`.
    required: false
    default: "metacraft-labs"
  token-owner:
    description: >
      Whitespace-separated GitHub owner(s) the job's CI token is scoped to —
      i.e. whatever will be passed to `setup-nix`'s input of the same name.

      This action does not merely trust it: it installs its OWN credential,
      scoped to exactly the owners it is about to clone from, so its clones
      cannot be broken by a mismatch. What it uses this input for is to FAIL
      LOUDLY when the two disagree, because the rest of the job — `nix develop`
      resolving a private flake input, a test script cloning a private repo —
      runs on `setup-nix`'s scope, not on this one, and an owner missing from
      that scope surfaces as a bare GitHub 404 on a private repository, which
      reads as a typo rather than as an auth failure.

      Set to the empty string to skip the check (for a job that runs no
      `setup-nix`).
    required: false
    default: "metacraft-labs"
  manifests-repo:
    description: >
      owner/name of the PUBLIC (base) manifest repo holding the workspace
      locks. This is the least-specific manifest layer.
    required: false
    default: "metacraft-labs/metacraft-manifests"
  manifests-ref:
    description: The branch of the manifest repo to read locks from.
    required: false
    default: ""
  private-manifests-repo:
    description: >
      Optional owner/name of an org/team-PRIVATE manifest repo layered on top
      of `manifests-repo`. Per
      reprobuild-specs/Workspace-And-Develop-Mode.md §"Workspace Composition
      and Manifest Layers", a private manifest repo is REQUIRED once private
      repos participate in a workspace: an access-controlled repo set cannot
      live in a layer everyone can read. Repos declared in both layers are
      deduplicated with the private layer taking precedence; repos only the
      private layer declares resolve from it alone.

      Empty (the default) is exactly the single-layer behaviour every consumer
      has today — nothing is cloned and nothing is consulted. `gh-token` must
      grant read access when this is set.
    required: false
    default: ""
  private-manifests-ref:
    description: >
      The branch of the private manifest repo. Defaults to `manifests-ref`.
    required: false
    default: ""
  on-lock-override:
    description: >
      What to do when a `name=ref` entry replaces a revision the workspace lock
      DOES pin for `name`:

        - "warn"  (default) — report it in the resolution table, raise a
                    `::warning::` naming both revisions, add a row to the job
                    summary, and continue.
        - "error" — fail the step.

      An entry spelled `name!=ref` is exempt either way: it says the override is
      deliberate. That acknowledgement is PER-ENTRY on purpose. A single
      action-level "allow overrides" switch would reproduce the mistake this
      check exists to catch — set once under pressure, it exempts every entry in
      the list, including the ones the lock was pinning perfectly well. An
      acknowledgement written on the entry it applies to cannot spread on its
      own, and it shows up in a diff next to the thing it excuses.

      WHY THE DEFAULT IS `warn`. Every consumer of this action pins `@main`, so
      a new hard failure lands on all of them at once with no way to prepare,
      and there are callers overriding lock pins today. Failing by default would
      be the fleet-wide outage this check exists to prevent. A repo that has
      acknowledged its overrides sets `error` here and can never regress; the
      default flips once the fleet is clean, at which point every deliberate
      override is already spelled `!=` and nothing breaks at the flip.
    required: false
    default: "warn"

runs:
  using: composite
  steps:
    - name: Clone cross-repo siblings from the workspace lock
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        SIBLINGS_INPUT: ${{ inputs.siblings }}
        SIBLING_OWNER: ${{ inputs.sibling-owner }}
        JOB_TOKEN_OWNERS: ${{ inputs.token-owner }}
        MANIFESTS_REPO: ${{ inputs.manifests-repo }}
        INPUT_MANIFESTS_REF: ${{ inputs.manifests-ref }}
        PRIVATE_MANIFESTS_REPO: ${{ inputs.private-manifests-repo }}
        INPUT_PRIVATE_MANIFESTS_REF: ${{ inputs.private-manifests-ref }}
        ON_LOCK_OVERRIDE: ${{ inputs.on-lock-override }}
        GIT_AUTH_DIR: ${{ github.action_path }}/../git-auth
        # The two context values the runner exposes no environment variable
        # for. Everything else the body needs — $GITHUB_ACTION_PATH,
        # $GITHUB_EVENT_NAME, $GITHUB_SHA, $GITHUB_REPOSITORY,
        # $GITHUB_WORKSPACE, $RUNNER_TEMP — is a builtin, so it reads them
        # directly rather than through a `${{ }}` expression.
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: bash "${GITHUB_ACTION_PATH}/clone-siblings.sh"
