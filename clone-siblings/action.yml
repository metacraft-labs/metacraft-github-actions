name: Clone cross-repo siblings
description: >
  Clone the cross-repo sibling repositories a repo's CI needs, each at the
  revision pinned by the per-commit workspace lock for the commit under test.
  Both lock layouts are read, so projects on either workspace tool are served:
  reprobuild's locks/<project>/<repo>/<sha>.toml
  ("reprobuild.workspace.lock.v1") and repo-workspaces'
  locks/<project>/<repo>/<sha>.xml (a `repo manifest -r` snapshot). The set of
  siblings comes from the `siblings` input or, when empty, the calling repo's
  `.github/sibling-repos` file (one repo name per line). Each sibling is cloned
  adjacent to the host checkout (../<name>). A commit with no lock fails loudly;
  there is no silent fallback to a branch tip.

  MANIFEST LAYERS. The locks are read from one or more manifest repos, layered
  by visibility per reprobuild-specs/Workspace-And-Develop-Mode.md §"Workspace
  Composition and Manifest Layers": `manifests-repo` is the public base layer
  and `private-manifests-repo` (optional) is an access-controlled org/team
  layer on top of it, which is REQUIRED once private repos participate in the
  workspace. Repos declared in both are deduplicated with the private layer
  taking precedence; a repo only the private layer declares resolves from it.
  Leaving `private-manifests-repo` empty is the single-layer behaviour every
  consumer has today.

  This is the single approved sibling-revision mechanism (it bundles
  resolve-sibling-rev.sh, which reads the workspace lock; its contract suite is
  resolve-sibling-rev-test.sh). See
  codetracer-specs/Testing/Cross-Repo-CI-Integration.md.

inputs:
  gh-token:
    description: >
      GitHub token (CI App token) used to clone private siblings and the private
      metacraft-manifests repo that holds the locks. Required for private repos.
    required: false
    default: ""
  siblings:
    description: >
      Optional whitespace/newline-separated list of sibling repo names to clone.
      Each entry is `name` (revision resolved from the workspace lock) or
      `name=ref` (clone `ref` directly — used for workflow_dispatch /
      repository_dispatch overrides; a trailing `=` falls back to the lock).
      When empty, `.github/sibling-repos` is read.
    required: false
    default: ""
  manifests-repo:
    description: >
      owner/name of the PUBLIC (base) manifest repo holding the workspace
      locks. This is the least-specific manifest layer.
    required: false
    default: "metacraft-labs/metacraft-manifests"
  manifests-ref:
    description: The branch of the manifest repo to read locks from.
    required: false
    default: ""
  private-manifests-repo:
    description: >
      Optional owner/name of an org/team-PRIVATE manifest repo layered on top
      of `manifests-repo`. Per
      reprobuild-specs/Workspace-And-Develop-Mode.md §"Workspace Composition
      and Manifest Layers", a private manifest repo is REQUIRED once private
      repos participate in a workspace: an access-controlled repo set cannot
      live in a layer everyone can read. Repos declared in both layers are
      deduplicated with the private layer taking precedence; repos only the
      private layer declares resolve from it alone.

      Empty (the default) is exactly the single-layer behaviour every consumer
      has today — nothing is cloned and nothing is consulted. `gh-token` must
      grant read access when this is set.
    required: false
    default: ""
  private-manifests-ref:
    description: >
      The branch of the private manifest repo. Defaults to `manifests-ref`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Clone cross-repo siblings from the workspace lock
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        SIBLINGS_INPUT: ${{ inputs.siblings }}
        MANIFESTS_REPO: ${{ inputs.manifests-repo }}
        INPUT_MANIFESTS_REF: ${{ inputs.manifests-ref }}
        PRIVATE_MANIFESTS_REPO: ${{ inputs.private-manifests-repo }}
        INPUT_PRIVATE_MANIFESTS_REF: ${{ inputs.private-manifests-ref }}
      run: |
        set -euo pipefail
        MANIFESTS_REF="${INPUT_MANIFESTS_REF:-${MANIFESTS_REF:-latest}}"
        PRIVATE_MANIFESTS_REF="${INPUT_PRIVATE_MANIFESTS_REF:-${MANIFESTS_REF}}"
        # The explicit `siblings` input (if provided) overrides the
        # repo-level `.github/sibling-repos` declaration; otherwise read the
        # file. Both accept '#' comments and whitespace/newline separation.
        # Each entry is either `name` (revision resolved from the workspace
        # lock) or `name=ref` (clone `ref` directly — used for
        # workflow_dispatch / repository_dispatch overrides; an empty ref,
        # i.e. a trailing `=`, falls back to the lock).
        # Parsing is pure bash (no awk/sed/cat): this step runs in the
        # consumer's dev-env shell, which may be a minimal nix bash with no
        # coreutils/gawk on PATH. Strip '#' comments per line and split the
        # remainder on whitespace, collecting every token (one repo per line
        # in the file; whitespace- or newline-separated in the input).
        if [ -n "${SIBLINGS_INPUT//[[:space:]]/}" ]; then
          RAW="${SIBLINGS_INPUT}"
        else
          SIBS_FILE="${GITHUB_WORKSPACE}/.github/sibling-repos"
          if [ ! -f "${SIBS_FILE}" ]; then
            echo "No 'siblings' input and no .github/sibling-repos; no cross-repo siblings to clone."
            exit 0
          fi
          RAW="$(<"${SIBS_FILE}")"
        fi
        SIBLINGS=()
        # On Windows, `actions/checkout@v4` respects git's
        # `core.autocrlf=true` default and converts LF-in-repo to
        # CRLF-in-worktree.  With `IFS= read -r`, that trailing `\r`
        # sticks to the last token on each line, and downstream
        # comparisons (`grep -E 'name="$SIBLING"'`, path lookups) then
        # miss because the CR is a literal part of the value.  Strip
        # any `\r` per line before tokenising.
        while IFS= read -r _line || [ -n "${_line}" ]; do
          _line="${_line%$'\r'}"
          _line="${_line%%#*}"
          for _tok in ${_line}; do
            # `_tok` inherits the CRLF too when the trailing CR was
            # before a `#` comment marker (rare); belt-and-braces trim.
            _tok="${_tok%$'\r'}"
            SIBLINGS+=("${_tok}")
          done
        done <<< "${RAW}"
        if [ "${#SIBLINGS[@]}" -eq 0 ]; then
          echo "No cross-repo siblings to clone."
          exit 0
        fi

        SELF="${GITHUB_REPOSITORY##*/}"
        RESOLVER="${{ github.action_path }}/resolve-sibling-rev.sh"

        # Split entries into names + optional explicit refs.
        NAMES=(); REFS=(); NEED_LOCK=0
        for entry in "${SIBLINGS[@]}"; do
          nm="${entry%%=*}"; rf=""
          case "${entry}" in *=*) rf="${entry#*=}" ;; esac
          NAMES+=("${nm}"); REFS+=("${rf}")
          [ -z "${rf}" ] && NEED_LOCK=1
        done

        # The manifest repo holds the per-commit workspace locks. Only clone
        # it when at least one sibling resolves from the lock.
        #
        # MANIFEST LAYERS. `LAYER_ARGS` accumulates one `--manifest-dir` per
        # layer, least specific FIRST — the order is the resolver's precedence
        # order (reprobuild-specs/Workspace-And-Develop-Mode.md §"Layering
        # Rules": a repo declared in several layers is deduplicated with the
        # more specific layer taking precedence). With no
        # `private-manifests-repo` this is a one-element list, i.e. byte-for-
        # byte the single-layer resolve every consumer already gets.
        MAN=""; LOCK_SHA=""
        LAYER_ARGS=()
        if [ "${NEED_LOCK}" -eq 1 ]; then
          MAN="${RUNNER_TEMP}/metacraft-manifests"
          rm -rf "${MAN}"
          if [ -n "${GH_TOKEN}" ]; then
            MAN_URL="https://x-access-token:${GH_TOKEN}@github.com/${MANIFESTS_REPO}.git"
          else
            MAN_URL="https://github.com/${MANIFESTS_REPO}.git"
          fi
          echo "Cloning manifests repo on branch '${MANIFESTS_REF}'..."
          if ! git clone --depth 1 --branch "${MANIFESTS_REF}" "${MAN_URL}" "${MAN}"; then
            echo "::error::Failed to clone manifests repo from ${MAN_URL} on branch ${MANIFESTS_REF}"
            exit 1
          fi
          LAYER_ARGS+=(--manifest-dir "${MAN}")

          # The org/team-private layer, when the caller declares one. It is
          # cloned with the SAME token — a private manifest repo is
          # access-controlled by definition, so a failure to clone it is a
          # hard error and never a silent downgrade to the public layer: that
          # would resolve private siblings to whatever the public layer
          # happens to say, or fail much later with a misleading diagnostic.
          if [ -n "${PRIVATE_MANIFESTS_REPO}" ]; then
            PRIV_MAN="${RUNNER_TEMP}/metacraft-manifests-private"
            rm -rf "${PRIV_MAN}"
            if [ -n "${GH_TOKEN}" ]; then
              PRIV_URL="https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_MANIFESTS_REPO}.git"
            else
              PRIV_URL="https://github.com/${PRIVATE_MANIFESTS_REPO}.git"
            fi
            echo "Cloning PRIVATE manifests repo on branch '${PRIVATE_MANIFESTS_REF}'..."
            if ! git clone --depth 1 --branch "${PRIVATE_MANIFESTS_REF}" "${PRIV_URL}" "${PRIV_MAN}"; then
              echo "::error::Failed to clone the private manifests repo ${PRIVATE_MANIFESTS_REPO} on branch ${PRIVATE_MANIFESTS_REF}. A private manifest layer was declared, so this is fatal: resolving siblings from the public layer alone would silently drop every pin the private layer owns. Check that the CI App token has read access to it."
              exit 1
            fi
            LAYER_ARGS+=(--manifest-dir "${PRIV_MAN}")
          fi
          # Which commit's lock to use: the pushed commit (falling back to its
          # parent for GitHub merge commits), or the PR base — all mainline
          # commits the pre-push hook locks.
          case "${{ github.event_name }}" in
            pull_request) CANDS="${{ github.event.pull_request.base.sha }}" ;;
            push) CANDS="${{ github.sha }} ${{ github.event.before }}" ;;
            *) CANDS="${{ github.sha }}" ;;
          esac
          PROBE=""
          for i in "${!NAMES[@]}"; do
            [ -z "${REFS[$i]}" ] && { PROBE="${NAMES[$i]}"; break; }
          done
          for c in ${CANDS}; do
            [ -z "${c}" ] && continue
            [ "${c}" = "0000000000000000000000000000000000000000" ] && continue
            probe_rc=0
            "${RESOLVER}" --repo "${SELF}" --sibling "${PROBE}" \
              "${LAYER_ARGS[@]}" --sha "${c}" --no-walk >/dev/null || probe_rc=$?
            if [ "${probe_rc}" -eq 0 ]; then
              LOCK_SHA="${c}"; break
            fi
            # Exit 3 is the resolver's only "this commit is not locked"
            # answer, and the only one worth trying the next candidate for.
            # Any other code means a lock EXISTS but cannot be trusted —
            # malformed, missing the probed sibling, or two locks for the
            # same commit disagreeing. Falling through to the next candidate
            # would bury that behind the generic "no lock" error below and
            # could pin siblings from a DIFFERENT commit, so stop here.
            if [ "${probe_rc}" -ne 3 ]; then
              echo "::error::Workspace lock for ${SELF}@${c} exists but cannot be used (resolve-sibling-rev exit ${probe_rc}); see its diagnostic above."
              exit 1
            fi
          done
          if [ -z "${LOCK_SHA}" ]; then
            LAYERS_DESC="${MANIFESTS_REPO}@${MANIFESTS_REF}"
            if [ -n "${PRIVATE_MANIFESTS_REPO}" ]; then
              LAYERS_DESC="${LAYERS_DESC} or ${PRIVATE_MANIFESTS_REPO}@${PRIVATE_MANIFESTS_REF}"
            fi
            echo "::error::No workspace lock for ${SELF} (candidates: ${CANDS}). Neither a repo-workspaces locks/<project>/${SELF}/<sha>.xml nor a reprobuild locks/<project>/${SELF}/<sha>.toml exists in ${LAYERS_DESC}. The commit must be published through the workspace tooling ('repro workspace lock' / the reprobuild pre-push hook, or legacy 'workspace lock'), and its lock pushed to the manifest repo."
            exit 1
          fi
          echo "Resolved workspace-lock commit for ${SELF}: ${LOCK_SHA}"
        fi

        SIBLING_PATHS=""
        for i in "${!NAMES[@]}"; do
          name="${NAMES[$i]}"; ref="${REFS[$i]}"
          if [ -n "${ref}" ]; then
            rev="${ref}"; src="override"
          else
            rev="$("${RESOLVER}" --repo "${SELF}" --sibling "${name}" \
              "${LAYER_ARGS[@]}" --sha "${LOCK_SHA}" --no-walk)"; src="lock"
          fi
          WORKSPACE_NORM="${GITHUB_WORKSPACE//\\//}"
          dest="${WORKSPACE_NORM}/../${name}"
          echo "  ${name} -> ${rev} (${src})"
          if [ -n "${GH_TOKEN}" ]; then
            url="https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/${name}.git"
          else
            url="https://github.com/metacraft-labs/${name}.git"
          fi
          rm -rf "${dest}"
          git clone --no-checkout "${url}" "${dest}" >/dev/null 2>&1
          git -C "${dest}" fetch --depth 1 origin "${rev}" >/dev/null 2>&1
          git -C "${dest}" checkout --detach FETCH_HEAD >/dev/null 2>&1
          # Submodules, authenticated with the token so PRIVATE submodules (e.g.
          # codetracer's tree-sitter-nim) clone instead of failing on auth.
          # Mirrors clone-repo's approach: a `url.insteadOf` rewrite covers
          # submodules fetched fresh during the recursive update, and an explicit
          # per-URL rewrite covers any URL already written into .git/config by
          # `submodule init` (insteadOf does not retroactively apply to those).
          # Pure git + bash builtins — this step runs in the dev-env shell, which
          # may lack awk/sed/grep.
          if [ -n "${GH_TOKEN}" ]; then
            tok="https://x-access-token:${GH_TOKEN}@github.com/"
            git -C "${dest}" config --add url."${tok}".insteadOf "https://github.com/" || true
            git -C "${dest}" config --add url."${tok}".insteadOf "git@github.com:" || true
            git -C "${dest}" config --add url."${tok}".insteadOf "ssh://git@github.com/" || true
            git -C "${dest}" submodule init >/dev/null 2>&1 || true
            # `git config --get-regexp` exits 1 when a sibling has NO submodules;
            # `|| true` keeps that from aborting the step under `set -o pipefail`.
            { git -C "${dest}" config --get-regexp '^submodule\..*\.url$' 2>/dev/null || true; } \
            | while read -r _key _old; do
                case "${_old}" in
                  https://github.com/*) _new="${tok}${_old#https://github.com/}" ;;
                  git@github.com:*) _new="${tok}${_old#git@github.com:}" ;;
                  ssh://git@github.com/*) _new="${tok}${_old#ssh://git@github.com/}" ;;
                  *) continue ;;
                esac
                git -C "${dest}" config "${_key}" "${_new}" || true
              done
          fi
          git -C "${dest}" submodule update --init --recursive >/dev/null 2>&1 || true
          SIBLING_PATHS="${SIBLING_PATHS} ${name}=$(cd "${dest}" && pwd)"
        done
        # Expose the clone locations for later steps (e.g. flake overrides).
        echo "CT_SIBLING_PATHS=${SIBLING_PATHS# }" >> "${GITHUB_ENV}"
        echo "Cloned ${#NAMES[@]} sibling(s) adjacent to the host checkout."
