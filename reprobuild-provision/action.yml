name: Reprobuild dependency provisioning
description: >
  Provision the sibling repositories the `repro` CLI build depends on, cloning
  them adjacent to the host checkout (under $GITHUB_WORKSPACE) so the reprobuild
  flake inputs / env.ps1 source-only Nim deps resolve to local paths.

  This is the "dependency provisioning" half of the reprobuild dev-env flavor;
  the companion `setup-reprobuild` action clones the reprobuild source and builds
  the CLI.

  WHY THIS ACTION LIVES HERE AND NOT IN `reprobuild`. It used to, and because
  GitHub materialises a composite action by downloading its whole repository —
  during `Set up job`, before any `if:` is evaluated — every consumer paid for
  a 546 MB archive against the runner's fixed 100-second per-action timeout,
  including the many jobs that can never run either step. This action reads
  nothing from the reprobuild worktree; it only clones siblings into
  $GITHUB_WORKSPACE. See the block above the two `uses:` in
  `setup-dev-env/action.yml`.

  Scope (post-L2, CI-PROVISION-FROM-LOCK): the pins that remain here are
  REPROBUILD's OWN build-input siblings — the flake inputs its `repro` CLI build
  depends on (codetracer-native-recorder, runquota) and the Windows env.ps1
  source-only deps. Reprobuild itself is not yet integrated into the
  solved-graph lock contract, so these can't be lock-resolved and stay pinned
  to their mainline branch. A CONSUMER project's from-source dependency siblings
  (e.g. codetracer's isonim + nim-* libs) are NO LONGER hard-coded here: the
  workflow provisions those from the project's committed `repro.lock` via
  `repro develop --all` (run in the project root), which clones/adopts each
  locked dep in develop mode. When reprobuild joins the lock contract, these
  remaining pins move to reprobuild's own lock too.

  HOW THE CREDENTIAL REACHES THESE CLONES, AND WHY IT USED NOT TO. Every clone
  below goes through `../git-auth/authenticated-clone.sh`: a credential-free URL
  plus an owner-scoped `http.<url>.extraHeader`. The previous shape put the
  token in the URL, which git only sends AFTER a 401 -- so the PUBLIC siblings
  in these lists (`runquota`, `io-mon`, `nim-stackable-hooks`, `codetracer`)
  were cloned entirely anonymously, and died on GitHub's per-IP unauthenticated
  download limit that the whole ephemeral-runner fleet shares. The long-form
  account is at the top of `provision-reprobuild-siblings.sh`.

  ONE CLONE HERE IS STILL ANONYMOUS AND CANNOT BE FIXED FROM THIS REPO:
  `status-im/nim-bearssl`, on the Windows path. The CI credential is a GitHub
  App installation token for `metacraft-labs`; authenticating a `status-im`
  URL would need either an installation of that app in the `status-im` org
  (which is not ours to create) or a separate credential passed in as a new
  input. Until one exists, that single clone keeps the old exposure, and says
  so in the log rather than pretending otherwise.

inputs:
  gh-token:
    description: GitHub token (CI App token) for cloning private metacraft-labs repos.
    required: false
    default: ""
  sibling-owner:
    description: >
      The GitHub owner these siblings are cloned from, and the owner the CI
      credential is scoped to. One knob for both, for the reason
      `clone-siblings` gives under its input of the same name: when the two can
      disagree, a mismatch surfaces as a bare 404 on a private repo and reads
      as a typo rather than as an auth failure.
    required: false
    default: "metacraft-labs"

runs:
  using: composite
  steps:
    # ONE step, not two. The Linux/macOS and Windows lists used to be separate
    # steps discriminated by `if: runner.os`, which meant two copies of the
    # clone logic and -- as it turned out -- two copies of the credential
    # defect, fixed in neither. The script branches on $RUNNER_OS internally,
    # so there is one place where a clone is spelled.
    - name: Provision reprobuild dependency siblings
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        SIBLING_OWNER: ${{ inputs.sibling-owner }}
        GIT_AUTH_DIR: ${{ github.action_path }}/../git-auth
      run: bash "${GITHUB_ACTION_PATH}/provision-reprobuild-siblings.sh"
