name: Setup Dev Environment
description: >
  Materialise the repository's already-declared deterministic dev
  environment on a CI runner. After this action, subsequent
  steps invoke `dev-exec <cmd>` to run any command inside the
  same env a developer uses locally (`nix develop -c <cmd>`, the
  Windows `. .\env.ps1; <cmd>` equivalent, or `repro exec --
  <cmd>` once reprobuild is available).

  This is a thin orchestrator over composable sub-actions:
    - cross-repo siblings come from one of two mechanisms, chosen by
      `sibling-strategy` (default `auto`) and reported on one line every run:
      `clone-siblings` (the workspace-PROJECT lock in `metacraft-manifests`,
      via `metacraft-labs/metacraft-github-actions/clone-siblings`, reading the
      repo's `.github/sibling-repos` or the `siblings` input; both lock layouts
      are served — reprobuild `<sha>.toml` and legacy repo-workspaces
      `<sha>.xml`), or `repro-lock` (the consuming repo's own committed
      `repro.lock`, via `repro develop --all`);
    - the `nix` flavor uses `metacraft-labs/metacraft-github-actions/setup-nix`;
    - the `windows-diy` flavor sources the repo's `env.ps1`;
    - the `reprobuild` flavor uses
      `metacraft-labs/metacraft-github-actions/reprobuild-provision` (clone the
      dependency siblings) + `.../setup-reprobuild` (build the `repro` CLI).
      Both moved OUT of `metacraft-labs/reprobuild` and into this repo; the
      `uses:` lines below say so, and the note above them says why.
  This action then installs the unified `dev-exec` wrapper for the chosen flavor,
  so calling workflows carry no checkout/resolve/clone/toolchain-install steps.

  This action is the CI-side replay of the contract documented in
  https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-shared-dev-env.md

inputs:
  env-flavor:
    description: >
      Which env flavor to materialise:
        - "nix"          → install Nix, ensure `nix develop`
                            resolves; `dev-exec` becomes
                            `nix develop --command <cmd>`.
        - "windows-diy"  → source `env.ps1` at the repo root and
                            persist the resulting environment to
                            `$GITHUB_ENV`; `dev-exec` becomes a
                            passthrough since the env is already
                            in-process for subsequent steps.
        - "reprobuild"   → install the `repro` CLI, run
                            `repro build` to materialise the
                            cached env; `dev-exec` becomes
                            `repro exec -- <cmd>`.
    required: true
  sibling-strategy:
    description: >
      WHICH mechanism provisions this repo's cross-repo siblings. There are
      two, they answer different questions, and until this input existed a
      caller picked between them by hand:

        - "clone-siblings" — resolve each sibling from the WORKSPACE-PROJECT
              lock in `metacraft-manifests`. Those project manifests describe a
              repo SET convenient for a human setting up a workspace: typically
              a superset of what any one build needs, and not that build's
              source of truth.
        - "repro-lock"     — resolve each sibling from the consuming repo's own
              committed `repro.lock` (the solved dependency graph of the build
              itself, pinned to exact commit SHAs) via `repro develop --all`.
              This is the consumer path `reprobuild-provision` already
              documents; see the note on `env-flavor: reprobuild` below.
        - "auto" (default) — decide, and say which and why.

      `auto` picks `repro-lock` only when ALL of: a `repro.lock` at the
      workspace root declares a solved-graph-lock schema; it pins at least one
      SIBLING dependency (a dep whose `path` is not "."); `env-flavor` is
      `reprobuild` (the one flavor where the `repro` CLI is installed anyway);
      and the repo declares NO sibling list of its own. Otherwise it picks
      `clone-siblings` and names the check that failed. It is conservative on
      purpose: this action is consumed at `@main` fleet-wide, so a caller that
      passes nothing today keeps behaving exactly as it does today.

      A FORCED VALUE NEVER SILENTLY DOES NOTHING. `repro-lock` on a repo with
      no usable committed lock FAILS, naming what is missing, rather than
      quietly resolving from the manifests the caller was trying to stop using.
      Forcing it also installs the `repro` CLI under any flavor, which `auto`
      will not do on its own.

      The decision — value, path taken, and reason — is printed on one line and
      added to the job summary on EVERY run, including the default one. The
      incident this input was written after was an invisible resolution; a
      second invisible decision would be the same bug.
    required: false
    default: "auto"
  siblings:
    description: >
      Optional whitespace/newline-separated list of cross-repo
      sibling repo names to clone (at workspace-lock-pinned
      revisions) instead of reading `.github/sibling-repos`. Use
      this when a particular job needs only a subset of the repo's
      declared siblings (e.g. a fast `ci` job that does not need
      the full `codetracer` checkout that the cross-repo test job
      pulls). When empty, `.github/sibling-repos` is read.

      UNDER `sibling-strategy` THIS IS NEVER SILENTLY IGNORED, on either path:

        - `auto` treats a non-empty list (here or in
          `.github/sibling-repos`) as a hand-declared set and keeps
          `clone-siblings`, even when a usable `repro.lock` exists, saying so.
          Such lists routinely name build-time siblings that are NOT
          solved-graph dependencies — `reprobuild`'s own list names two —
          and switching them to the lock would drop those siblings.
        - forced `repro-lock` makes the lock authoritative and reconciles this
          list against it: an entry the lock already pins is reported as
          redundant, by name and locked revision, and dropped (any `=ref` it
          carried with it); an entry the lock does not name is reported as
          outside the lock and cloned ADDITIONALLY by a follow-on
          `clone-siblings` step.
    required: false
    default: ""
  gh-token:
    description: >
      GitHub token used to authenticate Nix flake input fetches
      and private repository access. Required
      for `env-flavor: nix` because nix inputs reach private
      Metacraft Labs repos.
    required: false
    default: ""
  token-owner:
    description: >
      Whitespace-separated GitHub owner(s) whose repositories `gh-token` is
      allowed to authenticate. Defaults to `metacraft-labs`.

      THIS IS ONE KNOB ON PURPOSE. It feeds `setup-nix`'s `token-owner` (which
      scopes the job-wide Git CLI credential) AND `clone-siblings`'
      `sibling-owner` (which selects the remote sibling repos are cloned from)
      AND `clone-siblings`' own `token-owner` cross-check. Those three used to
      be a hard-coded `metacraft-labs` in `clone-siblings` and a defaulted
      `metacraft-labs` in `setup-nix`, tied together by nothing but the fact
      that the credential authenticated all of github.com so a mismatch could
      not be noticed. It can be noticed now — as a 404 on a private repo — so
      they are no longer separately settable through this action.

      A workspace that spans orgs sets this to the list (e.g.
      `"metacraft-labs blocksense-network"`) and names the non-default owners
      explicitly in `siblings` entries, as `owner/name`.
    required: false
    default: "metacraft-labs"
  substituters:
    description: >
      Space-separated Nix substituter URLs to trust in addition
      to cache.nixos.org (for example Attic cache URLs).
    required: false
    default: ""
  trusted-public-keys:
    description: >
      Space-separated signing public keys for the extra Nix
      substituters.
    required: false
    default: ""
  attic-token:
    description: >
      Attic token used to upload newly built Nix store paths.
      When empty, setup-dev-env only configures substituter trust.
    required: false
    default: ""
  attic-cache:
    description: Attic cache name to upload newly built Nix store paths to.
    required: false
    default: ""
  attic-endpoint:
    description: Attic server endpoint.
    required: false
    default: "https://cache.metacraft-labs.com/"
  flake-override-inputs:
    description: >
      Newline-separated `INPUT_NAME=PATH` entries. Each is
      translated to `--override-input INPUT_NAME path:PATH` and
      prepended to every `nix develop` invocation made by
      `dev-exec`. Use this for sibling-repo overrides cloned
      adjacent to the host repo (e.g.
      `codetracer-trace-format=../codetracer-trace-format`).
    required: false
    default: ""
  env-ps1-path:
    description: >
      Path to the Windows DIY env script (windows-diy flavor
      only). Defaults to `./env.ps1` at the calling workflow's
      working directory.
    required: false
    default: "./env.ps1"
  repro-build-pin:
    description: >
      Git ref (branch, tag, or SHA) of `metacraft-labs/reprobuild`
      to build the `repro` CLI from (reprobuild flavor only).
      Defaults to `dev`, the branch reprobuild's own CI gates on.
      Set to a SHA for fully reproducible runs.
    required: false
    default: "dev"
  repro-publish-key:
    description: >
      ECDSA-P256 signing private key (PEM) for publishing `repro build`
      action outputs to the reprobuild binary cache (reprobuild flavor
      only). When empty, publishing stays disabled and the build is
      substitute-only. Pass from a per-repo secret (org-wide secrets are
      not readable in private repos).
    required: false
    default: ""
  repro-publish-cert:
    description: >
      The publisher certificate (PEM) paired with `repro-publish-key`.
      When either this or the key is empty, publishing stays disabled.
    required: false
    default: ""
  nix-attr:
    description: >
      Optional flake attribute selector for the nix flavor. When
      unset, `dev-exec` calls `nix develop --command <cmd>` and
      gets the default devShell. When set to e.g. `ci`, the
      wrapper calls `nix develop .#ci --command <cmd>` and gets
      the named devShell. Use this to opt into a slim CI shell
      (`devShells.ci`) instead of the full developer shell when
      the latter pulls in dev-only tooling (AI agents, LSPs,
      AppImage tooling, etc.) that bloats the CI build closure.
    required: false
    default: ""
  nix-develop-args:
    description: >
      Extra arguments passed verbatim to every `nix develop`
      invocation made by `dev-exec` (nix flavor), inserted before
      `--command`. Use for flags the repo's dev env genuinely
      needs, e.g. `--impure` for a build that reads ambient state.
      Keep this empty unless the local `nix develop` contract
      requires it.
    required: false
    default: ""
  manifests-ref:
    description: >
      Optional branch/ref of the manifest repository to fetch workspace locks from.
      If not provided, falls back to MANIFESTS_REF environment variable, then to 'latest'.
    required: false
    default: ""
  private-manifests-repo:
    description: >
      Optional owner/name of an org/team-PRIVATE manifest repo layered on top
      of the public one when resolving sibling revisions. Required once
      private repos participate in the workspace (an access-controlled repo
      set cannot live in a layer everyone can read). Passed straight through
      to `clone-siblings`; empty is the single-layer default. `gh-token` must
      grant read access when set.
    required: false
    default: ""
  private-manifests-ref:
    description: >
      Optional branch/ref of the private manifest repository. Defaults to
      `manifests-ref`.
    required: false
    default: ""
  shared-store-path:
    description: >
      Path at which a SHARED, persistent reprobuild content-addressed store is
      expected to be mounted on this runner. Default `/srv/repro-store`, which
      is where the self-hosted Linux runners bind-mount theirs.

      When a writable store is found there, this action exports
      `REPRO_STORE_ROOT` pointing at it, so build outputs realised by one job
      are still there for the next. Reprobuild's default is a per-user cache
      directory, which inside a one-job-then-destroyed container is thrown away
      with the container — a shared store nothing points at stays empty.

      The probe is what makes this safe to run everywhere: on GitHub-hosted
      runners, on macOS and on Windows there is no such mount, nothing is
      exported, and the job behaves exactly as it does today. Set this to the
      empty string to switch the probe off entirely. A `REPRO_STORE_ROOT` the
      caller set itself is never overwritten.
    required: false
    default: "/srv/repro-store"
  on-lock-override:
    description: >
      Passed straight through to `clone-siblings`. `warn` (the default) reports
      a `siblings` entry whose `=ref` replaces a revision the workspace lock
      DOES pin; `error` fails the job instead. Set this to `error` once every
      deliberate override in the repo's sibling list is spelled `name!=ref`, so
      an accidental one cannot be added later without CI saying so.
    required: false
    default: "warn"

runs:
  using: "composite"
  steps:
    - name: Validate env-flavor
      shell: bash
      run: |
        case "${{ inputs.env-flavor }}" in
          nix|windows-diy|reprobuild) ;;
          *)
            echo "::error::env-flavor must be one of: nix, windows-diy, reprobuild (got '${{ inputs.env-flavor }}')" >&2
            exit 1
            ;;
        esac

    # ------------------------------------------------------------------
    # Which reprobuild store this job builds into (all flavors)
    #
    # Self-hosted Linux runners mount a SHARED, persistent reprobuild CAS into
    # every per-job container. Reprobuild uses it only when `REPRO_STORE_ROOT`
    # says so; with the variable unset it falls back to a per-user cache
    # directory, which in a one-job-then-destroyed container is discarded with
    # the container. Nothing in CI was setting it, so the mount was provisioned
    # and never written to — every job rebuilt from scratch into a store that
    # was thrown away, and the shared store stayed empty.
    #
    # WHY THIS STEP IS HERE AND NOT IN `setup-reprobuild`. This is the uniform
    # entry point: one decision covers every repo and every flavor. And the
    # discriminator is the MOUNT, not the flavor — a `nix` job whose devShell
    # ships `repro` uses the same store, and `$REPRO_STORE_ROOT` is also the
    # compat root of the action cache. A flavor gate would have excluded those
    # for nothing, while the mount test already excludes every runner that has
    # no shared store.
    #
    # WHY IT IS FIRST. `$GITHUB_ENV` reaches SUBSEQUENT steps only, and steps
    # below already invoke `repro` (`repro develop --all` on the repro-lock
    # path). A decision taken at the end would arrive after its first consumer.
    #
    # It never fails the job: an absent or unwritable mount leaves reprobuild on
    # its per-user default, which is what every runner without a shared store
    # uses successfully. What it always does is SAY which store was chosen — the
    # gap above went unnoticed for as long as it did because nothing printed a
    # store root. The rationale for each rule, and for probing writability with
    # a real write rather than trusting `-w` on a world-writable mount, lives in
    # decide-store-root.sh's header.
    # ------------------------------------------------------------------

    - name: Decide which reprobuild store this job builds into
      id: store-root
      shell: bash
      env:
        SHARED_STORE_PATH: ${{ inputs.shared-store-path }}
      run: bash "${GITHUB_ACTION_PATH}/decide-store-root.sh"

    # ------------------------------------------------------------------
    # Cross-repo siblings (all flavors): WHICH mechanism, decided and said
    #
    # Two mechanisms exist and they answer different questions —
    # `clone-siblings` reads the workspace-PROJECT lock (a repo set convenient
    # for a human setting up a workspace, typically a superset of any one
    # build's needs), `repro develop` reads the consuming repo's own committed
    # `repro.lock` (the solved dependency graph of the build itself). Callers
    # used to pick by hand, and a caller that picked wrong hand-wrote nine
    # siblings through `clone-siblings` of which four were a DEPENDENCY's
    # siblings that nothing could ever pin, failing every job on every pull
    # request; the first fix for that silently un-pinned the four the lock had
    # been pinning correctly.
    #
    # So the choice is made here, from evidence, and REPORTED — one line to the
    # log and one to the job summary, on every run and every path. The whole
    # incident was an invisible resolution; a second invisible decision would
    # be the same bug.
    #
    # The rationale for each rule lives in decide-sibling-strategy.sh's header
    # (a YAML comment out here costs the step template nothing; see
    # .github/assert-composite-run-size.sh for why that matters).
    # ------------------------------------------------------------------

    - name: Decide the sibling-provisioning strategy
      id: sibling-strategy
      shell: bash
      env:
        SIBLING_STRATEGY: ${{ inputs.sibling-strategy }}
        ENV_FLAVOR: ${{ inputs.env-flavor }}
        SIBLINGS_INPUT: ${{ inputs.siblings }}
      run: bash "${GITHUB_ACTION_PATH}/decide-sibling-strategy.sh"

    # ------------------------------------------------------------------
    # Cross-repo siblings (all flavors)
    #
    # The repo declares which sibling repos its build/tests need in
    # `.github/sibling-repos` (one repo name per line; '#' comments and
    # blank lines ignored). This step clones each sibling adjacent to the
    # host checkout (`../<name>`) at the revision pinned by the per-commit
    # workspace lock — reprobuild's `<sha>.toml` or repo-workspaces'
    # `<sha>.xml`, both accepted — the single approved
    # source of sibling revisions (see
    # codetracer-specs/Testing/Cross-Repo-CI-Integration.md). The lock is
    # read with the bundled `resolve-sibling-rev.sh`; a missing lock fails
    # loudly rather than silently using a branch tip. Callers no longer
    # write their own checkout/resolve/clone steps.
    # ------------------------------------------------------------------

    - name: Clone cross-repo siblings from the workspace lock
      # Skipped only when the step above chose the repro path, which resolves
      # the same siblings from the repo's own committed lock instead. Every
      # other caller reaches this step exactly as it did before this input
      # existed.
      if: ${{ steps.sibling-strategy.outputs.strategy != 'repro-lock' }}
      uses: metacraft-labs/metacraft-github-actions/clone-siblings@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        siblings: ${{ inputs.siblings }}
        # ONE value reaching both inputs. `sibling-owner` selects the remote
        # bare sibling names are cloned from and `token-owner` is what
        # `clone-siblings` cross-checks its clone set against; feeding both from
        # `inputs.token-owner` is what makes the coupling with the `setup-nix`
        # step below un-breakable through this action rather than merely
        # documented.
        sibling-owner: ${{ inputs.token-owner }}
        token-owner: ${{ inputs.token-owner }}
        manifests-ref: ${{ inputs.manifests-ref }}
        private-manifests-repo: ${{ inputs.private-manifests-repo }}
        private-manifests-ref: ${{ inputs.private-manifests-ref }}
        on-lock-override: ${{ inputs.on-lock-override }}

    # ------------------------------------------------------------------
    # env-flavor: nix
    # ------------------------------------------------------------------

    - name: Setup Nix
      if: ${{ inputs.env-flavor == 'nix' }}
      uses: metacraft-labs/metacraft-github-actions/setup-nix@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        token-owner: ${{ inputs.token-owner }}
        substituters: ${{ inputs.substituters }}
        trusted-public-keys: ${{ inputs.trusted-public-keys }}
        attic-token: ${{ inputs.attic-token }}
        attic-cache: ${{ inputs.attic-cache }}
        attic-endpoint: ${{ inputs.attic-endpoint }}

    - name: Install dev-exec wrapper (nix)
      if: ${{ inputs.env-flavor == 'nix' }}
      shell: bash
      env:
        FLAKE_OVERRIDE_INPUTS: ${{ inputs.flake-override-inputs }}
        NIX_ATTR: ${{ inputs.nix-attr }}
        NIX_DEVELOP_ARGS: ${{ inputs.nix-develop-args }}
      run: |
        set -euo pipefail

        # Translate flake-override-inputs into nix CLI flags.
        OVERRIDE_FLAGS=""
        if [ -n "$FLAKE_OVERRIDE_INPUTS" ]; then
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            name="${entry%%=*}"
            path="${entry#*=}"
            OVERRIDE_FLAGS="$OVERRIDE_FLAGS --override-input $name path:$path"
          done <<< "$FLAKE_OVERRIDE_INPUTS"
        fi

        # When nix-attr is set, materialise the named devShell instead
        # of the default. `nix develop .#<attr>` reads the attribute
        # from devShells.<system>.<attr>.
        ATTR_FLAG=""
        if [ -n "$NIX_ATTR" ]; then
          ATTR_FLAG=" .#$NIX_ATTR"
        fi

        # Extra `nix develop` args (e.g. --impure) the repo's dev env
        # contract requires, inserted before --command.
        EXTRA_FLAGS=""
        if [ -n "${NIX_DEVELOP_ARGS//[[:space:]]/}" ]; then
          EXTRA_FLAGS=" $NIX_DEVELOP_ARGS"
        fi

        mkdir -p "$HOME/.local/bin"
        cat > "$HOME/.local/bin/dev-exec" <<EOF
        #!/usr/bin/env bash
        # dev-exec (nix flavor): re-play the local dev env's
        # invocation contract.  This is the CI-side equivalent of
        # 'nix develop --command <cmd>' that a developer runs
        # locally.  Override flags below come from the
        # 'flake-override-inputs' input of setup-dev-env. The
        # attribute selector (if any) comes from 'nix-attr', and
        # any extra nix-develop args from 'nix-develop-args'.
        set -euo pipefail
        exec nix develop$OVERRIDE_FLAGS$ATTR_FLAG$EXTRA_FLAGS --command "\$@"
        EOF
        chmod +x "$HOME/.local/bin/dev-exec"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        echo "::group::dev-exec wrapper (nix)"
        cat "$HOME/.local/bin/dev-exec"
        echo "::endgroup::"

    # ------------------------------------------------------------------
    # env-flavor: windows-diy
    # ------------------------------------------------------------------

    - name: Source env.ps1 + persist env (windows-diy)
      if: ${{ inputs.env-flavor == 'windows-diy' }}
      shell: pwsh
      env:
        ENV_PS1_PATH: ${{ inputs.env-ps1-path }}
      run: |
        # Source the project's env.ps1 in a fresh PowerShell so we
        # can capture the env-var delta and persist it to
        # GITHUB_ENV / GITHUB_PATH for subsequent steps.  This is
        # the Windows analog of `nix develop`: the env script is
        # the deterministic env declaration the developer uses
        # locally.
        if (-not (Test-Path $env:ENV_PS1_PATH)) {
          Write-Host "::error::env.ps1 not found at $env:ENV_PS1_PATH"
          exit 1
        }

        # Snapshot env BEFORE sourcing.
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }

        # Source the env script in this shell.
        . $env:ENV_PS1_PATH

        # Diff env vars; persist new + changed entries to GITHUB_ENV.
        Get-ChildItem env: | ForEach-Object {
          $name  = $_.Name
          $value = $_.Value
          if ((-not $before.ContainsKey($name)) -or ($before[$name] -ne $value)) {
            # PATH gets special handling: append to GITHUB_PATH
            # entry-by-entry so the actions runner aggregates
            # correctly across steps.
            if ($name -eq "PATH" -or $name -eq "Path") {
              $beforePath = if ($before.ContainsKey($name)) { $before[$name] } else { "" }
              $oldEntries = $beforePath.Split([IO.Path]::PathSeparator)
              $newEntries = $value.Split([IO.Path]::PathSeparator)
              foreach ($e in $newEntries) {
                if ($e -and ($oldEntries -notcontains $e)) {
                  Add-Content -Path $env:GITHUB_PATH -Value $e
                }
              }
            } else {
              # Escape multi-line values via heredoc syntax.
              if ($value -match "`n") {
                $eof = "EOF_$(Get-Random)"
                Add-Content -Path $env:GITHUB_ENV -Value "$name<<$eof"
                Add-Content -Path $env:GITHUB_ENV -Value $value
                Add-Content -Path $env:GITHUB_ENV -Value $eof
              } else {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }
        }

    - name: Install dev-exec wrapper (windows-diy)
      if: ${{ inputs.env-flavor == 'windows-diy' }}
      shell: pwsh
      run: |
        # On Windows the env from env.ps1 is already in
        # $GITHUB_ENV / $GITHUB_PATH thanks to the previous step,
        # so subsequent steps inherit it.  `dev-exec` is a
        # passthrough that invokes the command via Git Bash for
        # parity with the nix path's bash-c invocation.
        $binDir = "$env:USERPROFILE\.local\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null

        @'
        #!/usr/bin/env bash
        # dev-exec (windows-diy flavor): the env is already
        # in-process for this step thanks to setup-dev-env
        # persisting env.ps1's delta to GITHUB_ENV.  Just exec
        # the requested command.
        set -euo pipefail
        exec "$@"
        '@ | Out-File -Encoding ascii -FilePath "$binDir\dev-exec"

        # Git Bash on the runner looks at PATH; ensure the wrapper
        # is reachable for bash-shelled steps.
        Add-Content -Path $env:GITHUB_PATH -Value $binDir

    # ------------------------------------------------------------------
    # env-flavor: reprobuild
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # env-flavor: reprobuild
    #
    # Build the `repro` CLI from source on the runner.  We deliberately
    # do this rather than fetch a pre-built binary because:
    #
    #   * reprobuild's own release pipeline is still in flight, so
    #     pinned binaries aren't published yet.
    #
    #   * Building from source on the runner is the deterministic
    #     contract — it's what a developer does on their workstation
    #     before `repro exec` is available.  Faster CIs can substitute
    #     a cached binary once that pipeline lands.
    #
    # The build itself reuses the dev env the runner already knows how
    # to materialise: Linux/macOS via the reprobuild repo's nix flake;
    # Windows via reprobuild's own `env.ps1` DIY toolchain.  Both
    # paths drop a `repro` (or `repro.exe`) at a known location which
    # we then prepend to PATH.
    #
    # HOW THIS RELATES TO `sibling-strategy`. These two steps are NOT a third
    # sibling mechanism and the repro path does not duplicate them. They
    # provision REPROBUILD'S OWN build inputs — the flake inputs the `repro`
    # CLI build needs — which is what `reprobuild-provision`'s own header says
    # its remaining scope is. It also says, in the same header, that a CONSUMER
    # project's from-source dependency siblings come from `repro develop --all`
    # against the project's committed `repro.lock`. That consumer half is what
    # `sibling-strategy: repro-lock` runs, below, and it is exactly why `auto`
    # prefers the repro path under this flavor: the CLI it needs is installed
    # here regardless. Under another flavor `auto` declines, because silently
    # adding a from-source CLI build to a `nix` job is not a decision `auto`
    # may take on its own — but a FORCED `repro-lock` gets the CLI installed
    # under any flavor, which is what the two `|| ... == 'repro-lock'`
    # conditions below are for.
    # ------------------------------------------------------------------

    # WHY THESE TWO ACTIONS LIVE IN THIS REPO AND NOT IN `reprobuild`.
    #
    # They used to be referenced as
    # `metacraft-labs/reprobuild/.github/actions/<name>@dev`, and that single
    # `uses:` was enough to break every Windows job in the org.
    #
    # GitHub materialises a composite action by downloading its WHOLE
    # REPOSITORY as a zip, and it resolves the entire action graph during
    # `Set up job` — BEFORE any `if:` is evaluated. So the two conditions above
    # bought nothing: a `windows-diy` job, which can never take either step,
    # still paid for the archive. Measured from codeload:
    #
    #   metacraft-labs/reprobuild@dev                  545,765,842 bytes
    #   metacraft-labs/metacraft-github-actions@dev        185,806 bytes
    #
    # The runner applies a fixed 100-second HttpClient.Timeout per action
    # download, so 546 MB had to sustain 5.46 MB/s inside the guest or die.
    # It died, three attempts deep, 8m16s into `Set up job`, before `env.ps1`
    # or any workflow step ran. Four other action archives on the same
    # connection minutes earlier (189 KB, 492 KB, ...) were fine: the
    # discriminator was size, not the network.
    #
    # Moving them here costs ZERO additional download. The runner keys action
    # archives by repo@sha, so `setup-dev-env`, `clone-siblings`, `setup-nix`
    # and now these two all arrive in the one 186 KB archive the job was
    # already fetching to read THIS file. The 546 MB archive leaves the
    # critical path of every job in every consumer repo outright, rather than
    # being made less likely to time out.
    #
    # Nothing was lost by relocating them: neither action reads the reprobuild
    # worktree. `setup-reprobuild` resolves its helper through
    # `${{ github.action_path }}` (which travels with the action) and clones
    # reprobuild itself at runtime, only on the source-build fallback.
    #
    # `.github/assert-action-archive-size.sh` now measures the real archive of
    # every repo this one reaches into, so the next `uses:` that points at a
    # large repo fails HERE instead of in a consumer's `Set up job`.

    - name: Provision reprobuild dependencies (reprobuild)
      if: ${{ inputs.env-flavor == 'reprobuild' || steps.sibling-strategy.outputs.strategy == 'repro-lock' }}
      uses: metacraft-labs/metacraft-github-actions/reprobuild-provision@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        sibling-owner: ${{ inputs.token-owner }}

    - name: Install the repro CLI (reprobuild)
      if: ${{ inputs.env-flavor == 'reprobuild' || steps.sibling-strategy.outputs.strategy == 'repro-lock' }}
      uses: metacraft-labs/metacraft-github-actions/setup-reprobuild@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        substituters: ${{ inputs.substituters }}
        trusted-public-keys: ${{ inputs.trusted-public-keys }}
        attic-token: ${{ inputs.attic-token }}
        attic-cache: ${{ inputs.attic-cache }}
        attic-endpoint: ${{ inputs.attic-endpoint }}
        repro-build-pin: ${{ inputs.repro-build-pin }}

    # ------------------------------------------------------------------
    # sibling-strategy: repro-lock — the consumer half
    #
    # Runs only when the decision step chose the repro path, and only after the
    # `repro` CLI exists, because the authoritative "is this lock usable"
    # evidence is what the CLI reports: `repro develop --list --json`, which is
    # read-only, needs no network and no token, and names the BACKEND that
    # supplied each pin. The decision step's file-level probe is deliberately
    # only enough to route the composite; see this script's header for the six
    # checks that decide usability, for why a stale lock is not one of them,
    # and for what happens to a declared `siblings:` list on this path.
    # ------------------------------------------------------------------

    - name: Provision cross-repo siblings from the committed repro.lock
      id: repro-siblings
      if: ${{ steps.sibling-strategy.outputs.strategy == 'repro-lock' }}
      shell: bash
      env:
        SIBLING_STRATEGY: ${{ inputs.sibling-strategy }}
        SIBLINGS_INPUT: ${{ inputs.siblings }}
      run: bash "${GITHUB_ACTION_PATH}/provision-siblings-from-lock.sh"

    - name: Clone the siblings the repro.lock path did not provide
      # Two mutually exclusive cases, one step, because both are "hand the
      # remainder back to clone-siblings":
      #   * `auto` chose the repro path and the CLI evidence did not hold up,
      #     so `late-siblings` is the caller's own list (empty means
      #     `.github/sibling-repos`, exactly as the early step would have read
      #     it) — the fallback, taken loudly;
      #   * a forced `repro-lock` had declared entries the lock does not name,
      #     so `late-siblings` is precisely those, each already reported as
      #     outside the lock.
      # A forced `repro-lock` whose evidence fails never reaches here: it fails
      # the step above instead.
      if: ${{ steps.sibling-strategy.outputs.strategy == 'repro-lock' && steps.repro-siblings.outputs.late-clone == 'true' }}
      uses: metacraft-labs/metacraft-github-actions/clone-siblings@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        siblings: ${{ steps.repro-siblings.outputs.late-siblings }}
        sibling-owner: ${{ inputs.token-owner }}
        token-owner: ${{ inputs.token-owner }}
        manifests-ref: ${{ inputs.manifests-ref }}
        private-manifests-repo: ${{ inputs.private-manifests-repo }}
        private-manifests-ref: ${{ inputs.private-manifests-ref }}
        on-lock-override: ${{ inputs.on-lock-override }}

    - name: Configure reprobuild binary-cache publishing (reprobuild)
      if: ${{ inputs.env-flavor == 'reprobuild' && inputs.repro-publish-key != '' && inputs.repro-publish-cert != '' }}
      shell: bash
      env:
        REPRO_PUBLISH_KEY: ${{ inputs.repro-publish-key }}
        REPRO_PUBLISH_CERT: ${{ inputs.repro-publish-cert }}
      run: |
        set -euo pipefail
        # A publisher key+cert were provided: materialise them and export the
        # REPRO_BINARY_CACHE_* env so the calling repo's subsequent
        # `dev-exec repro build` publishes its action outputs to the fleet
        # binary cache. Empty inputs skip this step -> substitute-only (the safe
        # default; fork PRs never receive the secret).
        umask 077
        key_path="$RUNNER_TEMP/repro-publish.key"
        cert_path="$RUNNER_TEMP/repro-publish.cert"
        printf '%s' "$REPRO_PUBLISH_KEY"  > "$key_path"
        printf '%s' "$REPRO_PUBLISH_CERT" > "$cert_path"
        {
          echo "REPRO_BINARY_CACHE_URL=https://repro-cache.metacraft-labs.com"
          echo "REPRO_BINARY_CACHE_KEY_PATH=$key_path"
          echo "REPRO_BINARY_CACHE_CERT_PATH=$cert_path"
        } >> "$GITHUB_ENV"
        echo "reprobuild binary-cache publish ENABLED -> https://repro-cache.metacraft-labs.com"

    - name: Install dev-exec wrapper (reprobuild)
      if: ${{ inputs.env-flavor == 'reprobuild' }}
      shell: bash
      run: |
        set -euo pipefail
        # dev-exec is the policy-mandated indirection so calling
        # workflows don't bake in `repro exec --` syntax.  Per the
        # `ci-shared-dev-env` policy table:
        #
        #   reprobuild → `repro exec -- <cmd>`
        #
        # Calling steps invoke `dev-exec just test` etc. and we route
        # it through `repro exec --` against the calling repo's
        # `repro.nim` recipe (selector inferred from the working
        # directory).
        BIN_DIR="$HOME/.local/bin"
        mkdir -p "$BIN_DIR"
        cat > "$BIN_DIR/dev-exec" <<'EOF'
        #!/usr/bin/env bash
        # dev-exec (reprobuild flavor): re-play the local dev env's
        # invocation contract.  This is the CI-side equivalent of
        # `repro exec -- <cmd>` that a developer runs locally.
        set -euo pipefail

        args=("$@")
        if [ "${args[0]:-}" = "repro" ]; then
          case "${args[1]:-}" in
            build|test)
              has_tool_provisioning=false
              has_daemon=false
              for arg in "${args[@]}"; do
                case "$arg" in
                  --tool-provisioning=*) has_tool_provisioning=true ;;
                  --daemon=*)            has_daemon=true ;;
                esac
              done

              if [ "$has_tool_provisioning" = false ]; then
                args+=(--tool-provisioning=path)
              fi
              # `repro build`/`repro test` require an explicit --daemon
              # selector.  In CI we want the single-shot no-daemon path
              # so there is no background process to clean up between
              # steps or workflow reruns.  Callers that want the daemon
              # can pass --daemon=auto or --daemon=require themselves.
              if [ "$has_daemon" = false ]; then
                args+=(--daemon=off)
              fi
              exec "${args[@]}"
              ;;
          esac
        fi

        exec repro exec -- "${args[@]}"
        EOF
        chmod +x "$BIN_DIR/dev-exec"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

        # Windows runners run pwsh by default; expose the wrapper there
        # too so subsequent pwsh-shelled steps can call `dev-exec`.
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          # Install a PowerShell wrapper plus a .cmd trampoline so both
          # pwsh- and cmd-shelled steps get the same argv rewrite.
          WIN_BIN_DIR="$(cygpath -u "$USERPROFILE")/.local/bin"
          WIN_BIN_DIR_WIN="$(cygpath -w "$WIN_BIN_DIR")"
          mkdir -p "$WIN_BIN_DIR"
          cat > "$WIN_BIN_DIR/dev-exec.ps1" <<'EOF'
        $ErrorActionPreference = "Stop"

        $cmdArgs = @($args)
        if ($cmdArgs.Count -ge 2 -and
            $cmdArgs[0] -eq "repro" -and
            ($cmdArgs[1] -eq "build" -or $cmdArgs[1] -eq "test")) {
          $hasToolProvisioning = $false
          $hasDaemon = $false
          foreach ($arg in $cmdArgs) {
            if ($arg -like "--tool-provisioning=*") { $hasToolProvisioning = $true }
            if ($arg -like "--daemon=*")            { $hasDaemon = $true }
          }

          if (-not $hasToolProvisioning) {
            $cmdArgs += "--tool-provisioning=path"
          }
          # Mirror the bash dev-exec: `repro build`/`test` need an explicit
          # --daemon selector; default to the single-shot no-daemon path so
          # CI does not have to clean up a background process.
          if (-not $hasDaemon) {
            $cmdArgs += "--daemon=off"
          }

          # `$cmdArgs[0]` is already "repro" — drop it before splatting or we
          # would invoke `repro repro build ...` which repro treats as an
          # unknown subcommand and exits with the usage banner.
          $reproArgs = $cmdArgs[1..($cmdArgs.Count - 1)]
          & repro @reproArgs
          exit $LASTEXITCODE
        }

        # Non-`repro build|test` path: pass through to `repro exec -- $@`. The
        # cmdArgs here still hold the raw invocation the caller supplied; drop
        # the leading "repro" (if present) with the same slice pattern so the
        # `exec --` boundary lines up with what the caller expects.
        if ($cmdArgs.Count -ge 1 -and $cmdArgs[0] -eq "repro") {
          $cmdArgs = $cmdArgs[1..($cmdArgs.Count - 1)]
        }
        & repro exec -- @cmdArgs
        exit $LASTEXITCODE
        EOF
          cat > "$WIN_BIN_DIR/dev-exec.cmd" <<'EOF'
        @echo off
        pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0dev-exec.ps1" %*
        exit /b %ERRORLEVEL%
        EOF
          echo "$WIN_BIN_DIR_WIN" >> "$GITHUB_PATH"
        fi

        echo "::group::dev-exec wrapper (reprobuild)"
        cat "$BIN_DIR/dev-exec"
        echo "::endgroup::"
